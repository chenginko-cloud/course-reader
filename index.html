纸和笔来记忆，或者说你是高中生你就得这么做，因为手机实在是太分散注意力了。你在背着背着的时候，他可能突然一条微信，你就突然就就去干别的去了，你打开手机。你的注意力就会被各种各种的消息所吸引，那我问的那些英语专业的呢，他们都是大学生。他们随身都是携带手机的，他们会选择在台队呀，或者吃饭呢，这些闲暇的时间来用手机背诵单词。","但真正到了背单词的时候，人家是不用手机的，人家就是用纸和笔，那你们初高中生不可能随身带着手机。那你就尽量避免用手机背单词，不要用，好，我们继续接着上面的讲，pdf打印出来之后。每天要背诵三次，早上中午晚上啊，一般学校会有早读，这个时间可以背单词啊，没有早读你创造早读。你早去那么提前半个小时上学，创造出了一个早读，你就在那背单词，那中午呢？","比如说你可以是吃完午饭后。然后在午饭午休之前你背一背。然后晚上呢，就比如说在自习课，你写理科写累了，你可以背一背，或者说睡觉之前背一背啊。我要强调的是，我说了，但基础的要求是，你至少要把当天你背过的单词记住，对的就是要求你在晚上背诵的时候。你还要遮住你白天背过的单词，再筛选一遍，因为你一定会忘记的啊，就直接在晚上要再来一遍。确保你在晚上睡觉的时候，今天背过的单词还记得，明天就忘就忘了，我们任何还会复习啊。","筛选的时候记得把中文遮住，我们看英文回忆他的中文就行啊，筛选的过程就是把中文遮住。看着英文回忆他的中文好吧，对吧，那你还要去看词典，因为我们简化的表很可能就是你不理解。我举个例子，大家看到eat是不是知道吃，那吃一定知道它是什么动词，但如果是decide决定。那基础好的肯定知道，decide也是动词，它的名词是decision，但基础一个基础特别特别差的学生。他看到决定的时候，哎他又不知道哎这个决定是动词还是名词呢，那这个时候你就去词典上查一下。","看一下词性，顺便再看一下例子，那这个时候你去看词典上查一下，顺便再看一下例句。例句特别重要，我希望你们在查单词书，或者查词典的时候，或者你在手机app查单词的时候。你一定要刻意的去重视一下这个例句，它会比你单纯的理解一个单词有用的多，这就是我接下来要讲的。背单词还要跟做题跟阅读理解结合一样，好我们现在就讲这个，背单词一定要搭配阅读理解。我们小时候学汉字，他要干嘛他要造劲，在英语里不用造劲了，但阅读理解，因为他阅读理解很。","里面的句子它都是现成的，你去读你去理解就好，但这个呢，每个学生的基础不同。比如说有些人在用我这套方法背的时候，他第一轮筛选就筛选出去了1000多个单词。他有基础的词汇量，那他阅读的时候就会顺畅很多，他需要查词典的地方可能比较少，而有人零基础。那他就可能需要背个10天，先积累个1800的，1800的词汇量再去读，那毕竟说你不能说一整个句子。你80%都不认识，那你一直去查词典，那这样的话耽误时间对吧？","所以说你既要背单词，你要去做阅读理解，理解句子，知道这句话怎么翻译的，你可以拿着一套题，那个题里不有阅读理解ABCD吗？去这里面阅读理解，你也可以去拿个词典去翻，因为词典里会有很多例句，并且它的例句。后面直接跟着它的汉语意思，把单词放到句子去理解都非常棒，好，你按照我这个流程。你背了几天之后。","比如说假设说五天六天，这种几天都可以，可以进行下一次筛选，还是把中文遮住，还是把中文遮住。看你的英文回忆汉译，你立刻就能想到的单词，直接用黑色交换笔划掉，那没划掉的单词也就是你要背。你就是你忘了对吧，那这个忘掉的单词，你就要作为第二天的任务加进去，应该能懂我的意思吧，就比如说你第一天筛200个。假设说你发现，你第五天筛的时候，你发现你第一天背的200个，就剩100个了。好，那你第六天背的时候，你第一天剩下的，忘掉的100个，也要加入到你第六天的任务当中，也就是说你下一次。","你下一天背的150个单词，或者说200个单词，你要先从筛选后，没筛掉的单词开始背。那等你全背了之后呢，就是3500则，这一个表也就全背了，那你再过一段时间，可以打印一份新的单词表。再度进行筛选，忘记的单词，再度通复我们这个过程，这就是一个整个背单词流程，那接下来呢？讲一些大家在背诵中，可能会存在的问题啊，第一点，要不要越级背单词，什么意思，初中的学生背高中的单词。高中的学生背高中的单词，高中的学生背46级的单词，我觉得可以，但没有必要，我问过很多英语高考啊。","140多的学霸。其实他们绝大部分，都没有背诵四级词汇，因为词汇量高达一定水平之后呢，就要看什么了，就要看做题的水平了。要看你的体感，那所以如果你是初三，高三这种毕业班，你绝对不能越级去背单词，但如果你高一，就把单词筛完了，甚至筛了两遍。那想背呢也不是不行，但其实也可以，更多的时间放在做题上，或者说放到你的理科上，对吧，就是无论是中考还是高考。它可能会出现，就是你把单词全背了，也依然遇到了不认识的词汇，靠纲词汇，但绝不会说，这个单词你不认识。","这道题就绝对做不出来，要么它没什么影响，要么它的意思，你可以通过前后文把它猜出来。所以说而且考虑到大家理科，还需要更多的时间。所以说越级背单词，这件事就是可以，但没有必要去背，那第二点就是很多学校吧，很喜欢让大家大声朗读。去背单词，这个效率值得提高，不要太低太低了，不要这么做，你就默背就好，你读出来的话，就会把这个背单词。时长无限的拉大。","然后第三点就是，我要强调的，背单词真的很痛苦，特别难，尤其是前期，那一个礼拜的痛苦期。我突然让你背200个，你一下子受不了。所以我们一天背的量，尽量大一些，我们可以不止150，200，300都可以，我们长痛不如短痛，这样的话。我们就能在一个月之内，把词汇的问题基本上解决掉，再加上中学的问题，中间我们也配合了一点。阅读理解的训练，那这样再去做题，你上手会特别的特别快，你提分的幅度会特别特别大。","一个月就见效。"],"id":"c2-5","course":"自学方法","n":5,"chars":3790},{"chapter":"自学方法","title":"06 听课效率翻倍的办法","paras":["大家好，这里是来教大家如何提高听课效率，你学得不好，跟你听课走神。其实是有很大关系的，那该怎么解决呢，这个时候家长或者老师，他会叫你什么，认真听讲。其实这个就是废话，因为你自己也知道，应该认真听讲，为什么就是很难做到呢，我现在告诉你。因为听这个动作是很被动的，你自己缺少主动的掌控，听只是在被动的接收信息，但你的大脑可以选择。处理这个接收到的信息，或者是不处理，也就是说对你的大脑来说，思考老师讲的内容，这个事可干可不干。","那当一件事情可不干，可干的时候，人万万是趋向于不干的，那所以呢，这节课就是为了教你。如何主动的去听一堂课。首先呢，在你上课之前，你要先判断这节课，值不值得你听，如果这门课的老师，上课只会照着课本念。只会照着PPT读，那或者是喜欢跟你们分享一些，与学习无关的话题，那又或者是说。这节课讲的要讲的作业呀，卷子啊，你已经都弄会了。","那么你就要抓紧，这一节课的时间，去自己去看课本，自己去刷题，整理做题，不要遇到老师的进度再走了。那如果这节课特别重要，你就知道，自己必须要高效率的，去接受这节课的内容。但是你又害怕自己出现，犯困啊，走神啊，跟不上老师节奏啊，这种情况。","那么你就要有意识的去训练，以下我说的几种方法，并把他们呢，形成自己的习惯，第一呢？是注意力的训练，这个我在另一节课里，已经着重讲了，大家去看那个就可以了，那第二呢？只要老师提问题，你就要，努力的去把这个问题回出来，如果老师问的是知识性的问题。即使你不知道答案，你要马上翻书，并去寻找答案，如果老师问的是一道理科题，那你就马上的拿出纸和笔来算。这里提醒大家，上课前桌子上，一定要放好草稿纸，不然的话，你草稿纸找出来的时候。","大家都算完了，那如果问的是一道文科题的话，你也要像自己平时写作业，像自己平时考试那样。你去把这道题，去认认真真地做一遍，而不是坐在干等老师讲答案。其实这个方法的本质就是，就是，不是要你一定去接老师的话，而是说，你要一直保持着你的脑子在思考。这关键在于，你为了把老师的问题回答出来，你就要去思考，去探寻答案，这个过程特别重要，而且这样呢？它能保证你自己跟上老师的节奏，而如果有同学，抢先一步回答出来的答案，你也不能放过这个问题。","你还是要探寻一下，这个答案是怎么来的呢，或者是说听老师去讲一下，是为什么，如果老师不讲。你就把这个问题记在草稿本上，跟着老师上课的进度，接着往下听，等到下课了，你再去跟着老师。根据你草稿本上刚才的记录，你再把这些课没搞明白的地方，继续给他弄懂，同理，如果老师上课讲到了一个。你任何没有听懂的点，你千万不要死磕，你先把它跳过，先去听后面的内容，去跟上老师正常的节奏。等下课了再返回来思考，那有些人可能在老师上课的时候，有一个点他不会，他就立刻。","直接一直在去死磕这个点，导致后面的课呢，他又没有听到，反复训练这个方法，一段时间之后呢？你就会发现，这个方法它有另一个好处，你会发现，你越来越习惯的，在课堂上与老师互动，也越来越能够。快速的回答出老师给的问题，这会给你带来一种成就感，当大家还在走神啊，或者是慢慢。慢慢吞吞的翻书，慢慢吞吞的计算的时候，你已经甚至能够做出答案了，因为能够在课堂上。多度集中注意力的同学，他真的是太少太少了，而这种效率，而这种你这种，把课堂效率利用好的方式。","简直就是在开挂，会帮你进入一个良性情况当中，那第三个方法呢？其实我们在第二点的时候，已经提过了，就是你上课的时候，手边一定要纸和笔，就用来记录两个东西。第一，你在这堂课上遇到的，你没有听懂的问题，你先记录下来。然后继续听，等下课再返回来解决这些问题，第二呢，记录让你走神的事情，那一堂课四五十分钟。谁难免都会有几个走神的瞬间，就你个听着听着，总会冷不丁的有几个想法，突然出现在脑子里。","比如说，课上着上着，你突然想到，下课要去办公室找老师，或者说，你下了课老师要考的课文。你还没背熟，那你下课要再看两眼，或者说除了学习，你们老师又安排你做什么版报。你突然又有一个，关于版报的灵感出来了，就是你一旦脑子里出现了，与这节课无关的内容。立马用最简洁的方式，把它记录在本子上。","然后马上忘掉，接着听课，等下课再去处理，这些细碎的事情。总之你就要反复告诉自己，只要这节课值得听。那么一切影响，我接下来听课的事情，我都要先放一放，我这40多分钟的主线任务，就是把老师讲的内容。我最大程度的吸收掉，那这个方法呢，也是需要你有意识的去训练，它可以成为你的一种能力。不仅在上课的时候，你在自习的时候，在任何你需要全神贯注的时候，这个小技巧都可以帮你。很大程度的提高你的效率，这个方法它的本质是什么呢，本质就是，在你需要集中注意力的。","这段时间段里，你要手动的去屏蔽，干扰你的一些想法，专注当下，不去想别的事情。注意力就不会跑到，另一件事情，上去。最后啊，上课做笔记，有没有必要，这一直都存在很大的争议，我的建议就是，对于听课效率。本来还不错的同学，你可以根据老师讲的内容，根据老师讲的内容，你是否需要，来选择性的记笔记，而对于那些。没过几分钟，就要跑一次神的同学，你就尽量的去记笔记，因为这个时候，你的笔记记录的。","并不仅仅是老师讲的内容，更多的是，帮助你老师，帮助你跟上老师的节奏，更多的是一种辅助的工具。所以你能够，这相当于，这个笔记相当于，小的一个复归机制，从你写课的笔记呢，就可以反映出。你这个学了多少内容。但是记住了，写在本子上的，永远比不过，记在脑子里的。","所以说，无论你是哪一种情况，我前面讲的三种方法，你都要去训练，那三种方法，是帮你从根本上。提高课堂效率的，是能够帮你从课堂上，这四五十分钟，和别的同学拉开差距的，而记笔记呢？它只是一个辅助。所以说不要本末倒置，我以前和班上的一些学霸，讨论问题的时候，他们经常能够快速反映出来，这个问题老师上课讲过。是这么这么做的，有一些很努力，但成绩中等的学生，往往是笔记一字不落。","但是课后老师讲过什么，他全都忘了，这就是课堂效率的区别，我们最后来总结一下。提高课堂效率的关键在于，要把听课变成一个，积极主动的事情，积极的思考，积极的回答问题。主动的赶走脑子里，会干扰自己的想法，当你开始转变，对听课的这个观念的时候，你就能够。把你的课堂效率，做到翻倍的一个结果。"],"id":"c2-6","course":"自学方法","n":6,"chars":2548},{"chapter":"自学方法","title":"07 语文的学习方法","paras":["我们这节课的题目是语文这个学科该怎么对待，语文这个学科在高中地位很特殊，这个科目想考的好特别难。想考的不好也特别难，在教你如何正确对待语文之前呢，你要先想一下你高考的目标。只要你不是想要考进全中国前十的那种985大学。其实你都不需要花费大量的时间给到语文，在评目前听课的可能是高一高二或者高三。你已经经历了中考啊月考啊等大大小小的考试了，你一定要对自己有一个正确的评估。咱们的目标不是定的越高越好，而是越实际越好，因为我们把语文的时间省出来，是为了大量的投入到理科当中。","那我们如果不投入大量时间到语文上，该如何拿到一个性价比比较高的分数呢？首先你的语文是不需要听网课的，我这一句话其实已经帮你省下了很多很多时间了。因为语文网课，可能是所有科目中最庞大时间最长的，而且听了也不一定能做对。注意啊我这里不是说语文网课没有用，如果你追求130分以上的分数的话，还是可以听网课的。我只是说它特别占用你的时间，对于理科还没有学好的那些学生来说，他们压根就没有这么多的时间给到语文。","那你语文该怎么办呢？其实就正常的跟着学校老师的进度走就可以，老师讲什么你就听什么，你可能觉得他讲的不好。你就相当于在记忆在积累了，啊，你们学校老师，有的作业呢，你有时间就做，如果没时间的话。照着答案写一些也可以。然后平时呢，你如果遇到什么好的作文句子呀，素材呀，你可以抄到本子上，或者直接把它踩下来。粘上也行，当然了，这个前提就是你每周都要回顾你这个积累本，如果你没有经常翻阅的习惯的话。","你不做也也罢，另外就是大家都听过语文最重要的是积累，那怎么进行积累呢？其实有两方面特别重要，是分别是阅读和背诵，就哪怕就阅读，哪怕你是读小说，对你语文都是有提升的。我高三的时候经常还做一件事，有语文套捐的小说，学校发的链刺，还有自己买的题，就每个字它都会有一道小说或者散文。我每次学不进去了，我就去读那个，后来呢，我经过语文大佬的点播，就不仅仅是读，而读完之后。我还会用一句话来概括一下，这篇小说讲了一个什么故事，一开始我还不太会概括。","写的特别长，才能把这一篇文章，概括明白，后来呢，写的多了，就能用一句简短的话，就能把这个小说给说明白。然后就是读题目，它有两道主观题，我一般读完一遍题目。然后思考几十秒之后，开始读答案，答案呢，读个三到五遍，就是为了阅读，因为读文章也是读。读答案也是读，那读答案的话，还能积累语感，这多好呢，再然后就是背诵，无论你是高级啊。语文其实都离不开背诵，这个纯文的科目嘛，顶多就是你到了高三，你还要把真题重视起来。","背诵什么呢，以下几点是你要背的，排名不分先后，第一，作文素材，尤其是那种满分作文里面用过的。别人用过，你就可以照葫芦画瓢，这里啊切记一点，我说的是背满分作文里面的素材。是人家用现成的，而现在很多学生，他背的素材都不知道怎么用，什么类型的作文适合。他也不知道。","所以说你就直接背人家写过的，你不要背那种，就适合什么主题，适合什么主题的，你最好就背人家用过的。第二呢，就是古诗文啊，名剧名片默写，这个越早背了越好，很多人喜欢累积到高三再背。但其实高三你的任务真的会很多，你最好在高一高二就把它背下来，多背几遍，这个六分是我们是势在必得的。你们高中那个街边的那个书店，他就会卖那种语文啊，这种古诗文默写的小本子，你买一个背就行。那种能揣到口袋里，因为他卖的一定是适合你们高考的版本，你去网上买怕你买错。","第三个就是文言文识词，背识词的目的就是为了翻译出文言文嘛，对吧，同时呢也是能够让你抓到采文点。基本上你背的那些识词，只要他在一个让你翻译的句子里出现，那他大概率就是一个采文点。你做这个文言文阅读。其实就跟做英语一样，就如果你能把它翻译成咱们现在汉语，那你做对的可能性就很高，而且文言文是语文科目性价比最高的板块了。","所以说希望大家一定要重视，不仅难度不等，而且分值还挺高的。第四个就是那种小说呀，散文的答题模板。比如说什么人物描写，什么环境描写，地级人称的作用啊，这些在那个你们一轮复习，那个大后的那个本上会给你们总结。你适当的背一背。","然后在你写主观题答案的时候，你就能够更像标准的贴近，当然了，或者你像上面我讲的那样。多读去多去读答案，也能够积累这个语感，而这些就是你在整个语文学习中，要背诵的东西啊。像诗歌剑场这种压轴题，它的性价比比较低，我们先不考虑它，也就是意味着你把，理科学累了。想学学语文了，你就背一背上面我说的那四个板块，性价比比较高，那如果你现在已经高三了。你在高考之前，你还要把最近几年的整体，至少做一遍，我说的至少一遍，你多做几遍是没问题的。","然后我还发现有些人，他不知道该如何利用语文整体。其实很简单，选择题你就正常做，对。然后对答案，对答案理解答案的逻辑，千万不要钻牛角尖，不要拆杠，把自己的思路向高考答案靠近。然后主观题，你就是在读完文章之后，读两遍问题，有思路的话，可以杜米写一些，看看答案贴不贴近。没有思路的话，你就直接看答案，答案读个三到五遍。","然后理解一下。然后合上答案自己再写。其实就是一个，向答案靠拢的过程，因为没有人能够写出。那么标准的答案，我们只能说尽量的接近它，那我们总结一下，就是你高一高二，你就正常听学校老师的课。顺便做做作业，哪怕你们学校老师讲的不好，你就当在积累东西了，积累一些语文的知识了。课外题你不用买，也不用做。","然后课外的网课也不用听，如果就实在就是，就是理科学的太累了，想听一听。比如说像石油，老师这种，他们讲课都比较有意思，那你可以听一点，听一听，这种不要听的频率太高。因为真的是理科，真的需要大量的时间的，相当于我们只需要，我们在高一高二，只需要抓住好课内就行。说外无聊的时候，我们可以背一背，背诵的话，就上面我说那四个板块，就背那四个就行。那你到了高三，你就要主动的去做一些真题了，高考前做个几遍是没问题的，最好做个两遍到三遍。","平时遇到那些好用的素材句子，如果你，你经常翻阅那个积累本的话，你那些一错的词词。你就找个本子积累一下，你把这些简单的做好，你语文110分左右就没有问题了，这个成绩对你考一个211，对你考一些普通的985。都已经足够了。然后呢，你看我这个讲的，可能是在教你如何混语文，真的是不用太长的时间。","但是呢，肯定还会有一些学生，想要冲击一个更高的分。比如说想要上120，130这样的，那我们也找了一个，高考语文130多分的学姐。来给大家做了一期分享，当然那一期我不仅建议，想要考高分的人。其实语文成绩不高的，也看一看，因为他更多的分享一些，做题的思路什么的，也建议大家看一看吧，就是还是那句话。先把理科弄好，再考虑语文这些学科。"],"id":"c2-7","course":"自学方法","n":7,"chars":2699},{"chapter":"自学方法","title":"08 网课的正确使用方法","paras":["我们这也可讲网课的正确省方式啊，不得不说网课的出现，很大程度上抹平了教育的差距。我说的不仅仅是一些高考大省，和一些小省的区别，就算你们省的教育资源特别好。那又有几个省中点高中呢，就算你进入了省中点的中学，你就一定能保证你教你的老师是好的吗？因为每个高中基本上，它都会有重点班和非重点班的区别。","所以说大多数学生所享受到的资源，老师其实都不是很好，那一个学生呢，如果一辈子能遇到几个好老师，就很有福气了。真的真的不敢奢求，自己每个老师都教得贼好，那这个时候网课的出现，就有很大的作用了。其实家长们都明白这个道理，你不喜欢哪个老师，你不爱听他讲课，你不好好学这课。","最后坑的肯定是学生自己，但很多学生还小啊，他根本就想不明白这个事。所以说他真的不喜欢这个老师，他就真的不学这一课。但是我们高考绝对是不能放弃一个科目的，这就要给他挑一个喜欢的网课老师来听。但我还是要说啊，就能跟线下老师最好线下，也许他讲的不如网课老师好，但他给你讲课的时间是最长的。即使他讲的不好，他给你多讲几遍，你也就学会了，那下面呢，我们讲的是，就是学校老师讲的实在是难以接受的情况下。","我们网课的选择以及该如何使用，那先提几个网课的大要求。第一个就是我们屏幕上的一个网课，老师一个科目跟一个极客，而这一点就是告诉大家不要乱学。比如说你听这个老师的函数，你又听另一个老师的数列，你再换个老师学立体，这样就不行了。因为一个老师有一个老师的教法，有一个老师的思路，你可能在他这学了函数，那他在讲以后的章节的时候。他还会引用他之前讲过的函数知识，那这样的话你就能连贯上，那挑选好自己的网课老师。","自己喜欢的你就跟到底。其实现在网上教课，就是那些名气很大的老师，他教的都很不错，那最重要的就是看他适不适合你。只要你爱听就没什么问题，那第二个大要求就是，你听网课的科目不要过多，最好的搭配就是那种老大男的理科。加上某一科你学不会的某个章节，真的你不可能做到六科都跟网课，那样的话会把你的作题。时间全部压榨光。","比如说我当年物理不好，生物的遗传不太好，那我就听物理的网课和生物的遗传，那你如果数学也不好。那你就最多再加个数学，那语文和英语这种科目，尽量不要听网课，这两科我都有专门逐课去讲。英语你就按照我的方法去背单词。然后刷底先刷专题。","然后隔段时间再复习单词，你就可以就没有必要去听网课了。但是你不能曲解我的意思，不是说语文和英语听网课不能提高，只不过是我们时间有限。要把我们那种不听网课。然后把那种不听网课就学不回的理科，排在优先，这两个要求大家要记住。","然后我们讲网课的使用方式。首先你要把你要听的网课的内容的，空白讲义打印三份，或者说去网购三份，如果说这个老师有笔记版讲义。那你就两份空白讲义，一份笔记版讲义，笔记版讲义就是老师在讲完课之后，有的老师会把自己讲课过程中写的笔记。等电子版发给你们，我记得招数学的赵立贤老师，他就有这个习惯的，这个会让学生很方便。那首先呢，在听网课之前，不用提前做一面讲义，你直接拿着空白的讲义听就行了，如果你有笔记版讲义。","你就直接拿着笔记版讲义听，听的过程中，你就可以在你这个空白讲义上，做一些记录。如果你是笔记版，那可能就不用记了，你会把你，你可以把一些不知道的，不熟悉的知识啊。方法啊，大招啊什么的，就记在你手里的这份空白讲义上，把它从一份空白讲义，变成一份笔记版的讲义。你不需要记得太详细，你自己能看懂就行，那一节课听完之后，最好在当天，就把第二份空白讲义。拿出来选择一遍，如果你时间排不开，那你第二天也可以，那这份空白讲义就是，老师上课讲的内容，就是说。","你已经把这里面的题目的内容，都已经听懂了。但是你课后，你还要靠自己，把它们一步一步的，重新全算出来，很多人都说，老师上课一讲就能听懂。一道考试就做不上，就是因为这个原因，他缺乏自己独立做题的过程，你在做第二份空白讲义的时候。你一定不要看任何的笔记和提示，做空白的，有不会是正常的，你不要觉得你昨天听完了。你今天就一定全会，不可能的，你自己去给它全做出来，做不出来的，你就把它标记成错题。","标上就可以了，那这个时候呢，你就可以去看，你听课手机的笔记，这个笔记的作用就是提示你。让你想起来，当时老师是怎么讲的，这样比你重听那一道题的效率要高，那第三份空白讲义呢？我们只刷错题就行了，放在你做完第二份讲义的，后几天即行，具体是几天呢，看你的习惯吧？但需要有这么一步，知道吧，那这里我们，再巧妙一下，对待错题，我们基本都是这么干啊。做错了之后，核对答案，认真学习那个分口答案，就那个详解的答案，你觉得自己懂了。","你就把这道题，完完整整的重做一遍，重做的时候，不要看任何提示，如果你能完完整整的。把这道题做对，那你这道题就可以过了，如果不能，再去判答案，重复我上面的流程，好这是对待错题。我讲的很快啊。然后这里呢，我们再说，记得注意事项，那第一点，我们的听课是直接去听，听之前不必提前做讲义。那这个时候，可能有学生问，那我不做讲义，我听不懂怎么办，你听不懂，是因为你的基础不好，而不是因为。你没有提前做讲义，因为即使你提前做了，你该听不懂，还是听不懂。","所以说这个时候，你需要去翻教材，攻读教材。然后做教材的课后题，去网上搜课后题的答案，把它学会。然后再去听网课。注意啊，我现在讲的是实操，需要你记住的，要是你还听不懂，你就可以换一个，讲的比较细致。比较基础的，这样的一个老师，那第二点呢，网课的暂停和背诵，一定要好好利用，虽然我没有提前做讲义。","但是那种，看一眼就立刻出思路的题，你就可以去背诵看，那到了不熟悉的题，你再调回你的正常速度。那老师让大家思考的时候，你就可以暂停思考，那或者他不需要，就是他没让你思考。你可以自己主动的暂停去思考，很好用的功能，那另外呢，就是一个比较大家比较关心的。一个贼重要的东西，网课跟刷题的平衡，先说结论，网课的效果不如刷题，如果让你二选一选刷题。可能有时候同学会问，那既然网课的效果不如刷题，那为什么不都去刷题呢，对，如果你一直能做到。","一直去刷题，刷题改错复习，这三个循环，这样效果是最好的，但问题是有些人他刷不了题。简言一个学生，我们先说一下，简言一个学生，基础好不好的办法，就是说，看这一张题目的答案解析。想起你能不能看懂，如果你能看懂，说明基础还可以，如果你连答案都看不懂，那说明基础太差了。基础不行，怎么办，上面说了，通读教材，做课后题。","然后再去听网课，你就直接去刷题，改错复习即可。所以说我们听网课，是因为我们不会。比如说我举个例子，导数，即使你数学能考120分，你导数答案看不懂，也很正常对吧？所以说你需要看导数的网课，那还有一个优点就是，另外网课有个优点，网课老师会帮你总结题型，而当你就是。你能自己总结题型的时候，你可能已经刷了，同类型的题，刷了几百道，才会自己总结，而你看网课的时候。网课老师会直接给你总结。","比如说遇到什么什么样的字眼，你就会出现什么样的思考，这种他会给你总结好，还是那句话。自己能答案解决的问题，就不要上升到视频，因为视频会把效率，打好几次的折。那么高一高二的学生，如果你通过网课来学习新课，那这个时候你网课的时间，就应该大于刷题，对于高三的学生来说。你刷题的时间应该大于网课。"],"id":"c2-8","course":"自学方法","n":8,"chars":2939},{"chapter":"自学方法","title":"09 刷题的正确方法","paras":["大家好，我是星星，咱们这一课讲刷题，这个其实很简单，但它就是有一点杂，我把你该知道的都梳理一下告诉你。首先呢，是选题，市面上的恋人车啊，套卷啊，它都是有一定的质量差异的。但是它对你的影响实在是没有你想的那么大。首先就是，你手里的题一定要少一些，你不要看见什么都想买啊，就是最后你看着你那么多恋人车。你都没有做，只会让你更焦虑，我举个例子，如果你非毕业班，初一初二，高一二这种。","首先，同步学习你需要教材，看完教材之后你要听老师讲课，老师讲完相应的内容，他会留作业。是吧，这个作业就是为了练习他讲过的部分，这是一个正常的流程，留的作业大概率就是。你们学校给你们发的恋人册，那这本恋人册的提量够不够呢？","其实对于中等啊，以及中等以下的学生来说，已经够了。但是对于成绩比较好的学生来说，可能不太够刷，那这样的话，你就可以搭配一个金考卷的。单元双册卷，对，它就长这个样子啊，你做恋人册上面的，都是题目，但这个双册卷呢，是把你正在学习的内容。它铺成了一套卷子，老师卷子那样的形式，那你知道大概它就该怎么用了吧，就是你计时的考试就行。可以把它放到一个。","比如说时间比较长的晚自习，或者说周末，你一口气把一套卷子做完。然后对答案改错，不带错题的方法，我记得我网课那一课里已经讲过了，我再说一下啊，就是错题出现之后。你立刻的去看详解答案改错，算懂为止，算懂了之后，不看任何提示的情况下，重做这道题。如果你能完完全全的独立的做出来，就分明就要进行会了，否则你就重复看答案的流程。你做题要隔几天要重复，重新复习的。","然后上面说的，金考卷考试的训练，它非常有助于你在月考中，取得不错的成绩。然后水平差的学生。其实一本链车就够了，那怎么区分呢，你就看，你把学校的链车做完，把并行已经三刷了错题之后。你看你还有没有空余的时间了，如果还有余力，你就可以买那种金考卷双，如果没有的话。你也不用勉强自己啊，我要告诉大家一个事实，就是你在高一高二做过的题，基本上到了高三都忘了，就这类题大概怎么做。你可能还会记得。","但是你已经记不清，这道题你是否做过了。所以我们在高一高二的时候，尽量的不要去怼量，而是怼质，每道错题尽量刷个三倍以上。保证质量，至少在那个时期，你保证你真的把聊题学会了，我们很难奢求到高三的时候，还能记得，对于高三的学生来说。一轮链车，学校买什么就用什么。","但是一定要有详细答案，区分一本教符好不好，首要的就是答案，答案是不是详解的。那种选择题答案，只有选项的教符都不要用，答案没有详解的教符都不要用，要选那种答案详细点的，就无论你是初级还是高级。买链车都先看答案。其次，白板，有学生喜欢自大的教符，有学生喜欢自小的教符。","总之就你看起来舒服，有做题欲望的教符，就是你就是就买那个就可以了，有些链车一分开。密密麻麻那个字，我看着就不想做，那这种不喜欢的你就不要买，还有一点就是，选题它也有质量高低之分。比如说真题的质量一般是最高的。其次是优质的模拟题，那什么模拟题是优质的呢，我教大家一个，判断的方法，搞的人越多。答案这个题目的质量就越高，那种多个省份的连考，或者是什么省级考试，再到大的市级考试。再到几个学校的连考，就最后到你们学校自己考的这种卷子，就人数越多，估计人就会越用心。","所以说为什么真题质量最高，因为它考的人最多，而且它出题时间也最久，像那种几省连考的模拟题。学生们还能区分一下。但是到了市级，一般学生就没有听出过这个事来，就不确定这个题到底好不好，那这个时候一般金口卷的选题。目前是质量最高的，就到了高三，金口卷有一个特快专递系列，那里面的模拟卷是质量更高的那种。","然后我们讲一些关于做题的碎碎念，就是你平时在学习新知识的时候，你先把书上的立体搞明白。然后你再去搞书上的课后题，报告题的答案，你就上网人一搜就好了，报告的简单题。你给它搞明白之后，你再去把其他链丝上的复杂的题，你再去学，也就是说你对于新学的知识。我们要遵循一个先易后难的原则，包括高三同学复习的时候，如果基础太差了，你想要从头学起，就要先做书上的题。再做链丝，卷子，有的同学问，可不可以学完新知识就做难的题，可以倒是可以，但这个取决于人。","比如说聪明的人，就可能一下子就搞出来了，但如果你没有那么聪明的话，可能你会找不出来。所以说我不建议你这么做，有些同学会说自己什么，语文基础，英语基础，历史基础，这种基础不好。这就是文科的刷题。其实你不存在基不基础的，就大部分的文科知识，它只存在会与不会，这是跟理科比较大一个区别。","注意啊，我说的大部分，还有小部分知识是有关联的，因为文科的知识，它并不存在什么。先怎么样后怎么样的，这么一个逻辑关系，就比如说你有一些小学的词汇不会，影响你背高中的单词吗？影响你背四六七四会吗，不影响，再比如说你不知道鸦片真正是什么，不能影响你去背新手条约。马关条约啊。","所以说这些情况下，你可能就觉得这些东西你一直半解，是因为你还不会它，知道吗？所以说文科的题目，你刚开始看高考题不会，有的同学会把书上的这一块的东西都看一看。其实没有这个必要，你看完卷子上的题你不会，你分了答案不就会了吗，对不对，你去看答案嘛。分了答案之后，你再去学习答案的答法，去默写去记。","然后把不会的题变会，你下次遇到不会的题，你就继续这么搞，对于某种什么，就是那些经典的题啊。你一定在刷的足够多的基础上，去总结一下这类题的做题方法的思路，你注意啊，你要刷的足够多才能总结。不是说你做个三五题，就强行的总结，这样的话，你以后哪怕这个题型你遇到了创新。你也可以按照之前总结的几条思路去思考。"],"id":"c2-9","course":"自学方法","n":9,"chars":2262},{"chapter":"自学方法","title":"10 考试心态的正确方法","paras":["大家好，我们这节课的主题是如何正确看待考试。其实考试这个话题呢，一直是我们心里的大块头，有考试死循环是这么说的，考试之前，焦虑地复习一个礼拜，然后考两三天试。考完之后呢，对答案，老师讲卷子，发现自己怎么错了这么多呀，很难过。","然后就导致自己学习状态不好，过几天呢，我刚要调整过来，结果出成绩了，一看自己考了那么点分，又难过了。等调整好之后，努力学了几天发现，哇，马上又要下次考试了。其实一般我们大概是一个月考一次试，那一次考试呢，可能前前后后就能折磨你半个月。","其实这就是大家对考试的认知不够所导致的，就导致大家一直被考试折磨着。其实不光大家这样，连学校和老师对考试的认知也不够，你想想，如果他们真的懂的话。他们就不会只盯着学生的成绩，而是应该去给每一个学生去分析他们的错题。然后去找到这个学生的问题所在，那如果他们懂的话呢，他们出题的时候，他们就不会刁难学生。很多老师的时候在选题的时候，这些题都是我上课强调过的啦，我都讲了一百遍了，学生们肯定会。","那我应该选一点什么，选一点创新的题型，考一考这些学生有没有变通的能力。其实这样是大错特错的，越经典的题，在高考中次数出现越多的题，包括在课堂上强调变数越多的题。其实这种题无论讲了多少遍，他都要拿出来再考，因为这个东西，无论你如何强调。他一定还会有人做错，那我假设一个班可能大概有50个学生，那就至少有10多个学生是做不对的，甚至还会更多。那没准做不对的就是在屏幕之前看课的你，你要知道，耳朵听懂了，跟你在纸上能不能写出来。","这是两码事，我平时带学员，我带的都是大学生，甚至是985211的大学生，我教他们一遍，教两遍，教三遍。他们有时候也会忘，而且你还在高中阶段，你想想，你肯定是，有可能做不出来的，我们说在高中阶段。把不会的题做对，证明不了你有本事，你如果能把你会的题全做对，那你才是有本事的人。你要知道，考试是干嘛的，考试是帮你找出，你在最近学习上，你的提醒上有漏洞的地方。找出那些你自认为你学会了，你自认为你听课听懂了，但发现你考试其实你自己根本就做不出来的。","它是用来提醒你，你学过的知识是要经常，复习的，它是让你来试验考场的那个紧张氛围的，就这三点作用。给我记牢了，就这三点，我再强调一遍，第一，发现你学习上提醒上的漏洞，找出那些你自认为会了。自认为听课听懂了，但其实你根本就做不上的题，这是第一点作用，第二点作用，提醒你。你学过的知识要经常复习，这个一直强调，第三，让你试验考场的紧张氛围，很多人高考时常发挥。","其实他就是没有试验考场的氛围了，那你说大部分人。其实大部分人都是我上面说的那种，被考试一折磨就折磨半个月，那为什么还不取消考试呢？为什么，就是因为这三点好处，的帮助实在太大了，而且我们中国是应试教育，应试教育就特别需要这种阶段性的检测。","所以我们说，他明知道坑了很多学生，但这个考试还是不能取消，那我这节课的目的就是。帮助大家把考试的认知提上去，让考试对大家来说只有好处，没有坏处，那首先呢你要在心中记住一个原则。那就是除了高考之外的，所有考试都是演习，他们都不重要，你想想啊在逢年过节的时候。你的亲朋好友在饭桌上问你成绩的时候，他们问的是什么，问的肯定是你的高考成绩啊。谁会问你高一期梦，谁会问你高一期中考了多少分呢？","所以说大家千万不要把平时的分数看得太重，他们真的一点都不重要，当然了我说的不重要指的是分数不重要。那么他们不重要意味着什么呢，意味着，你考前压根不需要复习，你把这句话记住，你的月考啊。你的期中啊，包括期末那些考前都不需要复习，我们的目标只有一个，高考，而你平时三年所有的学习都是在给高考复习。你会发现一个很普遍的现象，当一次考试，他的考试范围出来之后，大家都会投入到这个考试范围内的紧张复习中，甚至有些学生连新课都不听了，就全力的学考试范围的内容，这样就大错特错。","首先，这个考试一点都不重要，它只是高考的一次小小演习，没有必要忘思力复习，第二点。这次考试的目的是为了把你的错误筛选出来，把你掌握的不稳固的题型来挖掘出来。你如果通过考前几天的复习，把这些都覆盖掉了，那你这次考试的作用该如何体现出来呢，对吧？通常大家考试的错题跟你平时的错题相比，你肯定会更注重考试的错题，对吧？","所以其实你没有必要搞那么紧张的复习，你就是要让你在学习上的问题，自然而然的暴露出来。然后去重视它就好了，考前你顶多把这段时间的错题再看一遍就行，当然了，看错题本来就是你平时要做的事情。所以说大家一切如常，该学啥就学啥，该往下学就往下学，就当你在平时学习的中途。抽了两天时间去考试，其余的一切照旧，好，那第一个误区我已经给大家指出来了，你要做的就是把考试中的错误给他牢牢记住。","最后把他那个分数给我忘掉，因为那个东西不但没了，没有什么参考意义，甚至还会影响你的心情，进而影响你下一段的。下一阶段的学习，那所以你按照我的思路来看，你考试错的题越多，那你反而应该越兴奋。因为你换一种角度来看，你的收获更多呀，你问问那些考了700分的人，他们难不难受。他们辛辛苦苦考了一次试，基本上没有什么错题，对他们而言，两天考试时间白白的浪费掉了，而你呢？你在这次考试中满载而归。","所以说你的眼睛里只盯着你的错题看，你不要受到你分数的影响，那一次考试，对你来说就是百利而无一害的。但是你依然要记住，我前面说的那三点考试最重要的作用，把那三点贯正下去，一次考试对你的帮助也就最大化了。那另外呢，建议大家在考试的过程中，做这么一件事，统计一些题型，自己所需要用的时间。我举几个例子。","比如说语文作文，英语作文，数学天选，数学的大体，或者是像英语，外形天空啊等等等。每次考试的时候，你就记下来这些，自己做这些题型要用多久，你记的次数多了之后。你心里就会有，会对你做这些题型的时间，有一个大概的预测，这样你在做题的时候，就不会手忙脚乱。","比如说有些学生，不知道自己写一篇作文，大概要多久，他做题做到后面的时候，抬头看了一眼表。因为自己不确定啊，不确定时间还够不够写作文，他就先跳过去写作文了。所以说希望大家，一定要对自己有一个正确的认识，我再拿数学举个例子。","比如说有些人测试自己的数学大体，他的数学大体，大概需要一个小时能做完，那你在做小题的时候。你就要注意了，如果你做小题，已经做了一个小题，一个小时了，那你就抓紧停下来去做大题。哪个分值高，你得知道啊，数学大体占的比例更高，而且小题你可以蒙上，大题你不写。肯定是没有分的对吧，语文什么的。","其实同理的，语文作文足足有60分，你再知道了，你写一篇作文，大概假设说要用一个小时。在这个前提下，你看距离考试结束，就剩一个小时了，但这个时候你就得抓紧，你做题的速度就要加快。以便于你赶紧去写作文，或者说你直接就跳过了，直接去写作文也可以，就我希望大家。在听完今天这个课之后啊，就不要再畏惧什么考试了，这是你必须要适应的，只不过考试的结果不重要而已。很多人从考场出来，跟同学聊两句天后，一排大腿，我去，这道题我本来得做对的呀，或者说一出考场。","你在考试中，本来想不明白的题，你突然就开窍了，那这些是怎么回事呢？其实就是你参加的考试太少了，你还在被考试压制着，你的洪荒之地都被压制住了。你每次都发挥不出来，自己的真实水平，那等你彻彻底底接受了考试，你把他当成一个老朋友一样，那个时候你的功力，才能完全的展现出来。那你想成为老朋友，你要干嘛，你要跟他混得熟一点吧？","所以说你每次考试，都尽量去参加，尽力而为，久而久之，你也就适应他了，还有就是你们平时考完的那些卷子呀，跟我之前讲的那个错题本。它是一个道理的，你平时爱翻，你就弄一个卷夹子，给他整理一下，如果你没有平时翻看的习惯。那你就直接把，当场把卷子的上的错题消灭就好。"],"id":"c2-10","course":"自学方法","n":10,"chars":3139},{"chapter":"自学方法","title":"11 处理错题的方法【特别重要】","paras":["大家好，我们这个标题是错题该如何对待，该不该弄错题本，在讲这个问题之前，我先给大家讲个故事。我有两个考到了北大的学长，他们两个在高三的时候对待错题本是截然不同的策略。一个学长是特别认真地整理错题本，本子上的题目答案都是自己认真整理的，连题干都会原封不动地抄上去。","但是他同时有一个好习惯，那就是经常翻阅，具体有多经常的频率我不太清楚，但反正他的错题本里的每一道题都被他完完全全地掌握到了，而另一个学长他就不做错题本。但他会当场消化自己的错题，什么意思呢，就是他遇到错题之后，他会当天立刻重做并且把它标记出来。","然后隔段时间再回顾，好事题也这样，一直回顾。所以说他会把卷子整理到特定的卷夹子中。然后定期回顾一下，他并没有属于自己的错题本。所以说我觉得这两个学长的错题本，做法都反映出了一个问题，那就是错题的重要性。他第一位学长甚至是我们黑龙江当年的理科状元，两位都考上了北大，这说明什么。说明只要你把错题学会，有没有错题本。","其实影响是不大的，不一定非要弄一个错题本，有些学生他会写厚厚的错题本来感动自己。觉得自己真的下很大很大的功夫，特点都把自己感动坏了，说不知他自己并没有把每道题都完全学会。所以说大家，对待错题本的策略就是，如果你特别特别的细心，就保证自己在整理之后一定会经常翻。那你就做，你做就认真做，那如果你不能做到至少一周翻一次错题本的话，那你就别做了。直接把错题当场的消灭掉，那换句话说就是无论你有没有错题本，错题都是要学会的。","你只要学会就行，本子无所谓，那然后我们说学会的标准是什么，你就是在遇到这道题。可以自己完完全全的把它做出来就可以了，那我再告诉大家一个小秘密，就是错题本。大家一定要挑自己喜欢的，挑好的，挑贵的，一个本子大家是要记忆挺长时间的，就是它要是破破烂烂的，就你连写下去的欲望都没有，就相反。如果这是一个你在书店精心挑选的一个精装本子，你在对待它的时候一定会小心翼翼的，而且越是这种本子。你可能翻阅的频率就会越大一些。","然后我们接下来要强调一个特别重要的事情，就是错题三刷，第一刷就是在刚发现。你自己的问题是错题的时候，你做完题，你要把题目判一遍对吧，对的其实不用打勾。你把错的打叉就行了，为的就是让它更醒悟一点，那这个时候呢，你就要当场处理掉你的错题。拿起标准答案，把标准答案的思路在自己脑子里从头到尾过一遍。","然后觉得自己学会了以后就把答案合上，把那道题重做一遍，这个时候其实你很可能还做不上。在你卡壳的点呢，你可以自己思考一下，看能不能思考出来，思考不出来，那可以继续看答案。别觉得这样很笨啊，就是这是一个很正常的现象，本来这道题你就是不会的，你看一遍答案。如果能把它学会，那你就是相当相当不错了，就是多看几遍才学会很正常，直到你靠自己完整的从头到尾不需要答案。把这道题搞定，这算是一刷完毕。","然后第二天进行二刷，我们每天的学习计划都要留出一个大块的时间来进行复习。来复习昨天学过的内容，其中自然就包括了二刷昨天的错题，一样的步骤啊，第二天的时候直接不看答案。把这道题靠自己来做出来，做不出来没关系，重复一遍一刷，的步骤就好，而第三刷可以放到每周的周日啊，就是一个固定的时间。","比如说我定在每周周日复习前六天的错题，这样完全可以，这个就是大概的一个三刷错题的一个步骤。然后再介绍一个方法，在我复读的时候去了一个特别好的学校寄读，那个学校大概一年能考20个左右的清华北大。在我们黑龙江属于相当厉害了，本来我们黑龙江的清北的名额就比较少，他们有一个很成功的点。我觉得这是一个很好的方法，我觉得这是一个很好的方法，确实是一个他们很成功的点啊。那就是在距离高好100天的时候，他会发一个百日通识的笔记本，这个笔记本的用处可大了。","首先就是他可以记六颗，不是说这个本子比较大，而是他的用处就是记六颗，就是他可以把你今天各颗遇到的值得记录的点全写进去。下面附上一个我当时的一个笔记啊，我还特意拍了个照。比如说你看这里啊，我这里有化学，有生物，我不用把整道题都抄上，我只需要把我不会的选项写进去。你看这样效率是不是特别高，因为我们都知道有些时候我们在做题的时候，这道题你能选对。不代表你四个选项都会，你可能看一下A啊，这个A你完完全全的确定直接把A选上。","但是C和D你就有不确定的地方，那你在你不能把这道题当作你会了，那你在你不能把这道题当作你会了。你要把这个CD及时的整理一下。所以说你就可以把这种小的，小的这个知识点的题，你就可以直接抄到这点上就可以了。然后用一个你能记得的方式把它记下来就行。","然后用一个你能记得的方式把它记下来就行，不一定非要记得多么的完全，不一定非要记得多么的完全。只要你自己能看懂就行。然后比如说语文的素材，英语的好句好段，蓝行中出现的生词，你看这个我记的是语文的识词，这个就是我把各个模拟题中就是。我把各个模拟题中就是，踩分点嘛我没有踩到的，踩分点都记到这顶上了。","然后再有一些文学常识对吧，这个当时我们叫来日什么本来着。其实就是个笔记本，你看它就是一个横格的笔记本，你记录一些你需要积累的东西。然后你经常翻看，我真的强烈建议大家弄一个这样的本子啊，很好用就跟这本是同理的，就是你绝对要经常翻阅，就是你绝对要经常翻阅。你看我还会抄一些语文的素材呀在里面。","但是如果你不翻的话绝对是没有用的。但是如果你不翻的话绝对是没有用的。所以说咱们就是告诉你，笔记这个东西可以记也可以不记，只要你记了你就一定要经常翻看。只要你记了你就一定要经常翻看，如果你不翻你就不要记，就是这么一个原则。","其实数学本上比较多的是数学和物理，或者说错题本上整理的比较多的是数学，或者说数学本上整理的比较多的是数学。因为数学的题干比较短，物理的题干太长了。其实大家都不愿意抄。所以说其实大家可以把两个学长的错题方式结合一下。所以说其实大家可以把两个学长的错题方式结合一下，就是数学的话你抄上去。","然后自己做答案什么的，做笔记，物理呢你就可以当场把它解决掉。然后像化学生物这种。其实它更偏向于是积累本。其实它更偏向于是积累本，就是很直直性的，就像我前两页写的那样的，就像这种的，就像这种的，这种的就是。特别的短。然后你经常翻阅经常背诵就行了，我现在主要想说的是，英语和语文，可能有人不会用英语和语文的错题本。为什么呢，因为英语和语文的话是，你会发现不需要错题本。","但是你说它的错题该怎么办呢？比如说我拿语文举例，语文的话肯定是记不了错题本的，我们说语文和英语只能记积累本。那对待错题我们该怎么办，我们就是把答案的思路，在脑子里过一遍，就是比如说语文。一个阅读，我们主要是选C，那为什么选C，你能不能反映出答案的思路，如果不能就再去看答案。直到你不看答案的情况下，你看一眼这一道题，你就知道为什么选C，OK吗？而且如果你的思路，跟答案不一样。你要把你的思路向答案靠拢，就用答案的思路来说服自己，英语也是同理的，英语全是阅读题对吧，那个阅读题你选错了。","然后你现在要复习这道错题，你就是再读一下这道题，你看一下我能不能准确的把答案选出来，并且把自己解释明白。如果你能形成了这个答案的思维，那这道题就不算你的错题了，如果你看到的时候。你想的还是你一开始错误的那个思路，那说明这道题还在，还是你的错题。","所以说你归根结底就是，一道题我们能把它再做对，它就不是我们的错题了，如果我们做不对它就是我们的错题，这个是本质。"],"id":"c2-11","course":"自学方法","n":11,"chars":2996},{"chapter":"自学方法","title":"12 高效利用时间的方法","paras":["大家好，我们这节课的标题是拒绝无用的焦虑，如何让自己的时间变得更高效。我发现现在学生焦虑的点实在太多了，焦虑成绩，焦虑时间，焦虑人际关系，以后等你们长大了，可能到了大学还会焦虑颜值，焦虑身材，甚至焦虑开销。可能有些人现在就已经开始焦虑这些了。","其实焦虑的根源是什么？其实就是比较，你看到了比自己更好的人你才会焦虑，对吧？你想想，如果全校就你自己，你八把考试都是第一，那你肯定不会焦虑成绩，因为你会觉得，我自己考得很好啊，因为压根就没有别人给你当参考，对吧？你看啊，现在很多学生都不愿意参加考试。","其实考试最重要的就两点，第一，督促你，告诉你要经常复习学过的内容，第二，帮你习惯考场的紧张氛围。但现在每次考试，老师也好，学生也好，全盯着成绩单上面的分数，而且现在老师出题出的也不好，特别喜欢刁难学生，就是到最后一出分发现，只有极小部分人才能考得不错。大部分人考得都不行，那你看，这大部分人肯定很焦虑啊，你比较发现自己努力学了一个月，成绩还下降了，对吧？但其实，你只需要把考试的作用利用好就行，就是说，第一个，时常去复习。","第二个，你要适应考场的氛围，把这两个做好，在一次考试中你就已经收获挺大了。你要是能够再把考试的错题都学会，那更了不得，那我们把问题再回到焦虑，我该如何让自己不焦虑呢？那从本质上来看，就是不跟别人比较，你只跟昨天的自己进行比较，你每天只要学习了，只要复习了，你就一定比昨天的自己进步了。这里注意啊，不是说你每天学习了就一定进步，你今天确实学习了，但把昨天学的或者前几天学的你都忘了。","那你如何确定是你学的多还是忘的多呢？那该怎么办？就是每天都要复习，这样的话你就能做得到，天天都在进步，那你天天都在进步，你还焦虑吗？那你怎么会复习呢？还有就是我们退一万步讲啊，就算你要跟别人比较，那好歹你要把时间线对齐吧？你只看到了人家考到了这个分数，你怎么不看看人家的努力呢？你就算要跟人家比，比如说你到现在已经觉醒了，努力了一个月了，那你是不是应该跟那个努力一个月的学霸跟他比较啊？","你跟学了三年的他，你怎么跟他比呢？所以说你看出来了吧，很多比较都是不公平的。所以说其实压根就不需要跟别人比，至于那些时间线，时间焦虑啊，人际关系啊焦虑。其实就一句话，这些东西对你一点帮助都没有，一点提升都没有，而你焦虑这些只会让你的成绩下降。那你想明白了这个事就一下子通了，对自己全是害处的事，为什么还要去做呢？我只需要努力学习就可以了，对吧？那很多人现在感觉自己时间不够用了，其实很正常。","但是你发现时间不够用，这是我们无法改变的事情，我们只能说出尽可能的把我们的时间高效的利用一下。你就算你再怎么琢磨它，时间也不会变得更多，它只会自顾自的，你一直流逝，对吧？所以说接下来又引出了一个特别关键的问题，如何高效利用我们的时间呢？","第一个方法其实我在其他课中已经讲过了，就是写计划，把任务拆解好，罗列好，每天根据自己的任务去学，这样就能减少很多时间的浪费。很多学生在学完一科或者写完一科作业之后，总要思考一下，我接下来该学什么呢？他想了半天他才开始下一步行动，这其实就已经白白的浪费了很多时间了。","所以说一定要写计划。第二个方法，同复，同复是效率最高的事，这句话很少有高中生知道，但它真的特别重要。因为他总觉得题刷得越多越好，发题越多效率就越高。其实这样大错特错，一道题你做过了一遍了，你再去做另一遍，你的思路啊，你的速度啊。你都会远超第一遍，这才是你把效率提高的最优办法，同复，你就这么想，你现在就这么换算。你做一道错题，对你的帮助，相当于你刷十道新题，你把一道题完全学透，又胜过你再往下学。","相似的十道类型的同类题，你这样想的话，你就会逼着自己多去重复。所以说很多学生有的时候，不知道该学什么，你不知道该学什么的时候，你这个时候你就赶紧去过。看你错过的题，优先的是错过的题。然后不错的题也可以看，就是你再把错题看完之后再看，你当初选对。","但是你这道题未必真的会了，或者说你未必是，最好的题，你最正确的思路，可能你用了一个比较麻烦的方法。给它做出来的，那时候你一道题每多做一遍，你就相当于一次升华，你做多了，你就会发现就是每次重做。都能对这道题都能给我们带来新的理解，新的启发。","所以说重复，你看我都没有管它叫多刷错题，因为不是错题，我们也需要重复，或者说必须重复。重复才是效率最高的事，你想把时间高效利用，对吧，好去重复。其实这也间接的指明了，为什么说刷专题对大家来的帮助更低，因为它就是重复嘛。我拿英语举例，提高英语最快的办法就是刷专题，很多人觉得一天一套卷子，长期坚持下去。英语成绩肯定不错，但如果你把一天一套卷子的时间，都投入到某一个题型，一个专题里面，这个时候只需要短短的一周。","你就能见效相当的显著，我高中同桌，每天下课就在那做完整点控，这道题，这个类型的题。在大家印象里，是不是全对很困难吗，人家天天课间有时间就做。最后高考就是全对，为什么，高效的事情，并且它，一直在重复，那当然能成功啊，对不对。那第三个，专注，当年比尔盖茨跟巴菲特，第一次见面的时候，比尔盖茨的父亲，分别给他们两个。一人一张卡片，让他们在上面写上，是什么成就了他们，那我既然都讲到这了，肯定写的都是什么。","专注。其实很多高中生，成绩不好的原因，就是不够专注，你发现了吗，上课总流号，总分神，而每天。其实大多数的时间，都是课堂时间。所以说你课堂低效，课堂分神，这个问题，一定会影响你的成绩，那分神的原因，有两种。第一种，就是老师讲的课，实在太无聊了，你可能都学会了。","所以啊，你会分神，想一些更刺激的事情，那第二种，就是老师讲的课，让你太痛苦了，你真的听不懂。他在讲什么。所以这个时候，你会分神想一些，让你更舒适的事情，那可惜啊，分神一时爽，事后你就要承担。分神给你带来的，各种损失，总有人说，哎呀老师讲课，我听不懂，那你想想，一堂40分钟的课。你分神10到20分钟，你怎么能听懂呢，尤其还是吸音课，对吧？","所以说从现在开始，我们要通过科学的练习，来帮助我们，提升我们的专注力。但是在这里，我要插一句啊。其实上面那两个问题，除了提高专注力之外，还有别的办法可以解决。比如说，老师讲的你都会了，这个你要确定，你是真的会啊，那你就可以自己去刷题，刷自己的错题也好。刷新题也好。","总之就是让自己，去做一些有挑战的任务，这样就不会觉得，无聊而流耗，也会防止你犯困。那第二个，如果你听不懂，老师讲课怎么办，预习，还有讲题的话，这个课堂讲题，你就提前把题目做一遍。那如果这也可讲知识点，你就提前看教材，把那些知识点，先提前读一遍，这样你就能。在老师的讲课的过程中，你不仅能听得很轻松，你掌握的也会更好。","所以说预习这个事情，怕你能听懂，你也可以去做，这也解释了，有些成绩好的学生。其实他的专注力并不强，但他们掌握了正确的方法，用这些方法来，避免了自己流耗。然后时间一长，那成绩上的差距，就体现出来了。但是我们归根结底，还是要把我们的专注力，提升上去。","所以说那接下来，我们还是继续讲，如何提高我们的专注力，从现在开始，你就要刻意训练。让你的感受和行为，保持一致，什么意思，跑步的时候，你就把你的感受，放在你的跑步上。感受你自己抬胳膊抬腿，感受你自己的呼吸，那刷牙的时候，你就去感受刷牙，这个东西跪在肩时。你可能一开始，感受了一会以后，又开始，胡思乱想了，没事，下次再提升，你感受的时间。你把时间慢慢的拉长，因为你每天，要做的事情，实在太多了，能进行感受的时间，也比较多。","那训练的次数，也会慢慢变多。比如说你睡觉，吃饭，跑步，刷牙等等，你都可以进行这个训练，逐渐的就能把，自己的专注力提升起来。另外啊，还有就是学习上的练习，我推荐大家买一个，可以倒计时的那种小表，利用那个番茄工作法。倒计时25分钟开始学习，倒计时第一结束，就去学习，休息5分钟，这25分钟，就保持完全的专注。专注在学习上，你如果做不到，就先减少时间。","比如说把这个时间，减少到20分钟，15分钟都可以，因为每个人，目前能专注的时间。肯定是不一样的，但就是要求，在这个倒计时之内，你都是完全专注，于你的学习的，没办法倒计时结束。那休息5分钟之后，再进入下一个倒计时，当你在这个倒计时，游刃有余的时候，你再把你的倒计时时间。开始增加。","最后增加到40分钟，也就是你的一堂课为止，当然了，专注的时间越久，肯定是越好的。那我们最后来总结一下，我们分析了那么多。其实你在高中阶段的，经验焦虑。其实是没有用的，它除了对你的成绩，产生负面影响，增加你的精神内耗之外，就没有别的帮助了。","所以说我们要尽可能的，避免焦虑，那办法呢，就是杜绝跟别人比较，每天只盯着自己的提升。然后我们又讲了，如何把自己时间，利用的更高，分别是写小而具体的，每日规划以及反馈，以及把我们。学过的知识，刷过的题进行重复。最后就是用科学的方法，来提高自己的专注力，希望大家能够多多实践，把这些方法成功的。内化为己用。"],"id":"c2-12","course":"自学方法","n":12,"chars":3629},{"chapter":"自学方法","title":"13 语文的进阶方法（通用）","paras":["来我们这个视频讲一下这个语文啊，怎么考上985啊，这个视频初中生和高中生都可以听啊。小学生都可以听。但是我还是以重点的高中举例，为什么呢，因为这个最难啊，你小初的语文肯定是不如高中难的。高中语文其实它分为这么几个部分啊，叫现代文阅读。","其实这个现代文阅读就是你的实用类文阅读，加文学类文阅读。然后还有一个叫文言文。其实说说白了，你你把下面叫现代文，这个就是古代文吗，对不对，呃，你们小初也会考这个东西啊 别。","最后咱再说说地理啊，很多人说地理是学院学，非常多同学的地理呢，它是一个起伏。非常大的一个科目。但是你多做题之后，就会发现，每一道题它都有背后的逻辑，地理不会的话，一定要多问。很多东西光看答案，只会强行解释，那些地理基础的支点。","但是地理需要你去记地图，每一个图记的方法，都是从局部到整体，先理解局部的原因。然后再串联起来，再补充细节，甚至很多题目的根本，就是对应的地图，你某个支点做错了。你就回对应的地图顺一遍，地理有很多支点，它是一个动态的过程，一定要自己反复的去梳理，对于那种高一的学生来说。正史地你基本上靠背诵，你就可以解决部分的问题。","但是到了高二你会发现，它的难度会陡然的提升，思维量变得很。所以说你到这个时候，平时上课你就要认真听讲，正史地是我们不建议自学的科目。因为这个东西，很多东西你看书真的理解不了，甚至有些名词，你可能都看不懂，这个时候最好找老师。给你解释一下这个逻辑，这个过程，解释某个结果，是由哪几个方面的原因，综合导致的。平时你可以多找一些老师，学霸探讨探讨，这个科目千万不能闭门造车。"],"id":"c2-14","course":"自学方法","n":14,"chars":2053},{"chapter":"自学方法","title":"15 数学的逆袭攻略（高三看）","paras":["我事先先温馨提醒一下啊，这节课极感，而且知识密度极大，它可以说是里面很多的，就每一句话它都是极其重要的。可能怕你，如果你平时习过那种走马观花式的听课，那可能你会错过很多重点。所以说你是自己是记笔啊，还是说到时候在平兵在那样的话，都可以，因为本来这个课的题目呢？","首先这个课咱们是加课啊，是本来当里面没有出数学。但是就是数学教的太多了，就大家都想要听听数学，这个科目呢，咱们今天给大家加课一节。免费赠送给大家啊，那本来这课的标题呢，我是想叫这一节课把数学讲明白，但后来一想啊，这样叫可能有点夸张了。那我就把我能想到的，在这个课先都讲出来啊，如果你还有其他的数学问题，还有补充的。到时候可以继续咱们赠课，或者补录的一个形式，哎呀终于到我的主场了，就大家其实看到了，就是有那种。","咱们这个课里面有这个，语文130多的学姐分享，有文综280多的学姐分享，因为他们在单科的领域。确实足够强，他们在单科的领域确实足够强，就让他们去讲呢，他们就是怎么的更加专业一些。但是我还是会把我，对这些科目的，我自己的一些理解想法，也会给大家讲出来，那现在到了数学呢，这个是我最有资格讲的。先给大家介绍一下，我在复读那年，后期的所有的大型综合模拟中，我的数学成绩，平均都是。140加的，什么150啊，149啊，什么147，8，就反正这些都，这些分数都考过。","但是，2022年那年的高考啊，确实变突然变得很难，大家懂的都懂啊，只考了133分。但其实也很高了。然后我们学校那年，就是他考成一个，清华大学的同学，他的数学才120多分，但这里面。依然有不少的失误分，以及不该错的分。其实反思了一下，这张卷子是能过140的。","所以说我这个翻车的经验啊，说出来就特别，值得大家去借鉴，那，第一点啊，咱们讲这么内容。这上大学不太会写字的，不过，呃，不用在意啊。首先倒数第一道大题和倒数第二道题，呃，就我们俗称的那种压轴的大题，啊，一般他就大倒数第一倒数第二吗？我这里强调就是咋的呢，不要死磕，他的性价比太低了，低到谷底，因为我是复读生啊，而且还在家自学。不要就是听网课什么都比较方便。","所以说我就把这档的题啃下来，但其实这个啃的过程中花费我大量的时间，而，而且最后高考的时候并没有拿到满分的一个成绩，就这两个呃。在我们就是呃，当时全国语卷啊，包括其实呃，在你们就是九成年年考之前啊，九成年年考之后就是可能不是了。但几个年考之前啊，就我们之前的高考一直正，包括现在啊，咱们说语卷和假卷还没有通知是否改卷呢？啊，现在目前确定是新一和新二可能要改，啊，基本上吧，这两个卷基本上改新高考卷。","那假语卷啊，包括老高考卷还没有通知是否要改呢，嗯，在之前的这些，这些，在高考的情况下呢？这两道题一般是原主情和倒数啊，一般啊，就是说多数的年份是原曲和倒数。但是也有一些年份。比如说像2019年，他就出现了就概率压轴的一个情况，这些情况虽然少，但出现过。嗯，但还是少，这这两个居多，能懂吧，嗯，哎呀，新高考改革之后呢？","最后两道题出什么。其实不确定了，因为你看九成年考现在出搞出了一个新的新的定义问题。所以说呃，越来越难判断这个大题压轴大体的走向。所以说咱们你们可能要与路俊瞻一下，一会我会说怎么办啊，呃，我学会方他们的方法也很简单，就这两个我是这么攻克的呢？啊，我把某网课老师啊。","其实就是赵立贤老师的关于这两章节的课呢，全部都听了一遍讲义呢，大概刷了三遍左右啊。你看注意啊，就是 老师叫陶然。你可以看一下他的课学的，我高中是没有学过语法的，但不影响我语法听众拿满分。我高考语法听众就是满分，如果你高一高二，学有余力的话，我强烈建议你可以学一下语法。这对你以后的英语是有帮助的，听你们学校老师，你们学校老师上课，他就会讲，你听他讲就行。他其实不难，如果你高三了，没时间了，那就不学了，纯靠刷题是可以，把你语法听众拿满分的。","然后你作文的话是这样的，作文的话，你熟练，就是你能写出高级句式，它确实是加分的。但是我的高级句式，都是通过背来学会的，就是我背下来了，他那个高级句式，我不知道他的原理。但我知道，他这么用肯定是对的，你说一篇作文，也不可能句句都是高级句式，不是我背的。我自己写，我写的普通一点。","然后那个背了，他的那个东西，高级一点，就高级和普通穿插着，对吧，你应该能听懂我的意思。所以说学习语法的性价比。其实挺低的，但如果你高一个二，学有余力的话，学一学没毛病的，多学点，不犯事。然后好了，咱们今天就是，我把你们统计的那些，英语的那些高频问题，我今天这些课都给你们讲了。如果你还有什么其他疑问，你就直接在答一群里提问就行了。","好吧。"],"id":"c2-16","course":"自学方法","n":16,"chars":4862},{"chapter":"自学方法","title":"17 获取学习动力的方法","paras":["学习没有动力怎么办，说实话，我从事教育以来，这可以说是遇到过最多的问题之一了。但是这个问题真的很难解决掉，为了这个问题，我采访了很多名牌大学的学长学姐。我问他们高中时候学习的动力是什么，有人说高中就是老老实实的，跟着学校学了三年。老实上干什么就干什么，也没什么动力，就是把它当成任务去完成，当然了这是省重点高中的，这样考的话也比较好。有人说在高中的时候，总跟家里闹矛盾，特别想脱离自己的家庭，于是大学想考得越远越好。","所以说努力学习考到远方，又有人说从小的梦想，就是考入某某某的大学，做某某某的职业。这一直支撑着他去学习，还有人说自己的家庭条件太差了，父母都是在小学校打工的。希望能够靠自己实现阶层的跨越，甚至还有人家里经历了严重的变故，在一夜间长大开始奋起崛起。","总之各种各样的原因。但是你要知道归根结底，欲望和恐惧是驱动一个人，去行动起来的底层力量，你之所以没有动力去学习。很重要的一个原因是，因为你压根没有体验过，那些顶级学府，他们的里面的人，他们究竟是一种。怎么样的精神状态，他们是一种怎么样的生活，你不知道本科跟专科，有多大的差距。不知道酒吧玩，要跟本科又有多大的差距，因为你没有去体验过。","所以说你会认定，当下自己的状态和所处的环境。其实也没有什么不好，我曾经在我的公众号，A放羊的星星中，写过这样的一段话，你是否能接受。在大学，住着六人上下铺的寝室，六个人共用一张桌子，平常稍微学习的时候，你就会受到冷嘲热讽。用手机背单词，你不敢放出一点的音量，本来就应该会的知识，你学会了，他们就会在旁边说。哇你好厉害，在这种低级的吹捧下，你是否还能保持学习的动力，他们每天上课前15分钟，才会下床准备。","晚上熬夜打游戏，看小说，偷烟，喝酒，讲自己的恋爱史，而想要早早入睡的你，显得格格不入。上课的时候，老师在前面熟练的念着PPT，下面的学生说自己的，上面的老师念老师的。那你努力制作的演讲PPT，压根没有人在意，你在台上讲你的，他们在台下说他们的，就你们仿佛不是一个世界的人。你能够接受这样的环境，你就不学，你如果接受不了，你就去学，我在网上还看到过这样的一条评论。他说自己每次坐出租车去学校的时候，他都不会告诉出租车司机，自己是哪个大学的。","他每次都停到附近其他大学的门口。然后剩下的一段路，自己走过去，这说明什么，说明人，还是有自尊心的，就是发现的有点晚了。我特别喜欢的一部电影叫做什么呢，叫《萧生客的救赎》，《萧生客的救赎》这部电影中的瑞德，对着男主安迪说过这样的一句话。监狱会不断让你体质化，当开始的时候，你会非常厌恶这个地方，后来你会不断的习惯下来。觉得这个地方好像也不错。","最后这个地方会和你融为一体，一旦离开，你反而会痛不欲生，你现在的生活也是一样的。它会让你不断的去适应它，去接受它，磨灭掉你的欲望，你想想，你有去过北上广深看看吗？很多初高中生在上大学之前，都没有离开过自己所在的城市，就算是出于旅游，也局限在本省。因为家长想让你，把更多的时间投入给学习，这也就导致了，我经常会收到这样的问题。说学长，学习没有动力该怎么办，因为很多人压根没有体会过，顶级大学，没有体会过外面的世界。","他们对未来生活的规划，只能放想象，但想象多数是和现实是真的。所以说在条件允许的情况下，建议大家多去一线城市逛一逛，尤其是那些，顶尖的大学。看看那些大学生的精神面貌，看看他们是如何上课的，看看他们每天都在干什么，这样当你在进行了对比之后。你就知道自己应该往哪走，应该要学习到什么程度，才能够和他们一样，我上面还提到了一个什么。恐惧，这个可能现在的你们体会不到，人只有经历过巨大的挫折，失败，打击才能够滋生出足够多的恐惧，这样你才会知道。","原来学习这种痛苦，真的不算什么，我连那么大的恐惧都挺过来了，学习还算个屁。所以说为什么我现在这么努力呢，就是我就是恐惧，我害怕万一哪天家里出了变故。比如说生病出院，天灾人祸等等，到了那个时候，我得有能力把这种影响降到最低。","所以我得努力，那你们也是同样的道理，如果家里真的出了什么事情，即使没有耽误你上学。但你的心态肯定会受到影响。所以说我们大家都要珍惜当下的稳定，就趁现在就开始努力。最后一点我想说的是啥呢，当你掌握了上面，我说的之后，也就是说去经历了好的生活。去找到了自己人生的方向，以及珍惜当下的稳定之后，当你能做到这三点之后，你就会找到属于自己的节奏。","其实吧，学习这样的事吧，一开始我们每个人都是充满信心的，因为它是一个长见识。获得能力的一个过程。但是当你习惯了当下这个应试教育之后，你会发现你视线的焦点，开始从获取能力。转移到了学习知识和应付考试，就拿高分上好大学，找好工作，对吧，在不知不觉中。","其实你的天梯变窄了，你的视角被限制了。比如说咱们举一个学生时代的经典问题，我为什么要学数学呢，这玩意在生活中有啥用啊。我买菜我也用不到几何，用不到函数对吧，那你说的对，你永远都不会用到它，就像人们去健身去举重。它从来不是为了把别人摁到地上欺负，而是为了一个健康的身体，为了扛起扛不动的东西。你做数学题，它是为了锻炼你的逻辑思维能力，让你将来可能会成为一个优秀的。","比如说律师，老师，医生，建筑师，精算师，会计，甚至是家长，懂了吧，数学是我们通向未来的一个手段，而不是我们的目的。到了未来你就会发现，比起你数学好，你在学习数学的过程中锻炼出来的，对抗环境的能力，对抗困难的能力。规划自己时间的能力，以及你的执行力，什么叫执行力，执行力在我眼里就是说，在自己做不好的情况下，还能坚持去做的能力，这个事你一旦你能做好。那你就一定感兴趣，做你感兴趣的事，我在我眼里，它并不算什么，它不需要什么执行力。","只有做那些，自己不擅长的，不感兴趣的，才能够体现出，你的执行力有多强。最后最后我还想说，人们吧，他都喜欢做自己，认为有意义的事情，那当这件事没有意义的时候。我们就要想尽办法，为他赋予意义。比如说你现在的学习，你可以把它当成，你未来年薪百万的前提，多考一分，离你的百万年薪就更近一步。","比如说我每次在出视频，写文章烦躁写不下去的时候，我就会想到，还有几千人几万人，甚至几十万人，还在等着我的视频。我做的内容，能够帮助到他们，想到这儿，我就要继续坚持创作下去。所以说有些事情。其实本无意义，要靠我们来给他赋予意义。","其实慢慢的就会发现，咱们人吧？其实一辈子要走两条路，一条是自己喜欢的路，一条是不喜欢，但不得不走的路，你要记住。你现在所走的一切，都是为了最后，走上那条你喜欢的路。"],"id":"c2-17","course":"自学方法","n":17,"chars":2644},{"chapter":"自学方法","title":"18 物化生的学习方法","paras":["这点课我们讲一下物化生该怎么学。其实底层的逻辑我已经讲过了，就是啥，背诵，刷题，看课。但是应大家的强烈要求，咱们还是再唠叨唠叨。首先从物理到生物，那越来越像文科，也就是说要背诵的东西逐渐增多，像物理你需要记忆的东西很少，就需要多刷题。但物理这个科目题目比较难，而化生两科，你用了一些时间去背诵去记，那你在做题的时候就相对物理比较简单。","所以说像物理，生物这两个学科的提分，它一个是难，一个是麻烦，你那属于难，而生物是属于比较麻烦。你如果同等分数下先提哪科的时候，这个就是一个因人而异的事了，有些人就不喜欢背诵。那就喜欢去刷题，那同等分数的话你肯定去学物理，如果你让我说，我肯定是说生物更简单。因为只要你背了，题目就很可能会做上，而物理没有那么多东西要背。","所以说你可能题目做不上，这里我以自学为例，讲讲他们该怎么学，像物理这种特别难的学科。其实是可以听的，我在之前的课里讲过，听网课的效率和自己看书，看答案自己学的效率比要低很多。但是这个科目的难度，有些人自己学学不会，答案实在看不懂。","所以说你可以搭配网课，这里我给大家推荐一款，免费的物理网课，就是bilibili上的黄夫人。bilibili是一款软件，上面有很多免费的网课，我当时就是听这个老师的。是少有的免费的系统课程，课分两种，高一和高二的新课，还有高三的一轮复习课，根据你的年级自己选择就行了。网课该怎么听做，我前面的课已经讲过了。","所以说你要做的就是，先通过物理课本，把这一章要背的概念公式先背下来，其他的文字多读读就行了。然后你在导本题开做就行了，你可以选择那种黄夫人老师的讲义，如果你是助校生。没有时间看网课，那高一和二的助校生，你就可以选择像教材帮，这种答案比较详尽的，这种教辅材料。我们说自学生或者走读生，物理有学不懂的地方，可以去看一看黄夫人的网课，但你说助校生。助校生你就一定要利用好老师的课堂，因为你没有机会看网课，你有不会的，你只能去问老师，或者去问你班级学的好的同学，这个时候不要怕麻烦。","平常你给你班同学送点零食啥的，人家都会教你的，不要不好意思，我们是为了把知识学到手。那这里我们就特别强调的一点，就是啥呢，就是错题，错题该怎么处理，我已经讲过了。如果你不好好弄你的错题，那你上面刷的那些题，效率一定会大打折扣的。","然后像化学生物这种科目，它其实是需要大量背诵的，我不建议你上课抄一份，笔记。因为这实在太浪费时间了，我建议你直接买现成的。比如说生物，生物最好的背诵材料，就是生物教材，就是生物课本，这是你生物学习必须要背的东西。可以买一本那种，国籍式的知识点书。","比如说像李林老师的生物笔记，或者汗水丑生的那个笔记，这两本你高一高二就可以买。你买完能用到高考结束，性价比很高，而高三的学生，你就直接看你一轮复习的练习册。一轮复习的大本教符，每一章前面都会有知识点，但可能是那种天空式的，需要你自己填上。拿铅笔填，填完之后照着答案改正。","然后它最后就会变成一本知识点，更重要的是啥呢，一定要自己动手做，我特别要强调就是这点。光背诵不做题没有用，有人说自己背完就忘，那就是因为你没有应用，我问你背诵知识点的目的是什么。是不是考试能考个高分对吧，但考试考的是你做题，你背完不做题你有什么用呢？","所以说你每背完一截的知识点，你就要找一些题目来巩固一下，不仅仅是在锻炼你刷题的能力，也是为了巩固你刚才刚背过的知识点，甚至是帮你更好的理解这个知识点。咱们中国人有个优点，就是说有些原理，我们甚至不理解，但我们就会用。比如说我这篇课中里教过，说冥想就能让你变得更专注，让你变得更聪明，它现在已经被科学证明了。它可以增加你大脑皮层的表面积，和大脑灰质的厚度，说白了它就是能让你变聪明。","但其实几百年前，那些僧人他们做的打坐，谈修都是这一个意思，他们当时还没有科学证明，这个做有这么多的好处。但他们已经会做，并且传承到了现在，这跟你做题也差不多，你有的时候不理解这个知识点。你去做几道题，你可能就透彻了，没有必要一直在那背，一直在那想，你要去行动去做它。用它去解决一些问题，很多时候你会发现，理科的概念，它是也需要死经背的，能理解的。我们肯定是要去理解完之后再记忆，实在理解不了的，我们就死经背下来。","然后通过做题去理解，有些时候这个知识点，需要你用一用才能理解，懂了吧，那我们再来总结一下。如果你高一高二，物化生，三科上课都需要认真听课，这个是帮助你理解的过程，当然了这个过程。你可以用市面上的网课，或者自学来代替，自学就是看课本被概念。","然后搭配。比如说我刚才说的教材帮，这样的教服我就觉得不错。然后再去刷题，不懂的题看答案解析，这对于一个学习能力弱的学生来说，是一条比较困难的路。如果你们学校老师的课，你听不懂，或者你不爱，他讲的不好，那你就可以考虑去，bilibili上面找网课听。网课怎么听我也有讲过，直接去听就行，但这个前提是，你要么自学生，你要么走读生。因为助许生是没有听网课的条件的，助许生如果听不懂学校老师讲课，你基本上只有上课自学。","这一条路可以走，当然了你可以选择回家自学。但是风险系数有点高，我不太建议，那高一高二，你除了认真听课之外，还有比如说你作业。得认真写吧，那你错题处理，一定要按我们课程讲的来，错题你不看，你成绩不可能太高的。如果你想拔高，那就得大量刷题，但如果你们的作业，没有详解答案，我觉得这不是一份好的作业。一般老师留作业，他会留学校发的那本恋言册，但不会给你答案，你自己去市面上，买本一样的恋言册，这样的话你就有了答案。","当然了，如果这本恋言册，答案不是详解的，那你就要考虑换一本恋言册，或者说你在上课听错题的时候。你就你要记笔记了，这里呢，我依然建议可以使用教材帮，因为教材帮上不仅有知识点，也有不少题，这个题量，对于大多数人来说都已经够了。你能把一本教材帮学，投到你的成绩绝对不得了，如果你选择了跟市面上的网课学。你把网课听懂，网课讲义刷个两遍三遍的，及格绝对不是问题，要是你自己再额外刷了点课外的题。","那你分数会更高，对于高三的学生来说，那一轮复习是相当重要的，这是一个打基础的阶段，这个时候依然要以理解为主。没有个七八十分，你是不用刷太多题的，留到二轮再刷就赶趟，八十分了，那你基础很好。你一轮二轮可以合起来进行，就是说你在一轮复习的时候，就多刷点，这个还要根据你其他课的情况来定。","比如说如果你其他课有瘸腿，那你肯定要分更多的时间，给到瘸腿科目对吗？所以说不非你各科都是很强的那种学霸，否则很少有人能够把一二轮合并到一起做。优势学科一轮复习，你可以少用点时间，瘸腿学科你一定要多用点时间，同样的道理。你瘸腿科目多，一轮复习的时间就会变得更长。","所以说没有一个太好的标准，就只能说你在保证复习质量的情况下，一轮复习越早完成越好。具体要多久完成因人而异，在这里像物理这种科目，它就比较难，当时我的物理是跟着网课进行一轮复习的。生物比较简单，我是自己看教材，自己做一轮复习练册，自己来复习的，化学我就选择了难度大的章节。我看一点网课，难度小的我就自己学，当然了如果你住学生，你就没有时间看网课，没有时间看网课。你就只能跟着学校上一轮，或者是说自己上课自学，走读生的话，我觉得走读生的时间。","我觉得也只能跟一科的网课，就两科都有点费劲，那自学生就相对于宽松点了。但是也不太建议自学生太依赖网课，因为自学生很容易听课听爽了之后，忘记刷题，这个是一个很严重的问题。一轮把基础打好之后，一轮开始你就要把每个专题大量的刷题了，刷完专题之后，再开始三轮刷综合套卷。在这个过程中，你要把更多的时间放给你学的不好的专题，对吧，对吧，你不能说每个专题都给同样的时间。","比如说大题，我们就是要多分辨时间的，因为小题练习来比较快，那这个过程中，你就要不断的做好改错，就是我们之前讲的叫榨干错题，这样你才能取得大量的提升。你别跟我说什么进度太快，没有时间改错，你连错都不改了，你改了那么多进度又有什么意义呢？你错题没搞明白，你就别去刷新题。","好吧，说白了，最终这个梳理下来，就是整个过程，就是你把专题每个挨个攻破了。然后刷套卷，保持手感，直到你适应高考为止，但如果不巧的是，你距离高考不远，才看到我这节课。那你就要放弃一些性价比，比较低的专题和填空。比如说化学，它中有一些计算题，它不仅复杂还一错，对吧，这种空我们就应该先跳过。去搞其他的空，当你把性价比高的那些空，都专题攻克之后，再进行综合，这里我再补充一点，就是说性价比空的问题，就是有些人他擅长的是有机。","有些人他擅长的是无机，这个空对你来说性价比高不高，就要看你学起来，知不识力，这个空你学起来很吃力。那就是对你来说，性价比比较低。所以说这个东西，也有点因人而异。最后我想说的是啥呢，我这个课，只是把你提分的步骤，帮你具体化了，但你还是要搭配。咱们前面课程讲的一些方法，才能把效率最大化，一个正确的方向，配合最大化的效率。再加上你的努力，无论你高级，无论你距离高考还剩几天，我觉得都有可能会出现奇迹。"],"id":"c2-18","course":"自学方法","n":18,"chars":3653},{"chapter":"自学方法","title":"19 听力满分的训练方法","paras":["这节课我们来讲一下如何提高做听力体的正确率。首先你要想一想自己听力做不好的原因是什么，很多老师会告诉你听不顶就多听几遍就好了。可是有些同学你让他听100遍他也听不懂，因为很多同学他听不懂的根本原因在于。他的单词压根不会，那这个时候要优先解决的就不是听力问题了，而是单词问题，大家可以拿几套听力答案的原文来读一读。你就把它当做阅读题来做，试试你有眼睛看的，你不用听你看看能不能看懂，能不能把题做对。","高中听力里一般不会出现太难的那种常难句，就是那种放在阅读里都很难看的懂。很难分析出来的那种常难句，一般它不会在听力里出现，那听力里出现的一些从句啊，就算已经已经算比较复杂的了。所以说如果你连看都看不明白，你别说训练听力了，你先老老实实的去给我背单词。不然你怎么训练都是没没有用的啊，背单词方法就按我们第五节课讲的高校背单词，那个方法去背。先短期把词汇量提上来，不用说背到听力原文里每个单词你都认识，你就背到，把那个原文能看懂的大概。","你觉得不吃力就可以开始训练听力了，那大部分同学听不懂，问题就是在于我们中国人。他不熟悉英文的发音，很多学校老师平时上课时候的发音呢，他也是中式英语，而且我平时我们最多就读一读，这个单个单词的发音。光是单词的发音，我们读的都是不标准的，你更别说当整个句子连在一起啊，他还会说出现所谓的什么连读啊。爆破等等，那我们就更听不懂了。","所以说你想要有听力智的飞跃，那你一定要去精听，习惯人家，标准的发音是怎么样的。那具体要怎么做到精听呢？首先精听是一个很耗时间的工作。所以说我们不用每套卷子都去精听，我们就把你们省人年真题拿出来，就精听这十套听力就够了。高一高二的同学，如果你不想提前浪费你宝贵的真题卷，你也可以拿你们平时的一些听力材料。拿出来精听，第一步正常的播放听力，你正常的进行答题，就是说你考试你怎么样进行。","你第一遍听你就怎么样的，你把题目拿出来，边听边把题目做了，在做的过程中，如果遇到不确定的。没有听出来的题目，就把这个题号圈起来，那等做完之后呢，你要马上的核对答案，对完之后。我们要进行第二遍听力，这一遍，你只听圈起来的那些不确定的题目，也就是说对完答案之后。你自己做错的题目，这个时候你已经知道了这些题目，该选哪个选项了，你第二遍听力的时候。你就尽可能的去写下你听到的信息，这个时候你大概率会比第一遍，听懂更多的内容。","那第三遍呢，把原文拿出来，你听一句，认一次暂停，自己尽可能的去模仿音频的发音。把这个句子读字，这一步是为了让你熟悉，标准英语是怎么发音的，句子是怎么连读的。我不是要你说，把你的口语训练的多标准啊，我只是想让你能够听得懂，特别是有一些单词。你看见它长什么样，你能认得出来。","但是你不知道它的发音，或者说它放到句子里，你听不出来，那这种单词你就要格外小心。你自己多听几遍，把它的发音给记下来，还有一些生词和短语，也都可以积累下来，第四遍把原文给我盖上。拿出一张白纸，给我播放听力，边听边把你听到的句子写下来，你听不懂的地方，你可以拉动进度条。重新播放反复听，你尽可能的写下来，因为你在第三遍的时候，已经读过原文了。","所以说这个时候多听几遍，你是可以听出来的，如果你还是听不出来，你可以先跳过。最后拿着这张纸，跟原文做比对，去看看自己是哪几个单词，哪几个句子，还没有掌握下它的发音。然后你按照我们刚才第三遍的方法，你要再重新学一遍它的发音，后面呢，我们还要进行第五遍。第六遍的精听，同样不看原文，拿一张纸拿出来写，直到你这一整套听力，都可以轻松无障碍的听懂。再换下一套听力去精听，建议大家从第五遍开始，就可以去开倍速的听，因为高考的听力。","其实它的语速是很慢很慢的，你去看英语的电影就知道，那根本就不是说正常说话的语速。所以说如果你能够听懂，开倍速时候的听力，那等到考试的时候，你就会觉得，啊他读的居然这么慢。慢到足以你听懂，每一个细节，那做体系来不就是降维打击吗，在倍速，在做倍速的时候呢？我建议你循序渐进的加。","比如说你先听一倍速，前五遍听一倍速。然后从第六遍的开始，从1.2倍速。然后逐渐的加到1.5，再加到1.8。最后加到二倍速，你不要一上来就开二倍速，那样的话你会受不了的，你这么坚持，精听个十套八套的。以后总觉得你自己在听力，这个提醒上，仿佛就跟进化了一样，那除了那些精听的那几道题之外呢？其余平时练习的题目，也要在做完题之后，看着原文重新听一遍，积累生死和短语，我们接下来再说一说，这个听力考试的一些应试技巧。","现在高三同学呢，可能没有时间去做太多的精听，那接下来呢，这些应试技巧呢，我建议你也记住。首先你拿到卷子，马上先读听力题，明确每一题问的都是什么，一般呢，可以分为五个W和一个H，也就是说。what，where，问，why，以及how，学长东北人口语不太好，读的不标准啊。因为我们在第一遍，听这个听力的时候呢，真的很难做到，把整段话百分之百的听懂。","所以说我们要提前读题，明确我们要重点听哪些内容。然后考试领想了之后呢，会有一段试音的时间，很多学生就想着，争分夺秒，把第一道阅读题给做了。千万不要，这个时候你就拿起笔，来圈化听力题的关键词。然后浏览一下每一个选项，看看每个选项的关键词是什么，大概猜一下这个听力内容。是在说一个什么事，特别是前五道对话题，听力只读一遍。","所以说你更要做好提前审题，高中听力啊，不是说你听到哪个选项，你就选哪个选项。很大概率，所有选项的关键词，都会在原文中出现。所以你一定要提前看好，提干问的是什么，重点去听提干问的部分。好吧，那第二个就是，你在听的过程中，可能很明确的听到了，你想要的那个答案的发音。","但是你脑子里反应不过来，这是个什么单词，你就用中文也好，还是用拼音也好，你把那个发音给记下来。你不用非得完美主义，把那个单词原原本本的写出来，你就简单的记下发音。然后去对比一下选项，像跟选项哪个单词发音比较像，或者是猜一下这个发音，所能是选项中哪个单词的同义词，还有就是。你听力切记犹豫太久，这道题你实在没听出来，你就凭第一感觉蒙一个。","然后赶紧去听下一道题，如果你有记录一些听到的信息的话呢，可以等所有的听力播完之后。你再返回来看，根据你记录的信息，推测一下内容再重新选，那在听的时候呢，我们要重点记录那些内容呢？第一个就是和提干设问直接相关的。比如说这个提问的是问，那当你听到时间节点的词，你就赶紧记下来，多重听一些这些时间都发生了哪些事。题目问的那个事是在哪个时间节点发生的，第二就是啊，你要记录听到的数字。","比如说有的题是算价格的，按不会直接在原文中念出来，它需要你把听到的数字记下来。然后进行简单的计算，才能得到最后的结果，有的题呢是选某个事件发生的年份的。答案也有可能不是在原文中直接念出来的，原文可能会说告诉你，某某年发生了A事件。十年之后发生了B事件，题目问的是，B事件是哪年发生的，那如果很多同学只听到了A事件的年份。那你就傻傻的踩坑了，而你又没想到要后退十年，还有就是啊，重点听像how，I，work，这种转折词。","可能在这个词出现之前，你已经要把答案选出来了。但是转折词出现之后，可能整个故事的走向就变了，你就要又要重新思考一遍答案。那以上呢这些是应试技巧，你在做听力题的时候呢，就要刻意去使用，这样到了考场才不会觉得陌生或慌乱。如果你学完立刻拿去用，你可能会觉得，会用不清楚，只有在平时练习的时候就多多使用。你在考场上才能用好，如果有时间条件的话，建议按我上面说的精听多听几遍，再去用这些技巧。","效果会更好。"],"id":"c2-19","course":"自学方法","n":19,"chars":3054},{"chapter":"自学方法","title":"20 心态不好的调整方法","paras":["那我们这一课给大家讲一下心态该如何调整。其实心态问题有很多，大致可以分为考试心态，自学心态，以及人际关系的心态，那考试心态呢？在我们的第十节课讲过了，这里我就不赘述了，我们讲讲剩下的两种。第一个自学心态，现在自学的人越来越多了，因为好的教育资源嘛，它是有限的。","比如说咱们的线下学校，你说一个地区能有几个重点高中，那一个重点高中一般，它也分重点班和非重点班。那有些地区教育资源不好的问题，它是基本解决不了的，这个地区落后，那老师好的老师肯定不愿意去。所以就会形成一个恶性循环，但其实互联网解决了这个问题，因为网上有一堆优质的网课老师。","所以说很多学生身在普高，他就会生出想回家自学的想法。首先这是一个好事，家长们你们要这么想问题，孩子想回家自学，肯定是发现了学校对自己的帮助不大。那他本质上是什么，想提高成绩。但是他是想要学好的。但是我们要不要答应他回家，这个问题是有争议的，这肯定是一个因人而异的问题。我们比较的是什么，是他的提分幅度，如果在家自学的提分幅度大于学校，那我们一定选择自学。换句话说，你明知道就算在这个学校考第一，你也考不上98521，那这个时候在家的风险就没有那么大了。","所以说我们是要来对比看待这件事。比如说你家孩子是一个特别烂的高中，那每年连几个本科都没有，那这种在家自学的风险就甚至小于学校。反正在学校就是个专科的命，那孩子想回家自学，你不如让他试试看看能不能改命。这无可厚非。但是如果你是重点高中，甚至是重点班的，可能你，孩子的成绩已经擦边98521了。那这个时候你的风险就比较大。","所以说无论是家长还是学生，我们一定要权衡好利弊，在哪的风险更小，我们就去哪。那我们第三个说，尽量给自己留一条后路，那就是说你真的要自学了，你可以先请一个短期的病假，就比如说生病了。我在家休养，万一学生在家学不进去，我们还能及时的回到学校上学，或者说你跟老师直说。你说老师，我现在差的地方太多了，我想自己回家找点一对一补一下，把基础补完之后。我就回来上学，完全可以，而不是一上来，就请一个大长假，你要给自己一个试错的机会，而且我们发现。","很多的自学生他怎么的呢，三分钟热度，他刚回家的一两个礼拜，他学的斗志漫漫，但时间长了。他就坚持不下去了，那这个时候可能需要学生回学校，再学几天再回家自学，那第四点呢？我们讲一讲自学的利弊，这样的话方便你们权衡。首先自学的一大优点，就是你可以随意支配自己的时间，你可以把大量的时间，放到自己的瘸腿科目上，而我们学习的顺序就是。在建立了自己的优势科目后，我们要把大量的时间，找自己成绩，找自己适合的网课老师。","进行瘸腿章节的一个查缺不漏，那弊端的话，我其实觉得最大的弊端，就是自律问题。因为学校是一个，能让你学习的一个天然的场所，而你脱离了学校之后，你是否还学习就不一定了。学校的作用，我认为就两个。第一个考试。第二个学习氛围，因为学校天然是一个学习的场所，而且它能给你组织一个，类似于高考的大型考试，这个是你在家自学模拟不了的，而在家。它家里其实偏向于一个，休息或者娱乐的场所。","所以说我特别害怕的就是，你在家不自律，而去玩手机这类的，那这个时候，你可以选择一些。比如说像图书馆，自习室这样的场所，或者是你把你的学习桌，打造一个学习的样子。比如说你学习的时候，桌子上只留你学习用的书和笔，你把手机这类的东西全拿走。","第二个弊端，可能就是考试了，就你不在学校的话，你自己给自己考试，你远远没有那种感觉，就即使你在给自己倒计时。但你也没有在考场上，所有人坐在一个考场上，那种紧迫感。所以我建议，就算你在家自学，你可以跟学校老师商量一下，看能不能每个月，回去参加一次考试。如果考得好。","比如说老师继续，同意你在家自学，如果考不好，我就回学校，可以跟他商量一下。所以说自学是否自学，这种事没有标准的答案，而是你在考虑了利弊之后，根据你自身的情况。做出一个对自己而言的最优解，OK，我们接下来，给大家讲一讲，就是人际关系的一个心态。","比如说有些同学，他会遇到什么不合群，学生和老师都不喜欢他，这种困惑。但是你要知道，牛羊才喜欢结队，猛兽更喜欢独行，你上坡路一定是孤独，一定是难走的。如果你走的特别舒服，那说明你再走下坡路，你记住，这个世界上成功的，永远是少数人。能考上985211，永远是少部分，你做的，如果跟大多数人做的事一样，那说明你最后拿到的，就是跟他们一样的结果。","所以第一个杜绝的心态，就是从众心理，你看他去刷数学题了，你也去，你看他们去报补课班了。你也补，你看他们买哪本电视，你也买，这些都是不对的，你最先要做的事，就是先了解自己。然后根据自己的情况，做出适合自己的判断，这样你才有可能成为，那少部分成功的人。第二点就是，我以一个过来人的身份，可以明确告诉你，初高中特别要好的朋友，一个两个就够了。其他的都不重要，真正的人际关系，一定是利益互换，就是我能给你提供价值，你也能给我提供。","那我们就一定是好朋友，而不考虑利益互换，就会一味的对你好的，只有你的父母能做到。记住我说的这句话。所以说，我们对于人际关系，初高中阶段，我们的策略就是，让自己变优秀，在变优秀的过程中。你可能会不太在意人际关系，但当你优秀之后，那些人际关系会蜂拥而至，对吧，你数学考140。来问你数学题的学生，肯定很多，当你有价值的时候，当你厉害的时候，你身边是不缺朋友的。但当你还不强的时候，你在人际关系中，你投入再多的时间，也没有用。","所以你要做的就是，把注意力放到自己身上，你不管别人做什么，不管他们怎么样，你只看自己怎么样。你让自己，才是解决一切问题的关键，当然了，我说的不重要，不代表着你不需要社交，而是说。它跟你自己相比，重要性不大。但是你是一个人，人做社交，是一件很正常的事情，基本的社交，我们一定是要有的，就算你在家自学。你也可以去认识，一些网络上的网友。","比如说他也是自学的，你们也可以交朋友认识。所以说对于人际关系，我们要以一个，很平常的心来对待，就这玩意不重要，你不要因为这个。导致自己的情绪波动，而影响你的成绩，这样就得不偿失了，没有人会对你的成绩，只有你自己才会。那我们在人际关系讲完之后，我们讲点其他的形态。","比如说焦虑。比如说学习太累了，我该怎么办。其实焦虑的来源很简单，你学了很久，你刷了很多题。但是成绩还是没有起色。其实这个我们之前提到过，我们的提升。其实不太好用成绩来衡量，因为一场考试，难度不确定，自身状态不确定，不能笼统的概括为。我分数变高了，我就是提升，我分数变低了，我就是下降，就这个上升和下降，要看自己的感觉。给你举个例子。","比如说你连续刷了几篇阅读理解，你从一开始的20分钟一篇，到后来你现在10分钟，就能刷一篇题了。我先不谈正确率，你从做题速度来看，你就是一个明显的提升。所以说你正反馈的来源，不仅仅是成绩，可以来自于任何的一件小事，要学会自己给自己找正反馈。","比如说你做了五道题，之前你做五道题错三个，你现在做五道题只错两个，之前背50个单词。只能记住30个，现在你能记住35个，这些小事情都是你的提升，不要只记住，只盯着成绩。那玩意除了高好成绩都没有用。所以说其实高中生活苦吗？","其实很苦的，因为你在走上坡路，上坡路一定是逆风的，我也做不到让你无痛学习，谁都做不到。我能做到的就是，让你尽量的苦中做了，帮你找到那个，可以让你正反馈的那个点，再就是如果你实在压抑太久太久了。可以请个假出去玩玩，你不要觉得浪费时间，我们是在解决问题，这个过程是在帮你释放压力。只有你压抑释放出来，你接下来的学习才能更高效，对吧，你接下来更好学习的。","比如说睡觉，没有人觉得睡觉浪费时间，因为你如果不睡觉，你怎么学习，睡觉是为了更好的学习，这种小来小去的事情。比如说一次考试没考好，那我一般，就我会选择出去跑一圈，放空自己，什么都不想就一直跑。跑到我想学习了，我再回去，包括我压力太大的时候，我会一个人找一个KTV，在里面唱歌。大声的唱歌，把我的情绪吼出来，这种排泄的方式，都是一个好办法，这些我刚才讲的几个办法。都是一个亲策好用的办法，这些都是调节心态的，那我们这一课就讲到这儿。","好吧。"],"id":"c2-20","course":"自学方法","n":20,"chars":3298},{"chapter":"自学方法","title":"21 顶级学习方法之刷专题","paras":["我们这一课呢给大家讲一个特别特别顶级的学习方法。其实这个方法呢我们之前的课里，韩沙是有讲过，只不过那个时候可能没有给它单拎出来。我现在希望给它单拎出来以后呢，能引起你的一个重视啊，这个叫什么呢叫刷专题，这个方法无论你是小还是粗还是高都使用，就是什么叫刷专 <script>
"use strict";
/* ==================== 数据 ==================== */
const DATA = JSON.parse(document.getElementById("d").textContent);
const COURSES = DATA.courses;
const LESSONS = [];
COURSES.forEach((c, ci) => c.lessons.forEach(l => { l.ci = ci; LESSONS.push(l); }));
const IDX = new Map(LESSONS.map((l, i) => [l.id, i]));
const TOTAL_CHARS = LESSONS.reduce((s, l) => s + l.chars, 0);
const CN = n => n.toLocaleString("zh-CN");

/* ==================== 本地状态 ==================== */
const LS = {
  get(k, d) { try { const v = localStorage.getItem("cr_" + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("cr_" + k, JSON.stringify(v)); } catch (e) {} }
};
const state = {
  selC: new Set(LS.get("selC", COURSES.map(c => c.id))),
  selL: new Set(LS.get("selL", LESSONS.map(l => l.id))),
  pendC: null, pendL: null,
  kw: "",
  cur: null,
  prog: LS.get("prog", {}),
  fs: LS.get("fs", 17.5),
  serif: LS.get("serif", false),
  night: LS.get("night", false)
};
function saveSel() { LS.set("selC", [...state.selC]); LS.set("selL", [...state.selL]); }
function saveProg() { LS.set("prog", state.prog); }

/* ==================== 工具 ==================== */
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let toastTimer = null;
function toast(msg) {
  const t = $("toast");
  t.textContent = msg; t.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("on"), 1700);
}

/* 一门课的全部课时，是否都在选中集合里 */
function courseOn(c) { return c.lessons.every(l => state.selL.has(l.id)); }

/* 搜索：标题优先 + 正文命中 */
function matchText(l, kw) {
  if (!kw) return true;
  if (l.title.toLowerCase().includes(kw)) return true;
  if (l.chapter.toLowerCase().includes(kw)) return true;
  return l.paras.some(p => p.toLowerCase().includes(kw));
}
/* 当前生效的筛选结果（阅读时 上一节/下一节 的遍历顺序） */
function filtered(sel) {
  const kw = (sel ? state.kw : state.kw).trim().toLowerCase();
  const out = [];
  COURSES.forEach(c => {
    if (sel && !state.selC.has(c.id)) return;
    c.lessons.forEach(l => {
      if (sel && !state.selL.has(l.id)) return;
      if (!matchText(l, kw)) return;
      out.push(l);
    });
  });
  return out;
}

/* ==================== 侧栏（两级筛选） ==================== */
function renderSide() {
  const pc = state.pendC || state.selC, pl = state.pendL || state.selL;
  const kw = state.kw.trim().toLowerCase();
  let html = "";
  COURSES.forEach(c => {
    const on = pc.has(c.id);
    const ls = c.lessons.filter(l => matchText(l, kw));
    const selN = c.lessons.filter(l => pl.has(l.id) && matchText(l, kw)).length;
    html += '<div class="cBlock">';
    html += '<button class="cRow' + (on ? " on" : "") + '" data-c="' + c.id + '">'
      + '<span class="box"></span><span class="nm">' + esc(c.name) + "</span>"
      + '<span class="ct">' + selN + "/" + c.lessons.length + "</span></button>";
    html += '<div class="lsWrap">';
    if (!ls.length) html += '<div class="hint" style="padding:14px 4px">无匹配课时</div>';
    ls.forEach(l => {
      const on2 = pl.has(l.id);
      html += '<button class="lRow' + (on2 ? " on" : "") + '" data-l="' + l.id + '">'
        + '<span class="box"></span><span class="tt">' + esc(l.title) + "</span>"
        + '<span class="tag">' + CN(l.chars) + "</span></button>";
    });
    html += "</div></div>";
  });
  $("sBody").innerHTML =
    '<div class="lvl1">课程（一级目录）</div>' + html;
  const n = COURSES.reduce((s, c) => s + c.lessons.filter(l => pl.has(l.id) && matchText(l, kw)).length, 0);
  $("applyN").textContent = n;
  $("sideSub").textContent = COURSES.length + " 门课 · " + LESSONS.length + " 节";
}

/* ==================== 主列表 ==================== */
function renderList() {
  const arr = filtered(true);
  const kw = state.kw.trim().toLowerCase();
  $("menuN").textContent = arr.length;
  if (!arr.length) {
    $("list").innerHTML = '<div class="empty">没有符合筛选条件的课时<br>试试调整左侧筛选或清空搜索词</div>';
    return;
  }
  let html = "";
  let lastCi = -1;
  arr.forEach(l => {
    if (l.ci !== lastCi) {
      lastCi = l.ci;
      const c = COURSES[l.ci];
      html += '<div class="cGroup"><h2 class="cTitle">' + esc(c.name)
        + '<span class="au">' + esc(c.author) + "</span></h2></div>";
    }
    const p = state.prog[l.id] || 0;
    const tag = l.chapter && l.chapter !== l.course
      ? '<span class="bdg c' + (l.ci + 1) + '">' + esc(l.chapter) + "</span>" : "";
    let snip = "";
    if (kw) {
      const hit = l.paras.find(x => x.toLowerCase().includes(kw));
      if (hit) {
        const i = hit.toLowerCase().indexOf(kw);
        snip = (i > 26 ? "…" : "") + hit.slice(Math.max(0, i - 26), i + 74) + "…";
      }
    }
    html += '<button class="lesson" data-id="' + l.id + '">'
      + '<div class="l1"><span class="no">' + l.n + "</span>"
      + '<span class="tt">' + esc(l.title) + "</span></div>"
      + '<div class="meta">' + tag + '<span class="bdg soft">' + CN(l.chars) + " 字</span>"
      + (p > 0.02 ? '<span class="bdg read">已读 ' + Math.round(p * 100) + "%</span>" : "")
      + '<span class="bdg soft">' + l.paras.length + " 段</span></div>"
      + (snip ? '<div class="meta" style="display:block;color:var(--tx2)">' + esc(snip) + "</div>" : "")
      + (p > 0.02 ? '<div class="bar"><i style="width:' + Math.round(p * 100) + '%"></i></div>' : "")
      + "</button>";
  });
  $("list").innerHTML = html;
}

function renderHero() {
  $("heroKv").innerHTML =
    '<span>' + COURSES.length + " 门课程</span>"
    + "<span>" + LESSONS.length + " 节课时</span>"
    + "<span>约 " + (TOTAL_CHARS / 10000).toFixed(1) + " 万字</span>"
    + '<span>逐字稿原文</span>';
}

/* ==================== 阅读 ==================== */
let saveTimer = null;
function openLesson(id, push) {
  const l = LESSONS[IDX.get(id)]; if (!l) return;
  state.cur = id;
  const c = COURSES[l.ci];
  const arr = filtered(true);
  const pos = arr.findIndex(x => x.id === id);
  const idxAll = IDX.get(id);
  const tag = l.chapter && l.chapter !== l.course
    ? '<span class="cTag c' + (l.ci + 1) + '">' + esc(l.chapter) + "</span>" : '<span class="cTag">' + esc(c.name) + "</span>";
  $("rBody").innerHTML = '<div class="art' + (state.serif ? " serif" : "") + '">'
    + tag
    + "<h1>" + esc(l.title) + "</h1>"
    + '<div class="rmeta"><span>' + esc(c.name) + "</span><span>" + esc(c.author) + "</span><span>"
    + CN(l.chars) + " 字</span><span>第 " + (idxAll + 1) + " / " + LESSONS.length + " 节</span></div>"
    + '<div class="txt">' + l.paras.map(p => "<p>" + esc(p) + "</p>").join("") + "</div>"
    + '<div class="pager"><button id="pPrev"' + (pos <= 0 ? " disabled" : "") + ">"
    + (pos > 0 ? "‹ " + esc(arr[pos - 1].title) : "已是第一节") + "</button>"
    + '<button class="nx" id="pNext"' + (pos < 0 || pos >= arr.length - 1 ? " disabled" : "") + ">"
    + (pos >= 0 && pos < arr.length - 1 ? esc(arr[pos + 1].title) + " ›" : "已是最后一节") + "</button></div>"
    + '<div class="edgeEnd"></div></div>';
  $("reader").classList.add("open");
  document.body.classList.add("locked");
  const rb = $("rBody");
  rb.scrollTop = 0;
  $("rPrev").disabled = !(pos > 0);
  $("fPrev").disabled = $("rPrev").disabled;
  $("rNext").disabled = !(pos >= 0 && pos < arr.length - 1);
  $("fNext").disabled = $("rNext").disabled;
  $("rPos").textContent = pos >= 0 ? ("筛选内 " + (pos + 1) + " / " + arr.length) : (idxAll + 1) + " / " + LESSONS.length;
  updateBar();
  renderToc();
  if (push !== false && location.hash !== "#" + id) history.replaceState(null, "", "#" + id);
  if (!state.prog[id]) { state.prog[id] = 0.001; saveProg(); }
}
function closeReader() {
  $("reader").classList.remove("open");
  document.body.classList.remove("locked");
  state.cur = null;
  if (location.hash) history.replaceState(null, "", location.pathname + location.search);
  renderList();
}
function updateBar() {
  const rb = $("rBody");
  const max = rb.scrollHeight - rb.clientHeight;
  const r = max > 4 ? Math.min(1, rb.scrollTop / max) : 1;
  $("rBar").style.width = (r * 100).toFixed(1) + "%";
  if (state.cur) {
    const old = state.prog[state.cur] || 0;
    if (r > old || old < 0.02) {
      state.prog[state.cur] = r;
      clearTimeout(saveTimer);
      saveTimer = setTimeout(saveProg, 400);
    }
  }
  return r;
}
function go(step) {
  if (!state.cur) return;
  const arr = filtered(true);
  const p = arr.findIndex(x => x.id === state.cur);
  if (p < 0) return;
  const t = arr[p + step];
  if (t) openLesson(t.id);
}
function renderToc() {
  let html = "";
  COURSES.forEach((c, ci) => {
    html += '<div class="lvl1">' + esc(c.name) + "</div>";
    c.lessons.forEach(l => {
      html += '<button class="tocRow' + (l.id === state.cur ? " cur" : "") + '" data-id="' + l.id + '">'
        + (l.chapter && l.chapter !== l.course ? esc(l.chapter) + " · " : "") + esc(l.title) + "</button>";
    });
  });
  $("tocBody").innerHTML = html;
}
function syncChrome() {
  document.body.classList.toggle("night", state.night);
  $("nightBtn").textContent = state.night ? "☀" : "☾";
  $("rNight").textContent = state.night ? "☀" : "☾";
  $("rSerif").classList.toggle("on", state.serif);
  document.documentElement.style.setProperty("--fs", state.fs + "px");
  document.querySelectorAll(".art").forEach(a => a.classList.toggle("serif", state.serif));
  const m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute("content", state.night ? "#14171c" : "#ffffff");
}

/* ==================== 事件 ==================== */
$("menuBtn").onclick = () => { document.body.classList.add("drawn"); document.body.classList.add("locked"); };
$("closeSide").onclick = () => { document.body.classList.remove("drawn"); document.body.classList.remove("locked"); };
$("scrim").onclick = $("closeSide").onclick;

$("sBody").onclick = e => {
  const cb = e.target.closest("[data-c]");
  const lb = e.target.closest("[data-l]");
  if (!state.pendC) { state.pendC = new Set(state.selC); state.pendL = new Set(state.selL); }
  if (cb) {
    const cid = cb.dataset.c;
    const cl = COURSES.find(x => x.id === cid).lessons;
    const on = cl.every(l => state.pendL.has(l.id));
    cl.forEach(l => on ? state.pendL.delete(l.id) : state.pendL.add(l.id));
    on ? state.pendC.delete(cid) : state.pendC.add(cid);
  } else if (lb) {
    const lid = lb.dataset.l;
    state.pendL.has(lid) ? state.pendL.delete(lid) : state.pendL.add(lid);
    const c = COURSES.find(x => x.lessons.some(l => l.id === lid));
    c.lessons.every(l => state.pendL.has(l.id)) ? state.pendC.add(c.id) : state.pendC.delete(c.id);
  } else return;
  renderSide();
};
$("applyD").onclick = () => {
  if (state.pendC) { state.selC = state.pendC; state.selL = state.pendL; state.pendC = state.pendL = null; }
  saveSel(); renderSide(); renderList();
  document.body.classList.remove("drawn"); document.body.classList.remove("locked");
  window.scrollTo({ top: 0 });
};
$("resetAll").onclick = () => {
  state.pendC = new Set(COURSES.map(c => c.id));
  state.pendL = new Set(LESSONS.map(l => l.id));
  state.kw = ""; $("kw").value = "";
  renderSide();
};
let kwTimer = null;
$("kw").oninput = e => {
  state.kw = e.target.value;
  if (state.pendC) { /* 保持待选状态 */ } else { state.pendC = new Set(state.selC); state.pendL = new Set(state.selL); }
  clearTimeout(kwTimer);
  kwTimer = setTimeout(() => { renderSide(); renderList(); }, 130);
};

$("list").onclick = e => {
  const b = e.target.closest("[data-id]");
  if (b) openLesson(b.dataset.id);
};
$("rClose").onclick = closeReader;
$("rPrev").onclick = $("fPrev").onclick = () => go(-1);
$("rNext").onclick = $("fNext").onclick = () => go(1);
$("rBody").onscroll = updateBar;
$("rFontUp").onclick = () => { state.fs = Math.min(26, state.fs + 1); LS.set("fs", state.fs); syncChrome(); updateBar(); };
$("rFontDown").onclick = () => { state.fs = Math.max(14, state.fs - 1); LS.set("fs", state.fs); syncChrome(); updateBar(); };
$("rSerif").onclick = () => { state.serif = !state.serif; LS.set("serif", state.serif); syncChrome(); };
$("nightBtn").onclick = $("rNight").onclick = () => { state.night = !state.night; LS.set("night", state.night); syncChrome(); };
$("rToc").onclick = () => { $("toc").classList.add("open"); renderToc(); };
$("tocClose").onclick = () => $("toc").classList.remove("open");
$("toc").onclick = e => { if (e.target === $("toc")) $("toc").classList.remove("open"); };
$("tocBody").onclick = e => {
  const b = e.target.closest("[data-id]");
  if (!b) return;
  $("toc").classList.remove("open");
  openLesson(b.dataset.id);
};
$("rCopy").onclick = async () => {
  const l = LESSONS[IDX.get(state.cur)]; if (!l) return;
  const c = COURSES[l.ci];
  const txt = "《" + c.name + "》\n" + (l.chapter && l.chapter !== l.course ? l.chapter + " · " : "") + l.title + "\n\n"
    + l.paras.join("\n\n");
  try {
    await navigator.clipboard.writeText(txt);
    toast("已复制本课逐字稿");
  } catch (e) {
    const ta = document.createElement("textarea");
    ta.value = txt; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); toast("已复制本课逐字稿"); } catch (x) { toast("复制失败，请长按选择"); }
    ta.remove();
  }
};
document.addEventListener("keydown", e => {
  if ($("toc").classList.contains("open") && e.key === "Escape") { $("toc").classList.remove("open"); return; }
  if (!$("reader").classList.contains("open")) return;
  if (e.key === "Escape") closeReader();
  else if (e.key === "ArrowLeft") go(-1);
  else if (e.key === "ArrowRight") go(1);
});
window.addEventListener("hashchange", () => {
  const id = location.hash.slice(1);
  if (id && IDX.has(id)) openLesson(id, false);
});

/* 手势：左边缘右滑开抽屉 / 抽屉左滑关闭 / 阅读层左边缘右滑返回 */
(function gestures() {
  const EDGE = 26;
  let sx = 0, sy = 0, mode = 0, tracking = false;
  const drawerOpen = () => document.body.classList.contains("drawn");
  const readerOpen = () => $("reader").classList.contains("open");
  document.addEventListener("touchstart", e => {
    if (e.touches.length !== 1) return;
    const t = e.touches[0];
    sx = t.clientX; sy = t.clientY; tracking = true;
    if (drawerOpen()) mode = 2;
    else if (!readerOpen() && sx <= EDGE) mode = 1;
    else if (readerOpen() && sx <= EDGE) mode = 3;
    else mode = 0;
  }, { passive: true });
  document.addEventListener("touchend", e => {
    if (!tracking) return;
    tracking = false;
    const t = e.changedTouches[0];
    const dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dy) > Math.abs(dx) * 1.3 || Math.abs(dx) < 42) { mode = 0; return; }
    if (mode === 1 && dx > 0) { document.body.classList.add("drawn", "locked"); }
    else if (mode === 2 && dx < 0) { document.body.classList.remove("drawn", "locked"); }
    else if (mode === 3 && dx > 0) { closeReader(); }
    mode = 0;
  }, { passive: true });
})();

/* ==================== 启动 ==================== */
renderHero();
renderSide();
renderList();
syncChrome();
(function boot() {
  const m = /mode=([a-z]+)/.exec(location.search);
  if (m && m[1] === "desktop" && innerWidth < 900) toast("当前为桌面版视图");
  const id = location.hash.slice(1);
  if (id && IDX.has(id)) openLesson(id, false);
})();
</script>
</body>

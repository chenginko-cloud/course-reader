<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

  padding-top:env(safe-area-inset-top);display:flex;align-items:center;gap:9px;padding-left:10px;padding-right:10px;

  border-bottom:1px solid var(--line)}

  border-radius:999px;background:var(--bg);max-width:74%}

.top .menu .ic i{display:block;height:1.7px;background:var(--tx2);border-radius:2px;margin:3.2px 0}

  transform:translateX(-101%);transition:transform .3s cubic-bezier(.32,.72,0,1);

.lvl1{font-size:11px;font-weight:700;color:var(--tx3);letter-spacing:.6px;padding:14px 6px 7px}
.cBlock{margin-bottom:4px}
.cRow{display:flex;align-items:center;gap:9px;width:100%;padding:9px 8px;border-radius:10px;text-align:left}
.cRow:active{background:var(--bg2)}
.cRow .box{width:17px;height:17px;border-radius:5px;border:1.6px solid var(--line);flex:none;

.cRow.on .box{background:var(--accent);border-color:var(--accent)}
.cRow.on .box::after{content:"";position:absolute;left:4.5px;top:1px;width:5px;height:9px;
  border:2px solid #fff;border-top:0;border-left:0;transform:rotate(45deg)}
.cRow .nm{flex:1;font-size:14.5px;font-weight:600;line-height:1.45}
.cRow .ct{font-size:11.5px;color:var(--tx3);font-variant-numeric:tabular-nums;flex:none}

.lRow:active{background:var(--bg2)}
.lRow .box{width:15px;height:15px;margin-top:2px;border-radius:4.5px;border:1.5px solid var(--line);flex:none;

.lRow.on .box{background:var(--accent);border-color:var(--accent)}
.lRow.on .box::after{content:"";position:absolute;left:4px;top:1px;width:4px;height:8px;
  border:2px solid #fff;border-top:0;border-left:0;transform:rotate(45deg)}
.lRow .tt{flex:1;font-size:13.5px;line-height:1.55;color:var(--tx2);word-break:break-word}
.lRow.on .tt{color:var(--tx)}

.lesson{display:block;width:100%;text-align:left;padding:14px 2px;border-bottom:1px solid var(--line2)}

.empty{padding:70px 12px;text-align:center;color:var(--tx3);font-size:14px;line-height:2.1}

.reader{position:fixed;inset:0;z-index:80;background:var(--bg);display:none;flex-direction:column}
.reader.open{display:flex}
.rTop{flex:none;display:flex;align-items:center;gap:7px;padding:9px 11px;

.rTop .sp{flex:1}

.rFoot{position:fixed;left:0;right:0;bottom:0;z-index:82;display:flex;align-items:center;gap:8px;

.tocRow:active{background:var(--bg2)}

<script type="application/json" id="d">{"courses":[{"id":"c1","name":"如何唤醒孩子的自驱力","author":"家卫老师","desc":"压力系统 · 动力系统 · 惯性系统 · 唤醒系统","source":"docx 讲稿","lessons":[{"chapter":"前言","title":"前言","paras":["这是一个关于自驱力的课程，我将分为压力系统，动力系统，惯性系统和唤醒系统给大家全面的讲解一下怎么培养孩子的自驱力？","我们都希望有一个自驱力很强的孩子，他们在面对这个世界不是一种防御的姿态，而且而是一种进攻的姿态，我们要让孩子有这种姿态，这就是压力系统要干的事情。在压力系统中，我将讲解如何拿掉孩子的毒性压力，或者是把一些短暂的压力给孩子化解掉，甚至是反馈为盈。","当孩子远离毒性压力，他就卸下了沉重的负担，放下了恐惧，能够轻装上阵，面对这个世界自驱力强的孩子，他眼里有光，能够专注地投入到一个战略性的目标中去。他有斗志，有好奇心，这就是我们要说的动力系统，不要怀疑，动力系统能让我们的孩子快乐乐学习。玩耍偷懒，不是快乐学习，快乐学习是有自驱力的学习，去掰扯学习到底是辛苦的还是不辛苦的，没有意义，就好像我们去打篮球这种运动，你说打篮球辛不辛苦？非常辛苦。大汗淋漓，肌肉酸痛，还要时常遭受队友的责骂和自信心的崩溃。可是爱打篮球的人从来不会说这是辛苦的，因为他有动力。","孩子在成长的过程中，自驱力常常被破坏。我们除了要解放他的压力系统，要给他构建一个好的动力系统之外，我们父母还要给他培养一些习惯，这就是惯性系统，惯性系统能够让我们孩子的生活变得轻松。我举一个最朴素的例子，比如我们在大街上走路，我们不会在走路这件事情上花心思。我们的双腿就会调条件反射自然的走动，这就是我们身体的习惯，这个习惯我们养成的有多好。我们在走路的时候可以聊天，手上还可以干事情，还可以看风景。我们常常都会忘记自己正在走路。这个就是习惯的霸道，哪怕是我们走路的前进方向有障碍物，我们的双腿都会自然的避开。如果孩子在学习事有了一个比较完善的惯性系统，那么他的自驱力都不是一种力了，就是一种惯性，是一种根本停不下来的感觉。可是我也知道有很多关注自驱力的父母，他孩子的自驱力已经经遭受了不同程度的破坏。根据破坏程度的大小，我们把它分为烦躁，疲惫，抵触和放弃。","在最后一个板块的唤醒系统，我将分享如何分辨孩子他的自驱力到底被破坏到了什么程度。这个时候我们到底应该采用什么样的教育策略去唤醒他的自驱力？这一个板块单独拿出来说，是因为他已经不是一个理想的教育状态了。我们的孩子可以这样说，他生病了。你叫一个健康的人天天去运动，这没有有任何问题。运动使人更健康，但是，你叫一个感冒了的人去剧烈运动，他可能病情会加重。所以当孩子自驱力被破坏了之后，我们采用的教育策略是不一样的，可能就没有那么理想化了，但是你不看前面的要压力系统，动力系统和惯性系统，那么我们的唤醒系统就没有根基，所以这个课程是不要去反着看的，它有顺序，就好像动力系统和惯性系统一定要建立在孩子的压力系统是健康的前提下进行，否则，就会得不偿失。有多少家庭，他在培养孩子兴趣的时候，让孩子丧失了掌控感，出现了毒性压力，从而，反而自驱力被破坏。有多少家庭在培养孩子习惯的时候，破坏了孩子的胜任感，又让孩子的自驱力进一步被破坏。所以它有一个顺序，我在课程里面都会反复的提醒，各位父母，那我们开始吧。"],"id":"c1-1","course":"如何唤醒孩子的自驱力","n":1,"chars":1252},{"chapter":"压力系统","title":"01 压力系统概述","paras":["压力系统是整个课程中最基础的一个板块，原因很简单，我们要保证孩子的压力系统是健康的，我们才能够去培养孩子的兴趣、习惯。这一系列的事情，一旦孩子的压力系统它是不健康的，那么我们的孩子就会长到期处于自我保护的状态，这样的状态没有办法培养，甚至没有办法沟通，更别谈什么自去离业。有很多父母都跟我说过，我感觉我孩子没什么压力，我看他一天天对学习是一种无所谓的态度，有些时候还有点抵触，反抗、逆反，其实不管是表现得无所谓还是逆反，都是压力的结果。","我们不妨换位思考的想一下。当我们在自己的人生中遭遇了巨大的失败，或者在面对人生中一个巨大的，难以跨越的困难的时候，我们非常强，清楚自己的内心有很大的压力。可是我们表达出去往往就是无所谓。还有就是攻击性很强，对于孩子来说就是抵触和叛逆。所以这个板块有多重要？它是破坏我们孩子自驱力的罪魁祸首。孩子的自驱力，其实不是我们父母，老师给他的，他的自驱力本来就是天生的。","父母们回想一下孩子在一两岁的时候，他多么努力的去走路，在三四岁的时候有多么努力的去认字，只要你没有强迫他去认字、走路、用筷子这些东西，你会发现孩子像一个小学霸一样，克服了对他来说的一个又一个的困难。如果你去帮他，他还会生气。可是他的自驱力，很有可能因为各种各样的原因渐渐的褪色了。而这各种各样的原因的总和就是压力。","那么什么是压力？压力是一种失去掌控感的感觉，大家要牢牢地记住这个概念，在这个课程中会反复出现压力的这个定义它是失去掌控感的感觉。","为什么很多观点都说我们不能去打骂孩子，特别是那种有情绪的打骂。就是因为孩子，他感觉你们之间的亲子关系失控，失控就是没有掌控感，没有掌控感，他就会恐惧，他一旦恐惧，就会开始保护自己一个人一旦开始保护自己，他的大脑就不工作了，所以父母带着情绪跟孩子说道理，或者是骂他，孩子反而会听不懂。你带着情绪去辅导孩子做作业，孩子反而会变得更笨，就是这个道理，他的大脑皮层和他的杏仁核脱钩。因为他在自我保护，所以他的整个逻辑系统都没有运转，他就关注你的情绪，因为有情绪的你是他防御的对象。再比如说，当孩子面对巨大的任务量，他也会出现失控的感觉，这有可能是父母造成的，有可能是老师造成的。","为什么作业一定要少？啊我举一个极端的例子，当孩子晚上只有一个小时了，但是他的作业量必须要四五个小时才能够完成，那么他当然就失控了。这种类型的压力虽然不会让孩子停止思考，但是会让孩子逃避，逃避久了，就变成了疲惫。这些不同类型的压力到底我们面对他的时候怎么处理，后面的课程都会一一提到，这一节课，我们主要搞懂压力到底是什么。","我再举一个例子，比如说孩子，他经常被否定，有可能是父母，有可能是老师、同学。如果他经常被否定，他失控的对象是他自己，这其实就慢慢变成了一种自卑。这种自卑对他的压力系统的破坏是巨大的，因为他感觉他不能掌控生活中的任何事情。如果孩子心里面是这种情况，那么你去读，督促他学习，去培养他习惯、去营造一个什么好的亲子沟通，全都是不可能的，最多就是做做样子，因为没有力量。","你说压力真的有那么的恐怖吗？答案是肯定的，我们依然可以换位思考，设身处地的想一下，我举一个就教育孩子的例子，比如说你让孩子去做3+5=8这样一个计算题，他做不出来，你看，其实跟你没什么关系，但是你发现你掌控不了局面，你就特别想强迫他，他说出3+5=8这个答案。你想一想，如果你一旦失去了掌控感，当然有些父母不会你失去了掌控感，你压力只飙升的时候，我们是不是没有什么理智？我们叫孩子去帮我们做一件事情，比如说，叫孩子帮爸爸端一下茶杯。但是孩子就是不肯去你的掌控感失去，压力大起来了，是不是就开始有了情绪？所以我们成年人在处理压力的时候也不是很厉害的，何况他是一个孩子？","那么我们要保护他的自驱力，首先就要关注他的压力。我们完全可以通过这个课程后面讲的一些方法，让孩子不断的拥有这种掌控的，甚至在课程的最后唤醒系统里面，我们还会提到，当我们的压力出现了问题，不健康了，我们要想办法把这种掌控感给他找回来，稳住我们的孩子。否则，自驱力就是一个遥遥无期的事情。但是换一句话说，当我们孩子的掌控感不断的被满足，他的自驱力，我往往就是顺理成章的事情。好吧。"],"id":"c1-2","course":"如何唤醒孩子的自驱力","n":2,"chars":1715},{"chapter":"压力系统","title":"02 示弱","paras":["关于压力系统，我要讲的第一个概念是“示弱”。","这个很有意思，就是我们孩子在面对巨大的挑战或者新兴事物的时候，我们帮他做事的话，也就是我们说的包办，孩子反而会感到最大的压力。","这听起来好像有点反常识，但是大家不妨再想一想，我们关于压力的定义是一种失控的感觉，父母们就知道，如果我们总是去帮孩子做事，他的控制感。反而会越来越弱，这是一种看不见摸不着的压力，所以不要怀疑包办会让孩子承担巨大的压力，从而丧失自驱力。","这也是为什么我们不能去溺爱孩子，溺爱的“溺”用的特别的好，因为压力来临的时候，我们的孩子往往感觉自己在一个温水池里面溺水了又舒服。可是又没有着力点，这个基本上在现在的父母群体里面都知道，我们不能包办。可是我们很多父母不能包办之后就控制我们的孩子，就是指挥他去做这，去做哪，你会发现这也会让我们的孩子丧失控制感。因为都是你们吩咐的嘛。小一点的孩子一般会按照你的吩咐去做，但是他偶尔会出现不愿意的情况，父母往往这个时候采取强制性教育，你们感觉到了吗？进一步在破坏他的掌控感，最后的结局就是孩子总是在关注你的情绪。因为你们的亲子关系也失控，所以这条路依然走不通。","那么什么路走的通就是示弱。在我的孩子三岁多的时候，我就已经发现了，每次我们的一句：哎，我的手机呢？你就会发现这个家里面有一个小小的身影，串来串去，还伴随着：我记得，我记得在哪里哪里。然后把手机给你拿过来，你只需要说一句谢谢，都不用夸奖他，他特别想帮我们的忙。有一次我们在一个朋友家里做客，他们有一个四岁多的孩子，是个儿子，我们关系很好，所以我一去他们家就躺在了沙发上，说：哎呀，我太累了啊，我们又穿拖鞋呀。那个四岁多的孩子马上就去把拖鞋给我拿过来了，他的父母都惊呆了，说这个孩子有点生人勿近，也就是说对外人不太友好。但是你看到没有，他依然特别想帮忙，为什么？其实他在帮忙的时候就有掌控感、胜任感、价值感，这会让他的压力值变得特别的低，反而是变得特别的低。","我再强调一遍，压力是失控的感觉，当孩子有掌控感，他就不失控，他压力值就低。我整个压力系统这一章节都是围绕着这一个基本的逻辑来进行，这是比较小的孩子。孩子渐渐长大，到了小学的时候，你去给他讲题就叫做包办，你督促他，催他做作业，就是掌控，但是你说一句：哎，这道题很有意思，爸爸不会，你给爸爸讲一讲。他的压力值一下就降的非常的低，但是我们在示弱的时候，依然有很多需要注意的地方。我以刚才我说叫孩子给爸爸讲题这个例子模拟下去，在讲题的过程中，如果你不断去否定他，去纠正他，他的压力值又渐渐的上来。你要知道孩子之所以这么努力，这么有兴趣的跟你讲题，是因为感觉你是一个小白，那么小白就只会提出疑问，不会纠正他的问题，你发现他讲错了，你的态度往往就是这样，我怎么没理解到呢？而不是不对，重新讲不对，不对，也不需要很夸张的说你太棒了。那你讲的太棒了，因为你就露馅了。这个时候最大的鼓励就是：哦，我懂了，我们在孩子成长的过程中的方方面面都可以找到这样的例子，在我小时候，因为自然而然的原因，我爸喝醉了回到家，我妈又不在，然后我这样一个特别调皮贪玩的孩子在家里面炒蛋炒饭，家里面来了人就是我们的走廊上路过的这种阿姨，我拉着他不让他走，让他打医院的电话之类的。其实后来我就越来越变成了一个会照顾别人的人。","而且在我成长过程中还有一件事情，哪个小孩子不怕这些鬼啊神啊之类的东西，可是我的妈更怕，她是要值夜班，她因为很怕，所以拉着我一起陪他值夜班。那个时候因为我是一个男孩子，我特别特别的小，应该是小学一二年级的。我真的为了堡我的妈妈，在非持恐惧的情况下，像一个小战士守着我妈妈值夜班，一夜又一夜。后来我的胆子也越来越大，视若可以用在很多地方，比如说孩子再大一点，到了初中、高中，他要写一些学习计划，首先这件事情是他自己的事情，可是比如说寒假、暑假，是不是父母很多时候都参与了，我们要尽量的少用“不对”，“可以”，“还不错”这种批判性的语气。有些家长说我多开明呢，他每次来问我，我可不可以下午玩一下午，我说的是“可以”，“可以”叫做批准，你完全可以改成：我觉得你这样安排挺合理。把掌控感还给我们的孩子。","当然这个课程进行到后面，你会发现其实是把一部分掌控感还给我们的孩子，就是有些事情你反正都是要同意。有些事情可能是你反正都管不了的，你就把掌控感还给孩子，这些不断的示弱，这些不断的把掌控感还给孩子，就是他自驱力的土壤。所以这一节课在说什么？就是示弱，示弱是什么？我不会，你帮我，我们需要重视的是什么？真诚，你别不会，不会的，孩子做错了，你就会了，你不仅会了，你还去控制他，教育他，批评他，否定他，你就不叫做示弱，而是在诱敌深入，反将一军。"],"id":"c1-3","course":"如何唤醒孩子的自驱力","n":3,"chars":1912},{"chapter":"压力系统","title":"03 空间1","paras":["关于压力系统的第二个问题，我想说的是“空间”，这个空间来自于你的容错度。什么意思？我们先复习一下，压力是一种失去控制感的感觉，那么如果我们要帮助孩子找到他的掌控感，在最初的时候他当然不可能做的有那么好。如果我们父母总是谨小慎微，处处都希望孩子做到极致，那么孩子就没有空间，他就会浸泡在毒性压力之中，从而对自驱力造成破坏。","我举一个具体的例子，比如说某一个周末或者假期的某一天，孩子制定了他的学习计划和生活计划，可是父母由于不得已的原因不能在家陪伴他，这本来是帮孩子找到掌控感的一个好机会，可是有些父母却把他办成了破坏亲子关系的一种行为。有些父母怕孩子在家玩。不学习，甚至还有些安上了监控，你看这多么的荒谬，你为了孩子这一天的学习，愿意承担无穷无尽破坏自驱力的后果，这个时候教育的思路很简单，你反正这一天都管不了他，哪怕你安上监控，孩子也不可能发自内心的认真的学习。","如果你认为孩子是那种不自觉的孩子，就我们这个例子的前提是孩子他不太自觉，反正这一天你都没有办法控制你的孩子，为什么不大方一点，把这一天交给你的孩子，出门的时候告诉孩子，爸爸妈妈很信任你，今天你一定可以完成你的计划，可是没有我们在身边帮助你，你会遇到一些很大的挑战，这些挑战来自于一些诱惑。还有你的一些难度很难克服，可以必须要克服，如果实在没有办法克服，可以打电话给我们寻求帮助，然后转身就走，坚定而信任。这个时候孩子可能把你当傻子，有些家长特别怕自己在孩子面前当傻子，你就做不了长远的事。","你要知道，往往不自觉的孩子这一天是没有办法克服一些困难的，他可能玩了一天，到你们将要回家的时候，心里面才开始慌，因为有些作业可能是要检查的，有些东西可能是瞒不住的，然后仓皇失措的搞了一些表面功夫。父母回到家应该心中有数，我这一节课说的是要给空间，你就不要去拆穿他，去揭露他，甚至去否定他，你要引导他，你只需要很温柔的问他今天过得怎么样。有没有按照自己的计划来进行，是不是有一些诱惑没有克服啊？如果他说我今天完成的很好。你就真的要相信这才叫做空间。你可以欣慰的告诉他。如果你真的完成了，那么你今天过得可真好，一定不会慌慌张张的。妈妈或者爸爸很高兴你感受到了那种幸福，完了，今天就完了，你一定要今天解决问题吗？你回来给他掰扯真相有意义吗？有教育效果。而你的这种信任。还有你对他完成的计划所表露出来的那种以他为主的，认为他很快乐幸福的。这种观点像一颗种子一样种在他的心田，他可能在某一个晚上想起，成为他自驱力的其中一把钥匙。","我对很多父母提出过这个建议，有些孩子当天就见效，第二天就改头换面换了个人。这个效果如何，要看家庭的氛围，长期以来的你们的亲子关系。但是，如果孩子向你承认了他今天玩耍。没有完成学习任务，你不要落井下石去批评他，否定他，来彰显自己对孩子的控制有多么的重要。那么你还是在教他要拥有自己生活的掌控感吗？还是在给他降低压力值？你只需要告诉他。我很遗憾你今天过得不好，我们每个人都有这样的经历，没有办法克服这些诱惑。","第一，当你能做到之前，妈妈或者爸爸。愿意帮助你，用外力来帮你克服，可是最终得靠你自己。","第二，你要记住，你今天玩的并不好，妈妈、爸爸希望你早日能够掌控你的生活，不要被那些小玩意控制住。","第三，我们要看看你的计划是不是有些问题，是不是太难了，可不可以优化。加油吧儿子，或者加油吧女儿，你意识到了问题，就一定会成功的。","这就叫做空间，我有犯错的机会。我也有改正错误的力量，因为我被理解，压力呢，压力没有，这样的孩子，他的自驱力会慢慢的起来。","在这节课的最后我提醒一下，不是说要给孩子所有的空间，我们在生活中有难以避免的，很多时候是照看不了孩子，要交给孩子自己处理的时候，我希望各位父母就把这样的时间作为孩子可以犯错的空间，并且给予肯定、鼓励、包容和理解。落脚点在哪里，落脚点是要给他指明正确的方向，很多家长理解了，孩子就完了，指明方向就像刚才那个例子里面说的，第一点，第二点，第三点就是在指明方向，那么大家可以通过我这个例子进行举一反三，生活中有很多很多这样的一些可以给孩子空间的机会。那么，是帮助孩子找到掌控感。我们知道掌控感的形成有助于或者是说最助于孩子自驱力的保护。"],"id":"c1-4","course":"如何唤醒孩子的自驱力","n":4,"chars":1716},{"chapter":"压力系统","title":"04 空间2","paras":["关于压力系统的空间，由于上一节课只举了一个例子，怕有些父母找不到感觉，所以我用这一节课来做一些补充。","我们先复习一下。空间是给孩子犯错的机会，这就要求我们父母要尽可能少的去指出孩子的错误。如果你对孩子进行密切关注，并且他犯的每一个错误你都要指出，那么孩子就没有犯错的空间，他的压力就会特别的大，孩子就怕犯错，你知道吗？孩子怕犯错并不是去改正他的错误，他是怕你发现他错。没有犯错空间的人都是这个状态，有些父母就说，你知道错了，你就改正他就好了，这是不了解人性。","一个人要在比较自在的空间里面，他才会去改正他的错误，他才会看到自己，才会向内看。如果一个人他犯的错误被一堆人盯着，他便不会向内看，他会防御。你看，这又回到了压力系统概述里面说的压力值变高，一个人的防御机制就会开启，那么这个时候他不会去关注如何解决事情。","那么我们到底应该怎么让孩子有一个犯错的空间呢？在上一节课我举了一个例子，在这一节课我再多举几个例子。我们先看看老师是怎么做的，我是一个数学老师。那么如果我在批改作业的时候大发雷霆，第二天去上课的时候指指点点大骂一通，那么第二天的作业一定会有抄袭的现象，因为学生是很怕老师的，如果我骂了他们一顿。孩子们反而不会去改正他们的错题。他满脑子想的是如何应付这一个爱发脾气的老师，因为我没有给他们试错的空间，那么一般这个时候我是怎么处理的？我假装不知道他们犯了很多的错，他们错了五六道题啊，有些孩子我甚至会尽量避免检查他们当天的改错，我只会在第二天认真的评讲，并且留下一句话，我告诉他们，这一个题型是比较容易错的，我们班可能需要三到五天来解决这个易错题，但我希望今天晚上你们就能解决掉。孩子们一听有改错的空间，我还有三到五天的机会可以解决这个题型。他就会从应付老师变成要解决自己的问题，这难道不比检查他们的感触效果来得更好吗？这就是空间。","家长们可以举一反三，我举一个做家务的例子，比如说你最近要让孩子学习怎么洗碗，那么你就要知道他第一天洗碗肯定是洗不好的，有些父母就很想指指点点，如果你指指点点的，他就没有空间，你可以明确的告诉他，洗碗这件事情，可能你需要啊，洗个一两周才会洗的特别的好，孩子就问你，难道我今天洗的不好吗？对于第一天洗碗的孩子来说，你洗的非常的好，这个时候我插一句下一章动力系统里面的夸奖，很多父母觉得夸孩子的效果特别的好，就使劲的夸，你夸了他，他确实就特别喜欢洗碗，可是后患无穷，如果以后没有事事都去夸他，他可能就会变得特别的脆弱，因为如果你今天夸他洗碗洗的特别的好。就已经到头了，孩子在今后的生活中就特别喜欢那种及时的反馈，就没有办法做那种远期的规划，简而言之，自控力就会变差。所以说，夸奖孩子。不要夸奖他当天就做到了极致，这就没有一个目标。","好吧，我们先回到空间，这是孩子做家务的事情。我举一个孩子，如果你们辅导他做作业的事情，这个课程不去争论到底要不要陪孩子写作业，如果你要陪孩子写作业的话，你会发现孩子在做作业的时候会做错题，那么父母就不要立即指出他的错误，或者说一两个星期只能够指出那么几次，因为我们要给孩子犯错的空间，很多父母都觉得我陪着。在孩子写作业就是发现他的错误，并且改正他的错误，其实这样做往往会适得其反，孩子他只会关注你有没有发现他的错误，他不会去安心的解决自己在学习上的问题了，因为他的压力特别的大，因为他的犯错空间特别的小，错了就错了嘛，你就算一定要指出他的错误，也应该是在孩子做作业一段固定的专注期之后。统一的指出，否则孩子只会关注你，他越关注你，他错的就越多。","我再举一个小孩子的例子啊，他和写作业有一点点关系，就是我自己的孩子，他四岁半，虽然我们没有叫他写字，可是他有一阵子特别喜欢写阿拉伯数字，他每写一个数字。就会盯着我，因为他知道我是数学老师，意思是我写的对不对，你看，这就是一个两难问题，如果我指出他的错误，那么我就没有给他试错的空间，他总是挫败，就会对这种第一次感兴趣的事情失去兴趣。可是我不指出他的错误，万一他养成了写数字的坏习惯又怎么办呢？这也是很多家长经常遇到的困扰，孩子他在第一次给我看他写的数字的时候，就写错了，一个六写错了，我并没有指出他的错误。第一天我给了他空间，但是在第二天的时候，他会发现他的书桌前面的墙壁上贴了一个阿拉伯数字，我写的一个正确的写法，那么当他下一次再来问我的时候，我不会告诉他对了还是错了。我叫他。和墙上的这个阿拉伯数字进行比对，如果他真的不断的写错，我会亲自用笔，用正确的这种手腕的力量笔顺去写这样一个数字，给他做一个示范，并且不做任何的评判，这几乎可以说是我就大张旗鼓的告诉了我的孩子，我给你这个空间，我只做示范，不做评价。","这叫做用时间换空间，什么意思？你不要老想着当天就要解决问题，你当天可以给他空间，你可以隔一天两天再去指出他的错误，那么这段时间其实就是孩子试错的空间，我们就用这样的方式保护了孩子的掌控感，也就保护了孩子的自驱力，我们不仅可以给孩子一点空间。也给自己、教育一点空间好。"],"id":"c1-5","course":"如何唤醒孩子的自驱力","n":5,"chars":2040},{"chapter":"压力系统","title":"05 严格","paras":["这节课讲压力系统中的严格，不要怀疑严格是会缓解我们孩子的压力，他可以给我们孩子增加掌控感。","它是怎么实现的？首先我们要区分一个概念，严格不代表我们要打骂孩子，要乱发脾气，其实乱发脾气就是不严格，而且打骂孩子的家长很多是边发脾气边给孩子让步，这就是不严格。","严格主要就是不让步，相当于你要给孩子的精神家园盖一座房子，这个房子要特别的稳固，这个稳固是要靠严格来实现，它具体就落实到价值观、家规、家风和家教上，我们要通过严格管教，让孩子有一个稳定的价值观，有一个笃定的做事风格，有一个非常坚定的对人的风格。这些风格，给孩子的精神世界。盖了一座大房子，这个大房子看似是约束孩子不能出去的，其实我们更知道它也是遮风避雨的，也是抵御野兽的。","我们在房子里面就很少的压力，因为有安全感，没有人愿意睡在野外了，睡在野外看似自由。实则非常大的压力，孩子要有一个稳定的价值观，有一个笃定的对人做事的风格，因为在孩子的成长过程中，他会遇到很多模棱两可的事情，这些模棱两可的事情不是对他而言的，客观来说都很模棱两可，比如说看不看电视，这个没有统一的观念的，这个完全看你们家庭的风格，你定的规矩不能变，这就叫做严格。","在学校被人欺负了，到底是还手还是告诉老师，还是告诉父母，甚至是抱不同严重程度。我们教孩子。孩子怎么不同的应对，这个也是没有统一的标准，那么你们家庭就有你们家庭的风格，有了风格之后就一以贯之，这就叫做严格。","孩子特别喜欢炫耀自己的才能，有些家庭觉得这是哗众取宠，不可取。有些家庭觉得这是自己的孩子特别自信，非常的支持。不管你是觉得不可取还是支持，你都要稳定你的这个家庭教育的风格，你不要一会儿教孩子要藏着掖着，一会儿又叫孩子要宣扬自己的才能，那么孩子就会变成一个左右为难，举棋不定的软弱的人。","而软弱会伤害我们孩子的自驱力，因为他会让孩子没有掌控感。这一类的事情太多了，别说怎么交朋友。交几个朋友，对不同的朋友是一个什么样的态度？面对老师或者是长辈犯了错误，应该是坚持真理，还是先以尊重为主。这都是只有家庭能够决定的，因为这些事情没有一个统一的观念，这完全靠你们家规、家教、家风这些东西来支持。所以我们父母就首先要有一个笃定的，做人做事对人的一个风格和方式。这个方式很稳定，我们给孩子的东西也很稳定。","我们回到刚才我们给孩子精神家园啊建的那座大房子，他必须兼顾，他兼顾了孩子心里面就有数，有数就是有掌控感，有掌控感就保护了孩子的自驱力。那么你说家卫老师你说的每一节课都很落地，为什么到了这一节课，你举出了很多模棱两可的例子，他本来就是模棱两可的。因为这必须有你们家庭来定。夫妻双方以及带孩子的老人达成一个共识，孩子遇到这个问题，虽然他是模棱两可的，是没有一个统一的观念的，但是我们家庭就这样，手机玩不玩，电视看不看，怎么看，朋友怎么交，遇到这种事儿怎么办，遇到那种事儿我们应该教孩子怎么办。他是统一的，然后严格的执行，这种严格会让孩子心灵变得强大，强大的人他就有掌控感。","你说我哪里举得出来太多的例子，我当十多年班主任，我亲眼看到同样优秀的孩子，他面对一件事情都有不同的方法，而且他们都非常笃定自己的那个方法是正确的，这就是个性，这是没有什么问题的，他是家庭风格，这是严格的第一部分。","其实严格还有第二部分，什么意思？就是有一些东西社会是有共识的。比如说核心的价值观，爱国、敬业、诚信、友善，这些核心的价值观你就不能自已定了，这是我们千百年来一直坚守的，我们的一种类似于传统美德的东西。比如说我们举个例子，比如说友善，很多家庭都教孩子对人要友善，可是实际情况却不是这样操作的。","比如说一个对人很友善的孩子，他在幼儿园或者在小学的时候，他的友善导致了他吃一些亏，例如他总是把玩具或者书本借给其他的同学。可是其他的同学不归还，那么我们无论这个时候教他怎么样去处理这些事情，你都不能够说的一句话是，你太善良了，你太友好了，所以你就被欺负。你要知道，他吃亏不是善良的错，不是友善的错，而是因为他现在的对人处事的能力。还匹配不了他的友善，所以我们应该锻炼他的人际交往能力，他的价值观才能稳定，不然他就是乱的。","语文课本、历史课本教的那些东西难道是错的吗？父母教我要有仁有义，可是我有仁有义之后，总是遇到各种各样的困难，那么我干脆就要无仁无义了。像这样的一种教育，你就不要随便的定风格，你要在稳定价值观的同时，教他如何用能力去保护他的那些美德，这也是一种严格。你吃亏了，你不能否定我们给你的那几个基本的价值观，你要想办法强大自己，有勇气去保护自己的这些美德，不靠父母的严格管教，严格的规矩，孩子是办不到的。他会逃避，有些父母就像刚才说啊，你太善良了。所以你吃亏。这种父母教孩子逃避这些美德，那么学习学到后面越来越苦了，我是不是就可以厌学了？","这节课上到这里，你不会还认为严格管教和自驱力没有什么关系，其实他们关系非常的大，你的整个家教都提供了比如说要尊重长辈，要诚实善良这一系列的基本框架之后，这些基本框架需要我们非常严格的去执行，孩子他的那个房子，他精神家园那个房子就会特别的坚固，那么他就会有安全感。他有安全感之后，他做事笃定，做人稳定，那么他就有心思去掌控其他的东西，我们在教育学中遇到很多这样的孩子，他本来自制力还蛮不错的，但是慢慢的就被一些其他的所谓的杂事，搞得生活很混乱，生活一旦混乱，他的整个精力就在生活当中去了。他不会盯着学习，甚至不会盯着自己的理想，他天天都在处理一些模棱两可的事情，而且他举棋不定。这就是因为孩子常常掰扯一些本来就掰扯不清楚的东西，这些掰扯不清楚的东西可以靠家教来完成，很多父母都问过我。就是这件事情怎么处理啊，我说得问你们呢，好多事情。这样处理也行，那样处理也行，唯一不行的就是我不知道怎么处理，你只要选一个都行，你有了笃定的选择，你就不会有压力。","那么我们父母怎么做到严格呢？","第一，我们要有一套自己就很坚定的行为准则。","第二，绝不让步。","第三，统一。","什么叫统一？就是所有。事情的底层逻辑，这个事儿是一以贯之，举个例子，比如说要尊重长辈，不要这个长辈要尊重那个长辈，就可以不尊重，这就叫不统一。即使某一个长辈他可能有点，比如说为老不尊，那么你也要尊重这个长辈，你只是可以选择性的不采纳他的建议而已。既然是我们家的家规，就什么情况都不能动摇，既然是你的核心价值观，那么遇到任何困难。都要保护他们。既然是我们这个家庭的风格，那么遇到任何事情你就这样做，不要想那么多，是不是就没压力了？这一节课的结尾，我用开头的一句话来作为结束。就是记住：严格不等于你要发脾气，严格只是不让步。你完全可以温柔而坚定的进行。"],"id":"c1-6","course":"如何唤醒孩子的自驱力","n":6,"chars":2693},{"chapter":"压力系统","title":"06 情绪","paras":["这一节课要讲压力系统中一个老生常谈的问题就是：父母的情绪。孩子的压力有两个重大来源，一个就是父母的情绪，一个就是沉重的学业负担。","沉重的学业负担我将在下一节课用拆解来化解掉，而父母的情绪，我们这一节课就要把它化解掉。","首先情绪是化解而不是控制。很多父母说我控制我的情绪，我都没有发脾气。其实情绪一旦诞生，对孩子的伤害就已然存在，你强装欢颜给孩子说话没有用的，我们要找到诞生情绪的机制，并且化解掉他们，而且这不是心灵鸡汤。我们很多情绪都是无端端产生的，","这一节课就列举几个无端产生情绪。然后我们靠我们的认知去化解我们的情绪的方法，","第一：叫做不懂孩子的无能。","我们在教育孩子的时候，一定要理解到孩子他真的是很无能的，这种无能带有欺骗性，这就是为什么我们会有误会。比如说孩子要出门，他准备出门会花两分钟，第一天花了两分钟，这是一个比较合理的一个时间，很多父母就认为孩子准备出门的能力就是两分钟，这是我们成年人，因为我们成年人很稳定，今天两分钟，明天也是两分钟，但是第二天孩子起床到出门可能就花了半个小时，两个小时。孩子的无能体现在什么地方？体现在他不稳定。他不可能每天都做到，我们只需要在他做到的时候给他激励。在他做不到的时候给他指点，不用发脾气。第二个欺骗性就是孩子他有些时候能够高质量的完成一件事情，比如说今天晚上他能够高质量的完成做作业，我们就觉得他有这个能力，其实也只有今天晚上而已，第二天晚上他可能有某种情绪，这种情绪未必是我们父母给他的，孩子啊，他是个孩子，这些情绪很有可能是一些你都觉得匪夷所思的事情，就带给了孩子这种低迷的情绪，他就不能够高质量的完成作业了。","总之各位父母一定要理解到一点，孩子他的能力是不稳定的，因为他的心态不稳定。他的智力不稳定，他的情绪也不稳定，我们要接纳这一点，并且引导他，其实就可以了，不用批评他也不用奖励他，只需要做激励、引导、培养即可。","这节课是来缓解大家的压力的，怎么让父母没有压力，怎么让自己没有压力？其实就是要看得懂，孩子今天特别不乖，你马上就看懂了，正常。其实你就没有压力，你就没有情绪，就不会进入那种你有情绪，然后孩子更有情绪的一种恶性循环当中。","第二，比较别人家的孩子。","很多父母的情绪来自于周遭的环境，别人家的孩子又怎么样了，别人家的孩子又怎么样，在小时候就是一种内卷，报补习班的，参加各种竞赛的，家里面在鸡娃的让我们感到特别的焦虑。这个时候我非常坦诚的告诉各位父母，我作为初中老师，小时候父母鸡娃的。什么事都好像干的特别不错的，有50%真的是学霸，有50%不仅不是学霸，最后出现了厌学症状。50%的50%，这个叫做什么？这个叫做没有相关性，小时候鸡娃对于孩子成为学霸相关性不高，其他没有鸡娃的依然有百分之，其实可能有百分之六七十变成了学霸，有百分之二三十其实是中等生，你比较一下你就知道你小时候，你孩子小时候的时候，你焦虑个什么呀？","还有一种比如说你的孩子已经读了初中、高中，那么他们班上有那种真正的学霸，这些学霸给我们很大的压力，而且他还要来介绍经验，我这里很坦诚的告诉各位父母，不要听这些经验。第一，学霸不是有所有的好习惯。很多学霸他介绍的经验是不可取的，我们学校的学霸可以说是成都市几乎最多的，这些学霸一身的毛病，他只有几个特别落实的好习惯支撑，他就真的能够上清华北大。这个时候你就明白，我不是所有的好习惯都要给我的孩子。培养习惯，我在第三个惯性系统里面会说，培养习惯更重要的是落实。不是多。第二个，有些学霸的一些习惯是只能针对于他本人的，比如说改错本、上课做笔记，有些时候对于学渣来说，这些习惯是不要，因为增加了他的学习任务，所以要盯着别人家的孩子，你要相信你的孩子就在一条最正确的轨道上进行。第三点，我们很多时候的焦虑和情绪来自于追责。我们的孩子在他的成长过程中会犯很多错误，会出很多问题，我们很多成年人有一个定势思维。就是这些问题的出现，我孩子犯的这些错误，一定要有人为此买单，要有人为此负责。所以这样的父母就开始怪孩子的老师，怪家里的老人。怪自己的丈夫或者妻子。","最可怕的是怪自己，怪自己的很多自责，我不是一个称职的妈妈，不是一个称职的爸爸，你一旦有了这种想法，你的情绪会经常的爆发，而且你的情绪一爆发，你就越自责，你越自责你就越容易爆发，这个时候可能承担你情绪的，不仅仅是你的孩子。","那么我们为什么不能追责呢？你要认识到一个基本的教育认知，就是孩子他一定会出现状况的，你就是没有任何人干涉他，他依然会出现各种各样的问题，因为他在成长。孩子一旦出现问题，永远不要盯着是谁的责任，永远要盯着我该做什么。哪怕你没有做到让孩子培养好这个好习惯，或者是改掉这个坏习惯，你也不用着急。孩子，他有他的人生，他有他的个性。","我们学校出去的优秀校友，无论是三大法官，牛津大学的学生会主席，还是得罗德奖学金的优秀学者，他们都有很多坏习惯的，都出了一些问题的，很多问题依然没有得到解决，这就是使他成为他自己的东西。不要完美主义，你才会尊重一个人，你尊重孩子，尊重自己，你的情绪就会少很多。在本质上依然是一种接纳，人的弹性是很大的。不要觉得孩子遭受了什么创伤，他就一定就毁了。他就没救了。他依然有可能拥有一个璀璨的人生，就好像你一样。","所以最后我要提到的一点就是有些父母被很多观点恐吓，认为自己的原生家庭有问题，所以我的妈妈骂我，我的爸爸骂我，所以导致我现在是个暴脾气，我改不了了，所以我的孩子可能也被毁了。你再往时间长度大一点的历史中去寻找。我们会发现，其实我们人类是一代一代都在变化的，因为我们懂得重新出发，不要老是去盯着那些伤害过自己或者伤害过自己孩子的东西。你看我们人类，我们人类从出生开始就没有翅膀，但是我们很想飞，我们从来没有花太多的精力去研究怎么长出一对翅膀，而是去研究飞机。我们现在比所有的鸟类都飞得更高。不要怀疑。我们永远有解决问题的方案，这其实就是我们很多父母的认知不够而诞生的情绪。","还有一类情绪是我们处理问题不够坚定而导致的情绪。我们很多时候会遇到那种模棱两可的事情，我们不知道怎么办，左右为难，举棋不定。我们就很焦躁，你看为什么我到这一节课才开始讲父母的情绪，你听了前几节课之后，你就会发现，我们父母的情绪也来自于我们的毒性压力，当我们遇到那种很难解决的问题的时候，我们压力很大，我们就有情绪，这个时候很容易迁怒自己身边的人，多半是自己的孩子。","当孩子做作业的时候错了一个字，这个时候是指出他的错误还是不指出他的错误，我在空间这一节里面就讲到了，他是一个看似很难处理的一个问题，很多父母他事先没有想好我该指出还是该不指出，那么他就会很有情绪，你看孩子只是错了一道题，你的情绪就起来了，如果你有一个方案，这个时候就要指出，那个时候就不指出那。我提出的方案是先不指出，给空间。第二天再复盘来指出。","你看你有了方案，你有了流程，你的压力就小了。这个时候其实你不会觉得自己在靠情绪来解决问题，而是靠一个流程，一个事先就想好的流程。那么就要求我们父母在教育孩子的时候多一些坚定，少一些犹豫不决。这一个板块我会在惯性系统里面多次提到，不要着急。我先埋一个伏笔，就是我们一定要有流程思想、清单思想来代替我们的经验主义，我们的情绪主义。你会发现，你会获得一个东西，叫做自在，也可以叫做从容，你越从容，孩子的压力就越小。那么我们孩子的自驱力就得到了很大程度的保护。"],"id":"c1-7","course":"如何唤醒孩子的自驱力","n":7,"chars":2994},{"chapter":"压力系统","title":"07 拆解","paras":["这一节课我们讲压力系统的最后一个部分就是拆解，家长们听了这一节课会觉得这就是我想要的落地的方法，但其实这一节课我们讲的教育方法必须建立在你的示弱给了孩子敢在你面前争取掌控感，你给了孩子空间，让孩子有试错的勇气，你严格的管教你的孩子，让孩子有了安全感，他精神世界的安全感，你的情绪稳定，让孩子和你的亲子关系非常的融洽，不然这一节课他的落地就是硬着陆。","这也是为什么我一定要做一个课程来说自驱力的原因。那么什么是拆解？我们为什么一定要帮孩子拆解？就是因为孩子的压力除了来自于精神世界、心理层面之外，还来自于一个客观的事务就是学业负担。这是客观的，没有办法避免的。学习作为古今中外所有人都说好东西，可是他就是会产生很多厌学的孩子，国外一样的，到底为什么？学习 底有什么特点？这是因为学习是孩子人生中遇到的第一件，没有办法避免，必须要完成的复杂的事物，而且我们人类对孩子学业的要求其实是有点儿偏高的。这扯到社会学了，我就不再展开。大家只要明白，学习其实是对孩子的高要求。那么当孩子面对一个要求比较高的事物，他首先感到的就是恐惧、混乱。","为什么有些孩子从幼儿园一直到高考毕业，他都一直在超前学习，而且取得了比较好的效果，其原因就在这里，超前学习是用了错误的方法，但是却真的缓解了孩子的压力，但是超前学习就超前的让孩子接受了这个压力，这就要求你们家庭特别的稳固，孩子特别信赖你，否则风险极大。所以教育界其实有一个戏称。就是超前学习，有点像葵花宝典。","而拆解问题是独孤九剑，你学什么？什么叫做拆解问题？特别是学习上，就是当我们孩子面对复杂的、困难的，有点超出他的要求的事物的时候，我们依然尊重它的发展规律，但是呢，把这一个复杂的事物给它拆解成一个又一个的小东西，他每一个小东西他都能够解决，然后我们假以时间的培养，孩子就不断的在进取，最后他的能力会变得极其的强悍，自己就能够去解决问题，这不就是自驱力嘛。","再说形象一点，其实就是当孩子面对一座高山，你给他铺台阶，铺了台阶的高山。还能够叫做拔苗助长吗？就不能够了，因为我的每一个要求都尊重了你的现在的能力。你看以前的人学习是不怎么需要老师的，现在为什么需要老师？老师的一个很大的作用就是帮孩子拆解问题，我们就这样上课的呀，把一个复杂的问题拆成十多步，然后这一个星期练这第一步，第二个星期练第二步，一步一步练扎实了，到了高考、中考的时候，做那种压轴题，孩子一下就把它吞下去了。你看高中还不怎么明显，特别是小学和初中那种，最后的考试中其实很少出现低年级的题，但是我们低年级在干什么？我们在学一些根本就不考的内容，其实这些考在什么地方？就是那种综合的大题中的前几个步骤，这不就是拆解问题吗？","那么我们在家庭教育中如何帮孩子拆解问题？主要就是两个，","第一个是目标的拆解，这是心理层面上的孩子的学业压力。不仅仅来自于具体的事物，有些时候还来自于他的比较和目标，比如说他特别想读某一个初中、高中，或者某一个大学，这就叫做孩子的目标。有目标原则上是一个的好事，但是有些时候真的会对我们的孩子，特别是临近毕业年纪了，会对我们孩子造成巨大的毒性压力，孩子在这种压力下，他学的非常的难受，疲惫不堪，甚至开始烦躁，就是脾气暴躁，很多时候孩子的叛逆根本就不是青春期，就是因为过于烦躁。所以我们要把这种远大的目标帮孩子拆解。我举一个例子，比如说，孩子想考清华大学，那么按照往年的习惯，他就应该在你们那个城市的前多少多少名。这是第一次拆解，第二次拆解，在哪一个班容易考到你们城市的前多少多少名，所以我要考进这个班，比如说在这个班上的前十名或者第一名就可以考上清华大学。这就是我的目标，我的目标就下降了一个时间段，那么现在我就要考上这个班，先考上这个班再说，考上这个班到底要在这个班的第一名、第二名怎么努力，这是后面的事情，好多年以后的事情。所以我现在的目标变成了我要考上这个班，这是第二次拆解。","要考上这个班，我得考上这个学校，那么要中考考上这个学，我应该考到多少多少名，就是我中考的时候要多少多少分，那么就看你的孩子到底是幼儿园，初中，小学，高中，我这个课程呢，因为是面对所有学龄段的，所以我一直给你拆解到啊，至少小学吧。那么我中考要考这么多分，我应该考上哪一个班？这个班在哪一个初中？继续拆解，我应该考上这个初中，那么假设我们的孩子是某个小学的啊，一名学生，我要考上这个初中，那么我应该在这个小学的前多少多少名，这是高年级的时候，那么要考上这个年级的多少多少名，因为小学的分数他有点不切实际，也就是说小学的考试有点测不出我们的能力，那么我们就可以考虑在这个小学要考到这前几名需要哪些习惯，你看就从时间变成了事情，它就变成了一种转化的感觉，就是我本来是在时间这个层面上拆分，最后拆成了我需要培养哪几个习惯，那么哪几个习惯我是已经拥有的，哪几个习惯我是没有的，那么我可能就需要关注我这几个马上要培养的习惯，这个时候孩子他虽然志向高远，他想的是清华大学，但是马上就变成了眼前可以着手解决的事情，我马上就能办，这条路就通清华，这一定要一路拆解下来，因为这一个过程很重要，不是这几个习惯很重要，你拆解的这一个过程，让孩子能够看得到自己现在的情况和他的目标，清华大学，当然我举的是一个清华大学，你们可以把目标定近一点，这条路线他清清楚楚，明明白白，这叫做看得见。一个人看不见的时候，压力巨大，就好像我们很讨厌黑暗，为什么讨厌黑暗呢？因为我们看不见，我们不知道有什么东西会来伤害我们，虽然我们知道一般没有什么东西能伤害我们，但是就是心里面感觉压力很大，很紧张。这种目标的拆解就是让孩子看得见。","刚才那种目标叫做理想的拆解，我们平时不要搞得那么的高大上，我们可以拆解一个比较短期的目标，比如说期末考试，我要数学要考到140分，那么你把考试大纲拿出来。我哪些题必须对，然后一个一个的过关检测，我哪些题已经没问题了，哪些题还需要努力，现在还有多少天，所以怎么怎么办，把很远的一个扼住我们喉咙的东西变成眼前的一个我能够扼住他喉咙的东西，这是不是掌控感的直接转变，万事万物只要你有目标，有欲望，他都是可以拆解的，我想我已经把这个事情说清楚。","现在我们来说第二种拆解，这种拆解很多时候都是老师应该做的，但是我知道有些孩子，特别是成绩已经出现问题的孩子，他可能老师做了他也没听，那么家长想陪伴孩子学习的，你可以用这种方法，事情的拆解，比如说我，我是数学老师，所以我依然举一道数学的压轴题，比如说一道数学中考的压轴题，它有20个步骤，那种很小很小的步骤有20个假设哈，假设20个步骤，孩子为什么会有畏难情绪啊，畏难情绪其实也是一种压力，他不知道自己哪个步骤会出问题，好像自己什么地方都有问题，千疮百孔的，他就不敢做这道题，但其实这道题他可能只有两到五个，这种基本的步骤可能没有掌握好，然后又有那么一两个计算步骤没有那么的稳，容易错，导致他怀疑自己。那么这20个步骤我们就要把它列举出来，你的拆解就完成了。","列举出来之后干什么呢？刻意训练。第一个步骤，做十道题，检测过没过关？没过关，再做十道题，总之把第一个步骤给他练熟了，其实我们整个小学六年，初中三年，高中三年，老师就在做这种事。上新课的时候，其实你看着那些题没有考，其实就是那些题的可能的第一个步骤，然后第二个步骤，第三个步骤，有些步骤孩子过关过得很快，因为他本来就会。当他过到五六个步骤的时候，孩子他会形成一种主人翁精神。原来这道题我能够走这么远，也许我是不是能够真的解决他呢？其实后面往往好多步骤都不用再去训练孩子，他自己内驱力就起来了，他自己就想自学去解决他了，这就是拆解问题，作用于我们孩子的心理，让孩子有自驱力，从而他的压力小了嘛，就有自驱力，从而他就去自学，就去努力的克服困难，你不要天天叫孩子克服困难，你一定要克服困难，学习本来就是辛苦的，这其实给他更大的压力，你帮他拆解好了，放在他面前，告诉他你今天那19个问题你都不用管了，你只管这一个问题，他一看，哎，这个台阶特别的低。我他一步就上去了，他上去了，第二个步骤他又一踢又上去了，当他上了几批之后。他一看自己变高了，那种原始的埋藏在他心里面的掌控感就会熟悉。","拆解问题不只能够用在学习上，还有生活中的方方面面，比如说做一道菜，整理房间，出门旅行，把拆解问题这种流程化思想，植入在孩子的思维层面，他首先理科就会特别的好，不知道各位家长发现了吗？你在这种处理事情的态度上，在教孩子一个什么东西，在教孩子逻辑，我们说理科主要靠逻辑，文科主要靠习惯，当然都靠价值观啊，我不能说的这么片面，但是他逻辑好了，确实。他的数学物理这种学科就不会差，你别想着做一件事情有多么的复杂。你只想，这道题或者这件事情的第一步我能做，我先做了，我再做第二步，专心做第二步专注力也得到提升，所以拆解问题是一个特别特别落地的方法。","但是家长们不要忘记我这一节课最开始讲的那个，你要教孩子拆解，前提是你能够教，你能够教，就示弱，让孩子在你面前敢拥有掌控感，你给了孩子空间，孩子敢犯错误，你给了孩子严格的管教，让孩子有安全感，敢行动，你有一个稳定的情绪，孩子敢交流。不然，怎么拆解都拆解不下去，因为第一步的前面就已经，我们说的就闹掰了。所以你就在那里自娱自乐，你怎么跟孩子说，孩子不听也没有用，所以这个压力系统这里就形成了一个闭环，这一部分做好，其实孩子基本上已经算比较有自驱力的孩子了，可是我们还没有完，我们还有动力系统和惯性系统，当然如果孩子出了问题，我们还有唤醒系统，为什么要有后面那几个系统，这中间扯的，我们人性还有一些弱点，比如说我们总是懒惰，我们总是不自律，所以我们还需要更多的焦虑，好压力系统就上到这儿。"],"id":"c1-8","course":"如何唤醒孩子的自驱力","n":8,"chars":3929},{"chapter":"动力系统","title":"01 动力系统概述","paras":["在家长们学习动力系统这个课程之前，我希望大家好好复习一下压力系统的课程，为什么？因为动力系统的一个重要前置条件就是要保证孩子压力系统的健康，这也是为什么我把动力系统放在第二个板块来说，压力系统的健康是这一切的基础，不管是这一个板块的动力系统，还是接下来的惯性系统和唤醒系统，都要在压力系统健康的条件下进行。","你看有多少父母为了培养孩子的兴趣，硬生生的拽着孩子参与某一个学科或者一个兴趣班的学习，搞得孩子很崩溃，压力系统崩坏，最后适得其反。有多少父母给孩子设立。远大的目标，可是不帮孩子拆解问题，最后孩子在一座大山的前面驻足不前。有多少父母为了培养孩子的一个好习惯去控制孩子，而且产生了很多不良的情绪，搞得孩子厌学，这都是因为他们没有把我们的动力系统和惯性系统的前置条件压力系统放在首位。","所以这一节课动力系统的概述，我要讲的第一个重点就是请在第一个板块，它能够运作良好的情况下进行我们接下来的教育操作。","那么什么是动力系统？我们解除了孩子的压力，当然主要是解除的那种长期的毒性压力。孩子他就能够回到他的本性。去前进，去追求，去奔跑。但是有一个问题，这个问题在于，我们首先的前提条件是认为孩子他本来就拥有这样的自驱力，拥有这样向着光奔跑的能力和欲望，这确实是对的。可是我们人性依然有弱点，比如说懒惰、拖延、上瘾这些东西他也在孩子的天性中存在，他会搞得我们的孩子很痛苦。因为他一方面他的理性世界告诉他，我要追求这一个我想得到的目标，但是他人性有很多弱点，又在影响他前进的步伐。那么仅仅依靠压力系统，就只是一种放任自流而已。放任自流，一个好的放任自流仅仅做到了教育中的陪伴，可是我们教育还有传承，还有创新，这些东西就要靠接下来的动力系统和惯性系统，让孩子能够克服自己人性中的弱点。因为它除了有自己的内驱力之外，它还有一个发动机，这个发动机会让孩子自驱力更强，从平庸走向优秀。","其实我再换一个角度来解释，你就会发现压力系统做好了，孩子会变成一个相对幸福的人。可是要走向卓越和优秀，我们的教育干涉，必不可少。培养孩子的兴趣、培养孩子的习惯、培养孩子的品质、提高孩子的效率。这是教育应该做的事情，所以这一个板块依然是非常重要的，孩子从出生开始，他就是一个健康的人，我们保证他压力系统的健康，就是让孩子不会羸弱，而动力系统相当于给了孩子一匹白马，让他可以冲锋陷阵；而惯性系统给了孩子武器，全副武装就有自驱力，因为孩子能够感到自己的强大，他就能上阵杀敌。这是动力系统概述这一节课的第二点，我们去学习它的意义所在。","第三点，我们以一个什么样的心态来学习动力系统这个板块。各位父母可以把自己想象成一个公司的老板，要去激励你的员工，虽然孩子不是我们的员工，但是其实在这一个板块，在这一个板块，我们的教育学的很多理念和管理学的很多念是非常相似。唯一的不同就是，在管理学里面，它不需要解决压力系统的问题，所以你带着这节课说的第一点，要保证压力系统的健康，再用管理学的这样一个角度来看待我们教育孩子，推动孩子的动力系统，给他一个发动机，你的状态就会特别的对，你就很容易悟到其中心法。"],"id":"c1-9","course":"如何唤醒孩子的自驱力","n":9,"chars":1272},{"chapter":"动力系统","title":"02 激励","paras":["关于动力系统的第一节课，我要讲的是激励。","为什么激励如此重要？激励其实是代替反馈的。我给大家解释一下，你看孩子如果特别特别的小，一两岁、两三岁，他干的所有的事情的自然反馈都是非常及时的，他想抬头，抬起了头，反馈就出现了。他想写字，一下笔，当白纸上出现了这种墨水的划痕。他的反馈就出现了。所以孩子很容易得到成就感，他玩那种玩具每一步都有反馈，有些父母甚至有些专家都在说，孩子特别贪玩，为什么贪玩？那个玩和学习到底有啥区别？其实没有什么区别，最大的区别是量上的区别，玩的反馈特别的及时，你玩那种藏猫猫，你躲在门后，另一个玩家寻找你的每一个动作都是反馈，打游戏你的所有的操作和屏幕里面的游戏人物的动作保持一致，这种反射就是及时的反馈。这种及时的反馈会让孩子处于一种高多巴胺的状态，而且他能够得到短时间的成就感、价值感、掌控感，所以他就会感兴趣。","那么当孩子特别小的时候，能够得到及时反馈的时候，我们怎么激励他？我们还是要激励他，我们只需要表达我们看见了，这叫做关注。所以你看孩子如果特别小的话，他主要求的是关注他，不需要你去夸奖他。你的关注，你的看见就是一种夸奖，他成功的拼了一个积木玩具，在告诉你之前，你就告诉他我看见了，你拼了一个房子，这就已经是夸奖，这就已经是激励了。后来孩子渐渐长大了，到了幼儿园、小学的低年级，你会发现他做的事情反馈越来越什么慢，比较典型的就是下棋，比如说下围棋，在最后战胜对方或者被对方战胜之前，他下的每一个棋子，都不是一个正向的反馈。我们倒觉得没什么，但是对于孩子那种适应了瞬间反馈的那种状态之后，他内心就会变得很烦躁，他也不知道这一步棋有没有下对啊，因为没有反馈啊。我们可以激励他，让他保持，最小的时候那种充满热情的动力状态，这个时候的激励只需要你表达你的肯定，你这步棋走的正好，走对了，你不需要去夸奖他，你的棋艺多么多么的高超，你不需要。","孩子又长大了，到了小学的高年级，就谈到了我们这个课程的一个重点就是学习的自驱力，那么这个时候他的学习要看到反馈就有点太长了，一学期就一个考试，当然有些学校稍微多一点，但是至少也是一个月吧，两个月吧，他天天在阳台上背书，背了好多天，但是没有反馈，别说孩子，成年人的毅力有些时候都坚持不下来，那怎么办？我们应该夸奖他来代替那个自然反馈的缓慢学习，他不能给你反馈，要半年才能给你反馈，那么没办法，我父母来给你反馈，所以父母其实是有作用的，不要完全的那种放任自流，为什么我要按顺序说啊，就是这个时候你的夸奖应该建立在我看见、我肯定、我开心。我看见就是第一种激励，小时候的那种激励就是。我看见你最近很努力，第二，我肯定你这种努力一定可以成功，你在你的节奏上，你在正确的轨道上，你不要想那么多，这就是康庄大道，这叫做肯定。然后夸奖是什么呢？夸奖很多时候是表达我们的开心，我看见你这个样子，爸爸妈妈都很感动，觉得你一定有出息。","你看所谓的夸奖的标准模板，其实是就是这样一个时间流程，这个时候你还可以提出一些意见，希望你能够把老师上课和作业中的一些问题拿来所用。为你的学业服务，我相信你一定可以攀登高峰。其实最后那一句话就叫做鼓励，鼓励不是说：你最棒的，我相信你不是这样的。提出一个建设性意见，什么叫做建设性意见？是建设的，不是否定的，我觉得你还应该改进，你看你的语文怎么怎么怎么样，不是这种，而是爸爸希望你做什么什么事，你一定可以成功，这叫做建设性的意见。他是一种展望，是一种鼓励，这种激励常常是孩子已经到了中学，初中、高中，这种激励作用就比较明显，因为孩子他听得懂了。","所以这节课说的什么是激励，千万不要用奖惩措施去激励孩子，那种规章制度是没有什么作用的，不要忘了我概述里面说的，我们的动力系统一定要保证孩子的压力系统的健康，你去搞一个规章制度，奖励惩罚就是控制，你一旦控制，他的掌控感就失去了，他的掌控感一旦失去，你动力再强也没用啊，他会跟你反着来，为什么呢？因为他没有掌控感，它就一定要掌控个什么东西，对抗会让人感觉到自己有掌控感，这是很多孩子对抗的原因，所以我们不能够去搞这种什么奖励、惩罚。而是激励，而激励又分为看见、肯定、夸奖、鼓励，它的作用就是代替孩子做一件事情，他努力的去做了一件事情，他压力系统是健康的，他就会努力的去做一件事情，那么他做了这件事情反馈来的比较慢，中间有一个空期，我们的激励是让孩子在这个空档期中间有发动机，有动力源泉，这个动力源泉来自于，我们父母，对孩子来说很重要，所以我们的看见，我们的肯定，我们的夸奖，我们的鼓励对他是有正向作用的。那么最后特别是孩子已经到了小学高年级、初中、高中的时候，我们要去激励我们的孩子。首先：表达我看见你这样这样，我问了老师，你做的非常的对，你不要怕没有效果，你在正确的节奏和轨道上，我们感到非常的开心，我希望你做到这这，那么你一定可以获得你想要的东西，我说的有点抽象，你想要的东西，攀登高峰是他想要的东西，年级第一名是他想要的东西，你就往里面填词就好了，用你的风格把这种感觉给孩子勾勒出来，他就能够感到。"],"id":"c1-10","course":"如何唤醒孩子的自驱力","n":10,"chars":2058},{"chapter":"动力系统","title":"03 信任","paras":["这节课的关键词是：信任。那么信任到底属于压力系统还是动力系统，它提供的是安全感还是力量？其实我们可以想一下，如果有一个人特别信任我们，我们感觉到的是一种解脱还是一种力量，我认为感到力量比较多，所以我把它归为了动力性。","废话我就不多说，因为我们其实每一个父母都知道，我们一定要信任我们的孩子，所以这节课我的重点是：第一如何做到真诚的信任；第二就是其实很多时候我们自己都没有发现，我们对孩子说出了不信任的话，我把这些东西给大家分解一下。","首先我们这一个课程是自驱力课程，所以我们的前提是孩子他是会自然成长，比如孩子特别小的时候，他第一次想自己走路，我们那个时候就不信任他，但是可以理解。因为有一个安全问题，幸好我们已经发展出了很多方法让孩子安全的，但是是自主的去学会走路，所以这一关就过得比较顺利。可是情况越来越复杂，因为孩子长大后，孩子上了幼儿园，他才三岁，但是他要拼五岁的乐高，很多父母就开始打击自己的孩子，我哪怕是现在说出这句话，很多父母心里面都在说，那不可不嘛，眼高手低的。","眼高手低是少年义气，眼高是没有错的，手低才是问题。支持孩子的雄心壮志就是一种信任，但是我们落到地上来，又要培养他踏踏实实干事情的能力，支持孩子的眼高就是一种信任，是一种动力。而想办法解决孩子的手低是下一个板块惯性系统要做的事情。孩子三岁要买五岁的乐高，不管你给他买不买，你后面找多少多少的理由，但是当你支持了，而且信任了，他能够办得到，动力就已经产生。孩子越来越大了，到了小学、初中、高中开始有学业，孩子特别喜欢立那种雄心壮志，我们可能没有在言语上打击他，但是我就看到很多父母，要翻白眼。","我曾经看到一个初二的学生，就是我的学生，他在办公室，他妈妈也在给我讲他一定要考上一等奖学金的时候，他妈妈露出了笑容，说我儿子最棒了。然后他儿子大发雷霆，因为他在叛逆期嘛，他说我最讨厌你这个表情，虽然儿子不尊重他的妈妈，当然我也当然要给儿子做心理疏导，这是后话，但是说实话，当时我看见他。妈妈的那个笑容掩饰不住的瞧不起，多么生硬的一句，孩子，你真棒。但是是在同一个班有另外一个孩子，也是那段时间，初二的时候，一个男生在我的办公室，也是给我立雄心壮志的时候，他的妈妈在旁边，他说李老师，我一定要考一等奖学金。他妈妈的反应是起码顿了五秒，沉思了一下，说了一句，有可能。李老师，能不能帮帮我的孩子，他想考一等奖学金，我想了一下，我觉得完全有可能。然后我们交流了一会儿，最后在出办公室的时候，我就听到这个妈妈很小声的，并不是很刻意的给孩子说了一句，从小到大你只要想你都办到，我们回去再研究一下李老师的方案。但后来几句话有点听不清楚，这个孩子最后不仅考了一等奖学金，还考了年级第一名。当然不是因为这一件事。事情导致的他成绩的突飞猛进，他是很多因素构成的，但是我们可以看出什么是信任，什么是夸奖。","发自内心的还是刻意的，就是有很大的差别，有些时候发自内心的信任都不是以夸奖的形式呈现出来的。我上一届有个学生，他有一次年级排名，他本来是800多名，然后他涨到了600多名，回到家，家长一顿夸奖。我为什么知道？因为后面他们亲子关系出现了很大的问题，父母给我打电话说这个孩子太叛逆了，家伟老师，你可不以帮我疏导一下？我跟这个，她是个女生谈了两个多小时，最终发现根源居然是在父母夸奖了她，你说青春期的孩子有多敏感？我马上就明白怎么回事，但是我还是问了他，我说为什么父母夸奖你，你会感觉到这么大的情绪，他的表达很清楚，他说李老师，你认为我是600多名的人吗？我说你现在是，我知道你很难过，他说我父母就很开心，我没说他是对的哈，我后来给他做了很多的工作，就是父母的开心是因为你的进步，不是因为你现在的名次。","这个孩子小啊，他想很多问题特别的钻牛角尖，为什么会造成这样一种很奇怪的，其实很多人都不理解孩子的这种心态。就是因为理解、尊重和信任他是绑在一起的，你都不了解你的孩子的骄傲，你就去夸奖他，有些时候是一种否定。我为什么这么理解这个孩子，因为我读初中的时候，我的脚断了，一学期没去上课，当时我在我们班上的期末考试就是真的裸考，就考了班上的21名，我父母一，我一回家我父母就表扬我，现在回想起来，当时我的情绪特别的奇怪，我对我父母有攻击的想法，所以孩子的情绪你是很难捕捉的，你真诚的去信任他，看得起他，有些时候是会骂他的，你不要以为你骂他就给了他压力，如果你摸清楚了孩子的性格。有些时候批评就是一种信任。","父母总是不信任自己的孩子，有两个原因，第一个就是其实并没有关注到孩子，他慢慢的长大，他的想法我们没有捕捉到，第二个原因就是我们想的太多了，有些时候我们觉得信任的孩子，比如说信任的孩子的雄心壮志，就怕他骄傲了，怕他不踏实了，其实沟通的一个氛围。一直都在情感交流层面，你不要怕你的沟通能够产生什么落地的后果，也能产生的都是心理层面上的后果。真正在操作的时候，在接下来的学习生活中，你怎么操作才是重点。","对，没错，很多时候就是说一套做一套，不是教你虚伪，就是我信任你最终能够攀登高峰，所以我们才要去解决你的一堆毛病，而不是我不相信你能攀高峰，为什么呢？因为你有一堆毛病，你看这两种说法。对一个人的影响差别是如此的大，就完全就一个东西起了作用，就是信任，这是好大一股力量。最后我再提醒一句，他只有在真诚的时候才叫做力量。"],"id":"c1-11","course":"如何唤醒孩子的自驱力","n":11,"chars":2173},{"chapter":"动力系统","title":"04 兴趣","paras":["这一节课我们讲兴趣。其实在我这一个课程体系上，兴趣是不存在的，大家可以想一下，一个在学习上有自趣力的孩子，他就是有学习兴趣，但是因为兴趣这个词实在是太热门了，很多家长在跟我交流的时候，总是说他对语文没兴趣，他对数学没兴趣，诸如此类。所以这一节课其实是通过对兴趣的解释，告诉大家我们这个课程到底在干什么，我解释完了，你会发现我把我这个课程定名为提高孩子的学习兴趣也是可以的。","兴趣这个词其实是很宽泛的一个词，它就和爱这个词很相似，古今中外有谁能够准确定义爱情啊？它到底是荷尔蒙、多巴胺、内啡肽？是心灵的伴侣，还是生活的伴侣，亦或者是？利益共同体，甚至有人说我们的爱情是承担种族延续的一个外壳，它是怦然心动吗？还是长相厮守，是绽放烟花一样的这种热烈，还是老来伴，这种平平淡淡，好像说的都对，而且刚才我那一段话说的都是爱情，还有亲情、友情，再宽泛一点，还有民族大义，还有对真理的探索，那就没完没了。","兴趣和爱很相似，兴趣也是多种多样的，小孩子的兴趣很多时候来自于父母、老师或者是周围的人对他的第一次赞美和夸奖，所以激励会产生兴趣。你们知道吗？我的人生中有一个乌龙，在我学前班的时候，就是幼儿园和小学中间，我们以前有一个学前班，在学前班的时候我是十分的调皮。可是有一次老师表扬了，在家长会上表扬了我写的字很好看，我直到现在我都喜欢写字，后来我父母才告诉我，老师表扬错了人，我那个字写的真的丑的没有办法看，可能是班上倒数几名的，但是老师居然表扬了我，我突然就对写字产生了浓厚的兴趣，你说这是不是兴趣？这也是兴趣，天然的性格也能够产生兴趣。你看有些孩子特别喜欢那种优美的东西，从小就喜欢把自己的东西收的整整齐齐，这好多还不是家长培养的习惯，他就是天然如此，有可能和遗传有关，有可能和你们的家庭氛围有关，那么这一类的孩子，他往往会对文艺类的事物感兴趣。有些孩子他就喜欢跟你抬杠，这种孩子对思考类的东西往往就比较感兴趣，他就可能喜欢打游戏，喜欢下棋，喜欢运动，对小孩子来说，运动是身体的思考，他可能那种生活习惯就不是很好，当然也有那种兴趣点特别多的，就是他天然的性格，就是对很多事情都感兴趣，这种孩子往往专注力又不太好。","其实我们每一件事情，他背后都有缺陷，也都有我们可以发现的闪光点，其实这里就有一个教育实操的东西，我们真的要发现孩子的闪光点，不要老盯着他的那些缺陷，每个孩子都有闪光点和缺陷，而且我告诉各位一个真相，很多时候一个孩子的闪光点正是他缺陷的原因。一个孩子的缺陷正是他闪光点的原因，辩证的。那个闪光点就是我们说的兴趣。而且兴趣还可以迁移，比如说一个孩子特别的好吃，他可能就会对做饭有兴趣；一个孩子胜负欲很强，他可能就会对那种竞技类的，比如说下棋感兴趣。有些孩子喜欢安静，他可能就喜欢读书，听音乐，有些孩子天生就喜欢闹腾，他可能就喜欢运动，喜欢演讲，这一类的兴趣错综复杂，就算是研究心理学，脑科学的人，他也没有办法把它统计出来。","但是我们不用去研究这些东西到底是怎么诞生的，我们只需要知道，我们需要去发现，发现孩子的兴趣点十分重要。比如说孩子他对打乒乓球有兴趣，只要我们力所能及，我们可以动用我们所有的资源，让孩子这个兴趣变成他的特长，甚至变成他的专业。孩子他能够在一个领域里面取得巨大的成功，你千万不要怀疑，他的学习绝对不会差，因为他能够找到那种高质量去完成一件事情的感觉，并且他明白什么叫做克服困难。因为克服困难不是去克服那个困难，而是盯着我感兴趣的东西，困难来了，随手把它克服了，虽然很艰苦，但是我感兴趣，我战无不胜，是那种感觉。","有那种感觉的孩子，他的人生会差吗？这一节课要说的真的太多了，崇拜和榜样也能产生兴趣。如果小时候孩子看了某一本书，他看到爱因斯坦如此的聪明，他就想搞科研了，他看见某个明星非常的耀眼，他可能就想搞文艺了，他觉得他爸爸是个医生，非常受人尊敬，他可能就想搞医学了，但这提到有点理想的味道，但是理想不也是兴趣的一种升华版吗？其实还有一个东西会产生兴趣，这个东西对我们的学习非常有帮助，我会在惯性系统中详细的解释，就是沉默成本。什么是沉默成本？比如说一个男孩子要去追求一个女孩子，他追的时间越多，他花的钱越多，他花的心思越多，他就会越觉得自己更爱这个女孩子。为什么我们有些时候在交朋友的时候，或者在恋爱中要端着啊，就是这个道理，让对方付出，对方就会爱你。这一个机制就是沉默成本，因为他付出的足够多，他已经失去了，所以他的大脑会告诉他。我喜欢这个东西，这个机制。叫做沉迷。","你说沉迷是不是一种兴趣，沉迷就是一种兴趣，你陷进去了就和打游戏是一样的，你看那种游戏是怎么让人上瘾的呀，他最开始他不会叫你背那几百个英雄的技能，你们可以想象一下，假如一个刚玩游戏的人，父母在旁边说你先别玩，你先背住这100多个英雄，几百个英雄的技能，孩子最开始还是想打游戏的，他就在那背，越背越辛苦，一点都不好玩，为什么门槛高就不好玩？游戏公司是怎么操作的？他先让你玩一个英雄，都不用你自己选，他帮你选好了，然后这个英雄因为级别比较低，只有第一个技能，这个游戏系统什么也不告诉你，就先让你玩着，你觉得门槛很低呀，所以你就玩了一把，玩着玩着就有第二个技能了，对面又出现一个奇奇怪怪的英雄，你就想玩他。然后他也不阻止你，你下一把就去选他这个英雄都没玩踏实，你就玩了一堆英雄，但是没过几天，这100多个英雄，甚至是几百个英雄，所有的技能，技能的CD，战术、配合你全部都搞清楚了，而且还踏踏实实。","为什么会出现这种情况，就是因为你最开始觉得很简单，你就玩，慢慢慢慢的你就会发现你需要记很多东西，你就先记着，记着记着，几个小时过去了，几天过去了，你付出很多，你就陷进去了。当你发现这个游戏好苦好累好复杂，回不了头了，当事人是不知道自己回不了头的，因为当事人的大脑里面在告诉他我爱这款游戏。","大脑是一个非常自欺欺人的器官，当我们遇到危险，我们就大脑就告知我们要保护自己，这个时候情绪占主导。你看，不管是被教育的多么有家教的孩子，你一旦把他逼到绝路，他第一反应是对你进行进攻，就算你是他的爸爸妈妈。同样的道理，当我们为一件事情付出了太多，我们大脑就会告诉我们我爱它。这一个机制我在下面的惯性系统就会用到，我们会活用这个沉默成本来培养孩子的习惯。","还有其他东西能导致孩子的兴趣吗？还有不定期奖赏，他在学习或者在经历一件事情的时候，如果这件事情不定期给他反馈，给他奖赏，他就会出现一种状态，通俗来说就是心痒痒的，我要一直坚持的干这件事情，因为这件事情会给我奖赏。但是我不知道这个奖赏什么时候来，所以我要一直干，他好不容易干疲惫了，他又奖赏我一下，他连续奖赏了我很多次，我都觉得有点无聊了，那个奖赏我已经有点不喜欢了，他突然又停止奖赏。赌博就是这样的一种打引号的兴趣，所以很多游戏，比如说麻将、纸牌这一类的，它会设置一些偶然因素，就是容易让你产生兴趣，偶然都会产生兴趣，你说兴趣的品类那真的是超级的广，其实都还有很多。","这节课主要是介绍一下兴趣，还有就是告诉各位父母不要被兴趣这个词搞得来，好像是我们教育培养孩子的出发点，你看到没有，兴趣是一系列心理活动的落脚点，这一系列的心理活动，其实我在整个。课程中都用到了这节课，大家就当做既复习又预习。"],"id":"c1-12","course":"如何唤醒孩子的自驱力","n":12,"chars":2949},{"chapter":"动力系统","title":"05 效率","paras":["不要小看了我们人类对于效率的追求而产生的那种满满的动力，其背后的机制是我们的惰性。其原理很简单，同等的东西，效率提高了，我的时间就花费的少，那么我多余的时间就是我休息的时间。","我们这个物种是非常执着于提高效率的，从最开始打磨石器，为了鼓励，一直到今天的工业生产、社会分工，各个学科的蓬勃发展，服务业的繁荣，无一例外就是为了提高效率。但是这里有一个前提，你想获得某个东西，要追求真理，要获得舒适幸福的生活，要成为人中豪杰。总之，你最开始有一个目标，接下来的事情就很简单，提高效率，这依然是我们孩子心中原始的动力，学习就是干这件事情的。为什么我们父母最重视的就是孩子的学习，可能我们自己都不爱学习，但是我们去让我们的孩子一定要好好学习，为什么？就是因为我们看明白了，学习是最能够提高生命效率的东西，他性价比太高了，都希望自己的孩子捡这个大便宜。","所以你也可以把这节课理解为我们有一个原始的动力，就是爱贪便宜，只是这个便宜的有点儿大，有点儿有野心，如此而已。那么怎么把这种原始的动力，我们可以说成是贪便宜，可以说成是懒惰，可以说成是效率，用在我们去激励给孩子一个学习动力这个方面上。靠学习规划！我当了十多年班主任，教了四个班，每一个班所有的科任老师都说你们班上学风很好，而且一般第二个星期就给我说了，就是我在班上宣讲了这样一种学业规划，这个东西只要你的孩子上了小学四年级就完全听得懂了，它来自于一个公式：速度乘以时间等于路程。","首先先让孩子设立一个目标，这个目标可以多种多样，但是要具体的某一个确定的可评价的指标上。往小一点说，考多少分，超过某位同学在学校排名多少。如果你的孩子在小学，可能他的目标是考上某个初中，当然也有可能是比较宏伟的目标，要考上某个大学，也有可能是一个人生目标。总之要确定到一个具体的目标上，最好临近自己的年龄段，这个确立目标的过程就是，确定路程的过程。","我任意举一个模型，比如说你的孩子初中二年级，他想考上市内的某一所重点高中，那么这个路程是多少？就是孩子现在的学业水平和要考上那个重点高中的学业水平之间能力的差距，知识的差距，思维的差距，落在地上就是分数的差距，如果分数不太说明问题，那么就是年级名次的差距。可以参考去年这所初中考上这所高中的一个大致的排名情况。那么我需要考上年级多少可以保证我能够考上这所高中，这个差距就是路程，路程确定了，现在又来确定时间，时间是多少？时间已经确定了，你初二，比如说刚刚初二上学期，那么就两年，然后就问孩子。这两年是不是你的人生，你想怎么过你的青春？孩子一般如果你们交流的比较生硬的话，他就说要好好学习，你稍微引导一下，谁的青春不想过得逍遥自在，但是目标在那里，你能过得逍遥自在吗？孩子说不能，其实你说是可以有一个东西可以让你又能够完成目标，又能够把你的学生生活过好，你说这是不是动力？孩子稍微聪慧一点，一般到了初中就完全明白你在说什么，小学的时候你多引导引导。就是路程等于时间乘以速度，路程确定，时间确定，那么提高效率，提高了效率，那么你就可以学的好，玩的好。","那么怎么提高效率，就开始做计划，做规划了。把学习中所有的事情全部揉碎，精打细算。上课能不能够提高效率？预习、复习能提高效率吗？改错能提高效率吗？你会发现所有的好习惯都是用来提高效率的，但是你要打住孩子，不是所有的习惯你都要拥有。父母和孩子要做一个长时间的交流，量身定做一个为他的学习效率而准备的一套学习方法和学习习惯。你会发现孩子眼里有光，他特别想去培养这些习惯，去坚持这些学习方法，那个光就是动力，我不知道有没有父母被我带进这个沟里来，你发现没有，就是叫孩子要努力学习，但是你换了一个说法，而你换了这个说法，反而才是学习的真相，你天天趾高气昂的在那里说，要好好学习，不然没有高中读，不然你考不上你。考的高中你没有说到点子上，你没有踩在人的人性上，人的人性是想偷懒的，是想提高效率的，他想动脑筋让自己生活舒适一点，他不想没日没夜的努力，他的努力是包藏祸心的，你踩在这种人性上去跟孩子做一个全面的交流，你会发现你的孩子好听的进去。","这一节课和我们压力系统的拆解，那节课的对目标的拆解，有一点互相照应的感觉，但是又有不同，虽然我们这节课也拆解了目标，但是走向的是规劝他努力学习，但是不要出现努力学习这个字，就是提高效率。老师的作业用来干什么的，提高效率的。这里面会发生很多孩子的疑问。我觉得今天的，作业并不能够提高我学习的效率，你可以跟他分析，如果你不做作业，他可能会造成社交成本，你永远都要精打细算，你的时间很宝贵，你只要节约了你的时间，你就可以自由掌控，自由掌控你可以玩，但是有一个问题，你也可以学习啊，你可能当你成绩提高了，这个什么市内的一个重点高中就满足不了你的胃口了，所以我们一切的出发点都是希望自己能够自由掌控的时间越来越多。","我们成年人也是一样的，下班之前的一个小时，我们的做事情最有条理。这非常的奇怪，我们很多时候又拖延啊，沉迷手机，无所事事，又懒惰，天天宅在家里，可是每当我们有一个目标，我们的头脑一下就变得特别的清晰，瞬间变成了时间管理大师，孩子他没反应过来，学习，他一定会有目标的，有了目标，那么我们通过我们跟他的沟通，把他转移到我要提高我的学习效率，学习效率又转移到优秀的学习习惯和学习方法上，然后我们又顺便的让孩子去认真的听课，认真的做作业。","我经常跟自己班上讲的一句话就是现在是上课，大家想一下做什么事情效率最高，是听课吗？还是在下面刷题？你在操场上做广播体操，你永远都要锻炼你的身体的，这个时候干什么效率最高？你不要等着中考前在那个操场一圈一圈的跑，你现在在那里无所事事。懒在那里拖拖拉拉的，不是我要管你啊，你现在最好的就是认真练习，让自己身体强壮，为什么？提高了效率。那么中考前的时间，可能别人在操场上练习长跑，而你有时间选择可以学习，甚至可以玩，把高效的学习意识植入在我们孩子的心里面，你会发现你的孩子好有学习动力，而且他爱思考。","那么在这节课的最后，我提醒一下各位父母，当你跟孩子做了这样一种学习计划和规划之后，在很长的一段时间，你的脑子里要记得这件事，时时刻刻提醒、引导、激励、规劝，后续乏力往往是一种虚伪，孩子就会越来越不信任你。我们可以把这节课的效率意识做的踏实，你会发现你的孩子眼里有光，你会发现他脑子转起来了。"],"id":"c1-13","course":"如何唤醒孩子的自驱力","n":13,"chars":2577},{"chapter":"动力系统","title":"06 评价","paras":["这节课讲动力系统的最后一个部分，叫做评价。","评价是一种希望，事事有评价，孩子就事事有希望，说通俗一点就是有盼头。今天晚上你要努力学习，什么叫做努力学习？要一直学到学不动了，必须睡觉了为止吗？这就是没有评价。今天晚上这个学习问题你要解决到百分之多少？这就是一个评价，有一个盼头，有一个目标，有一个希望，他就有动力。评价无处不在。我很坦率的告诉各位父母，这十多年来，我没有遇到一个不喜欢考试的孩子，而且他们特别喜欢那个考试的分数。如果一个孩子告诉你，他很讨厌考试，他讨厌的不是考试，他讨厌的是考试的分数，被别人知道的。他自己是很想知道的，因为考试在评价他，有考试就有希望，有希望就有动力。","我们在教育的过程中，经常会说一些没有评价标准的话，就像刚才我说的，今天晚上你要努力学习，明天上台演讲，你要好好表现。什么叫做努力学习，什么叫做好好表现？一旦一件事情没有评价，你不要认为就没有压力，反而压力巨大，为什么呢？因为这件事情就给人的感觉是无穷无尽的，是让人疲惫不堪的。","我举一个很经典的例子，就是孩子的计算能力比较弱，很多父母就告诫孩子，你要多练计算题，当孩子坐在写字台前，有一天的时间，他其实也是雄心壮志的想好好的改善一下自己的计算能力，但是他面对无穷无尽的计算的时候，他不知道该干什么，因为计算的正确率他就算再差还是不错的，什么时候是个头，再有意志力也就坚持个半天。有父母一定有这样的经验，孩子练习了半天，从书房走出来，说自己要练吐了，这不是他在矫情，真的是会吐的。什么叫做练好了不知道？那么什么叫做有评价的练习呢？来孩子这里有100组计算题，每一组计算题有十道，每天你要全对一组，就算过关。过关就是一种评价，孩子心里就有底，我只要过关了，我的任务就完成了，这叫做希望，是靠评价来完成。","我希望各位学员从这个例子中能够看出评价和惩罚是不一样的，什么是惩罚？惩罚是你错一道就得做十道，评价是你必须全对其中一组，其实效果是一样的。可是。你的态度不一样，一个就是恶性压力，一个就是动力。在我们教育孩子的时候，免不了要给孩子提一些要求，这些要求就不能是模模糊糊的，请收拾好你的房间，什么叫做收拾好？标准在哪里？所以评价非常的重要，它是我们教育的落地，是孩子心里面的踏实。而且评价也能让我们心里面踏实。它实际上是一种釜底抽薪，什么意思呢？就是孩子如果学习了一天，我应该怎么评价他，不能够是靠我们眼睛看一看，他是不是又拖拉磨蹭了，不能是靠我们的一种感觉，他今天是不是不认真了。","你真要去介入他的学习，虽然我一直强调学科类学习父母要少介入，但是如果你介入了，那么语文学科今天的评价标准是什么？数学学科今天的评价标准是什么？你达到了，我就不跟你废话，也不跟自己废话，一道题做对了就是对了，一篇课文背好了就是背好了，你怎么背的，你打没打草稿我都不关心。这事儿不就变得单纯起来了。各位还记得我在兴趣那一节课里面讲到的有一种兴趣来自于不确定奖赏，如果孩子面对的不是一个又一个的铺天盖地的要求，而是铺天盖地的评价的话，那么这些评价总会有那么一些能够给他带来奖赏，虽然有一些他是完不成的，所以他叫做不确定奖赏。","回到最开始我讲的没有孩子不喜欢考试以前，我十年前啊，我们班上的孩子要求我天天给他们考试，其实就是20分钟那种代替作业的考试，我当时心里面还打鼓，我觉得孩子可能不太喜欢考试这种东西吧，但是只要你不把成绩告诉家长，不在班上公开，他们好喜欢，对于学霸学生而言。天天20分钟的考试。他一定会有失误的，所以本来一个确定的我一定可以获得一个好成绩，这样的一种常态就变得不确定了，你说奇不奇怪，突然就让这种学霸学生产生了得高分的希望，那种欲望就来了，因为不确定了。对于学渣学弱而言，那简直就是救赎，因为对于他们来说，基本没看见过好成绩，但是每天20分钟，有些时候又简单的不得了，他可能会拿到一个高分，到处宣扬，甚至可能是他们学业生涯中第一次感受到了我的成绩是不确定的，是有希望的。后来我每一届带班的时候，我都搞每天的小考，用来代替作业。学风之盛，你难以想象，全部都在追求一种其实别人根本看不到的东西，那个东西就是他们心里面的那种希望。而这种希望。就是简简单单的一种评价，那么父母在给孩子制定任务，提出要求，甚至是在展望未来的时候，通过我们第一章压力系统的拆解，把目标拆解之后，每一个步骤都提出一个评价标准，什么叫做这个步骤完成了，孩子就会动力满满。"],"id":"c1-14","course":"如何唤醒孩子的自驱力","n":14,"chars":1803},{"chapter":"惯性系统","title":"01 惯性系统概述","paras":["我们现在进行第三个板块的讲解，就是惯性系统。","惯性系统顾名思义就是不用力你就可以前进，和物理学里面的那个惯性是一回事，有人说这不可能吧，你不用力就可以前进吗？这个地方的不用力是指的我们大脑可以不费吹灰之力就能够去做，去完成，去坚持。我举个例子，走路是我们早期就培养好的一个习惯，我们的双腿能够下意识的自然摆动，完成走路这件事情，我们从来不会去关注我的膝盖，我的肌肉，我哪一块肌肉怎么使力才能够完成走路这项壮举，我们想走，大脑根本就没有思考，我就走了。我们在走路的时候。还可以与人聊天，还可以看风景，甚至可以进行深度的思考。我们沉浸在自己世界里面的时候，我们不仅可以走路，我们还可以越过障碍物，你根本就没有发现，就越过了障碍物，这就是因为我们已经养成了走路这个习惯。","那么学习中有没有这样可以培养的习惯很多，一旦一个习惯的养成，他就不会占我们大脑的内存，所以很多老师天天都在强调要培养一个好的学习习惯，其实是让孩子能够轻松下来的，不是说培养了一个良好的学习习惯，就是增加了孩子的学习任务，所以孩子就学的更多了，不是这个机制。这个机制是你培养了孩子良好的学习习惯。没有占用孩子的大脑内存，让孩子更有了空间，当他更有了空间之后，他更愿意去努力学习了。","所以培养习惯并不是增加任务，而是通过减负激发了孩子的学习动力。听到这里大家就知道，一个好的习惯，它是能够支持孩子自驱力的成长的。惯性系统，这个板块还有一个理解。就是节奏，它也是给我们孩子的大脑腾出空间的。什么叫做节奏？我举个例子，我不知道各位父母跑过长跑吗？如果跑过长跑，你就会发现，一旦超过了一公里，你的身体将会进入一种机械性的节奏中。这个节奏帮了大忙，因为他不用我们再消耗意志力去坚持了。它是我们身体摆动奔跑的惯性，否则你根本就坚持不下来。","学习它确实是一个长跑，如果每次疲惫都需要心灵鸡汤来激励自己，就是一个不断消耗的过程。那么我们需要给孩子的学习生涯一个节奏感，这个节奏感直指孩子最核心的学习流程，这个学习流程孩子他能够机械的，不需要花费心思的，不需要追问，也不需要激励自己，是不由分说的，他就执行下去了，孩子就会觉得学习本来就应该如此，而不是不断的去掰扯学习应该这样或者那样，形成一种左右为难的局面，这种消耗是不小的。那么就要求我们的孩子他的整个，学习生活中有一个大的流程，有点像一个战略性的思考，并且渗透在孩子的最底层的学习生活中，然后你就会发现有一条引线，他不断的在有节奏的摆动，让孩子就算遇到了困难。他都不得不坚持下来，有点像根本停不下来的感觉。再回想我的那个例子，就是长跑的时候，你的身体如果已经养成了机械性的节奏，跑了两公里三公里，累不累呀？很累了，可是就是停不下了，它就是惯性。那么怎么让我们的孩子不仅培养了一些良好的习惯，而且能够让他的生活出现这种节奏感呢？我一节课一节课的给大家聊。"],"id":"c1-15","course":"如何唤醒孩子的自驱力","n":15,"chars":1173},{"chapter":"惯性系统","title":"02 退出","paras":["这一节课要讲的是退出，从习惯培养开始呢，父母往往在教育孩子的过程中就带有控制，就带有强制性，那么我们在压力系统中就说了，我们在教育孩子的时候不要做控制型的父母，可是在培养习惯的时候，我们又要控制它，又要强制它，这个有解吗？有的，只要你的控制和强制是退出的姿态，就没有问题。","其实这句话一说出来，很多父母肯定就明白了，因为我们教育的本质就是不断退出的过程，最终孩子是独自的去面对这个世界，而我们在孩子没有成年的时候，我们去控制他，去强制他，并不是让他依赖我们，而是让他养成某个好习惯，让他今后的人生中，有所倚仗。这很好理解吧，可是我们在教育的时候，常常忽略我们教育的本质。比如说你想要培养孩子每天阅读半小时的习惯，最开始肯定是带有强制性的，可是强制和强制是不一样的，控制性的父母是怎么做的？他和孩子列了一个计划，每天要阅读半小时，第一天他就强制要求孩子必须要阅读半个小时，孩子不愿意，他就用父母的威信去压着他，其实到现在都没有什么问题。重点是第二天孩子还是不愿意，他就压得更重，第三天如此，第四天如此。到最后这位父母会养成一个习惯，一到了时间点，心里面就很紧张，到了阅读的时间了，他今天肯定又不愿意，所以往往在孩子还没有反应过来的时候，那种命令就出现。快去阅读了，今天晚上不要给我扯皮哈，别忘了昨天我怎么收拾你的，你看他在解决自己的压力，已经完全忘记了教育的本质是退出的姿态，他介入的越来越多，最后他的声音就会越来越大，孩子越来越不愿意，父母就越来越失控，越来越失控就越来越想控制，进入了一个恶性循环。","那么什么是一个退出的姿态呢？退出的姿态在最开始培养孩子习惯的时候，孩子可能也是不愿意的，所以他依然带有强制性，最开始和孩子列了一个计划，每天阅读半小时，孩子读到一半不愿意了，开始拖拉磨蹭。退出型的父母依然要用自己能够管教孩子的方式对孩子进行强压，然后孩子今天完成。可是。完成之后，你要注意坐下来和孩子要聊一聊天，这个聊天十分重要。我这里先说明一下，未必是第一天。其实大部分情况，无论你是控制型的父母还是退出型的父母，第一天孩子可能都不会不愿意，我说的是孩子不愿意坚持不下来的那一天，你强制他坚持下来了之后，退出型的父母会说，今天你在困难面前退缩了。妈妈或者爸爸帮助了你，我帮助你的这个过程我们都不开心，可是我知道你到了马上要培养好这个习惯的关键时期了，所以有退缩，有软弱，我都很理解你，你只要退缩，我都会在旁边帮助，可是我希望我明天不用再帮助你了，你要自己掌控你自己。","然后到了第二天，孩子还是没有能坚持阅读半小时，你真的就不要去管，等他在那儿拖拉磨蹭，画画走神，半小时到了之后，你过去告诉他，今天我没有控制你，我感觉你在掌控你自己，这就是我们压力系统提到的空间，你要允许孩子有犯错，有退缩的空间，你一会儿要掌控他，一会儿又要给他空间，但是我们接下来给他谈的话是特别重要的，这不是说大道理，这是一种规劝，而且这种规劝不能发生在事情发生的当口，也就是他读了十分钟突然不想读了，这个时候我们是不要去说话的，因为那个时候我们有情绪，等半个小时到了，跑过去给孩子一起复盘，你看昨天我管控了你，你最终做的还不错，今天我试着没有管控你，你做的也还不错，可是还有空间，明天要不要爸爸或者妈妈来帮你的忙？你看主体是孩子，你就是退出的姿态，你要不要我帮你忙，让我管管你，你这句话说出来孩子都很懵，不过还真有孩子会要求爸爸妈妈你管管我吧，我真的控制不住我自己，你就管他吗？为什么呢？这个时候主体依然是他，因为这是孩子提的要求，这是你们商量的结果，如果比较正常的孩子，他会说不用第二天我能管好我自己，你发现没有，你给他的选择根本就没有讨论，到底要阅读还是不阅读，你们讨论的话题已经被你引到了必须要阅读半小时，到底是需要你来管我，还是我自己管自己，你这个沟通就很成功，主体是孩子，你是退出的姿态。","这一点在惯性系统中非常的重要，为什么呢？其实我压力系统那一章说的要把掌控感还给孩子，几乎所有愿意学习的父母都知道这个道理，但为什么我们在家庭教育的时候就是做不到？因为我们父母有一个偏执，就是要培养孩子一些良好的生活习惯、学习习惯，我们在培养孩子习惯的时候，免不了要用他律来强制要求我们的孩子先把事儿做了，在你强制要求孩子这个过程中，我们其实是让孩子短暂的失去了掌控感，那么我们知道不能让孩子长期的失去掌控感，我们说的毒性压力其实是一种长期在压力状态下。怎么那我们的这种强制要求，使得孩子失去的掌控感能够圆回来呢？这就要求我们的父母不要下棋只下一步，只关心今天，今天我控制了我的孩子，明天我给他空间，连接他们的是一个比较良好的沟通状态，你要规劝你的孩子，你给孩子的选择是以孩子为主体的，我来控制你，我来帮助你，还是你自己控制你自己，总之我陪着你度过，让你养成这个习惯，并且我很坦诚的，我可以给你空间，当你控制不了你自己的时候，我不会给你太多的压力，你一旦控制不住你自己，我就来了，不是这种感觉，你控制不住你自己，我可以给你一天两天，但是过了几天，你还控制不住你自己，我会来规劝，是不是要我出马了，你常常给了孩子一种我要自己掌控我自己的生活，我要自己培养我的这个习惯的这种感觉，你就是一个退出的姿态，你培养的才叫做习惯，而不是孩子对你的恐惧。","其实我在班主任工作中就经常用这种退出的姿态，最开始我会设立一个流程，然后我会盯的特别的紧，盯个两三个星期，我就会告诉全班同学，这事儿我就全部交给你们了，我就真的会撒手不管，然后他们的，比如说清洁卫生啊，班上已经特别脏乱差了，我都当没有看见，但是我会在什么时候开始说话，就是有班委看不下去了，来找我，说你看你不盯的话，班上怎么怎么怎么乱，我马上就会开一个班会，告诉各位同。第一句话就是我再帮你们一次，时间是三天，我只帮三天，三天之后我依然不管。这三天，你们好好看一下我是怎么盯的，班长也好好看一下，然后再给空间。有些时候遇到那种就是调皮孩子比较多的班，可能还要循环个几次，要半年才能解决问题，但是家长们想一下，一个习惯如果半年真的能够养成，非常不错了。所以刚才我其实说了一句话，下棋不要只下一步，你要知道培养习惯是个长期的事情，你把这个时间看到半年一年，那么你就很容易是一个退出的姿态。"],"id":"c1-16","course":"如何唤醒孩子的自驱力","n":16,"chars":2545},{"chapter":"惯性系统","title":"03 筛选","paras":["这节课讲习惯的筛选，在我们培养孩子习惯的时候，有两个很大的误区，第一个就是我们认为我们把道理说到了，孩子的习惯就会自然的养成，不是这样的，一个习惯的养成需要一个长时间的坚持。第二个误区就是我们总觉得要培养孩子一堆的习惯，所以只要是好习惯，我们就很想督促孩子去养成，只要是坏习惯，我们看到了就很想纠正。其实也不能够这样，因为我们一定要认识到，培养孩子的某个习惯并不是一件很容易的事情，所以我们在一段时间之内，不可能又要纠正他七八个坏习惯，又要养成他七八个好习惯，这样是做不到的。你在做一个你永远都做不了的事情，在做一个不可能做到的事情，你就会焦虑，然后最后就是一团乱麻，你会发现你没有一个习惯给孩子养成，也没有一个坏习惯帮孩子改掉了，最后还影响了亲子关系，说不定还破坏了孩子的掌控感，又是一种舍本逐末的做法。","所以基于这两个误区，当你理解到了，你就会发现我们要去培养孩子的时候，要做一个筛选，说穿了就是要找到当下孩子所有生活、学习和成长中间的主要矛盾，其他习惯看着就好，那个主要的习惯就是，这一段时间我们的任务，所以习惯是要各个击破的，否则很难养成。因为我现在正在思考我的下一个课程，可能要做不同习惯的培养流程，我就列举了一下所有学习中的好习惯，我现在已经列举到40多个，什么意思，好习惯太多了，大部分家长的做法就是我想到什么好习惯，我就培养他什么好习惯，今天或者这段时间我想到了，哎，这是个好习惯，我就培养孩子这个好习惯，老师告诉我这个习惯好，我就培养这个习惯。我跟其他的妈妈爸爸一起讨论孩子教育的时候，我听到觉得这个孩子有个好习惯，我就培养孩子这个好习惯。清华北大的学霸介绍，这是一个好的学习方法，这是一个好的学习习惯，我就去培养孩子这个好的学习习惯，没有条理，乱糟糟的。孩子的习惯养不成。","当你发现在孩子的成长过程中有几百个好习惯等着他，你就不可能一段时间全部习惯都给他培养，你应该心里面有一个数，目前他什么习惯最好培养，我就培养这个习惯，其他的习惯，不管是别人推荐的好习惯，还是孩子身上其他的坏习惯，都眼不见为净。","有的学员可能听到这儿都崩溃了，一两百个好习惯啊，那不累死我们父母了，我当了十多年名校的班主任了，我很坦率的告诉各位父母，其实我在压力系统那个板块情绪的那节课里面就提到过。我们见过的学霸学神真的是世界一流的，他们的好习惯也没有多少，有几个孩子他的坏习惯还不少，他就是有几个特别落实而且有效的好习惯，就能够支撑一个人走向卓越和优秀了。","所以说这节课带给各位学员最有价值的东西就是父母们一定要认识到，这段时间我要分析孩子的现状，然后筛选出一个要重点培养的习惯，这段时间就培养这个习惯，把他培养好了，休息几天，然后再分析孩子的现状，收集信息，跟老师交流，再确定一个新的要培养的习惯。如果你的孩子特别小。你想一下，哪怕是一年培养一个习惯，你的孩子都有十多个好的学习习惯，我可以这样说，有十多个特别硬的好的学习习惯的孩子，我还没见过，那不得优秀死，而且家长朋友们，而且各位学员们，你们发现没有，一年培养一个习惯好像也不难，你焦虑个什么？很多家长就是今天我告诉了他要阅读，第二天孩子阅读就坚持不下去了，家长心里面就特别的难受，才第二天而已，你把战线拉长半年，没有效果，你心里面可能都很稳，你都不会去骂他，不会去强迫他，你都还在保护他的掌控感，孩子的自驱力不会出现问题，其实习惯也培养不了这么长。","很多家长为什么会这么着急呢？因为他看到其他的孩子有了这个好习惯，并且从中获益了。所以我这节课还要解除大家一个误会，就是每一个孩子是不同的，他需要的好习惯可能也是不一样的。我在当老师的时候，我就发现了这个问题，同样的两个当了年级第一名的，其实我上一届我就比较了这两个孩子，其中一个孩子他就必须要有改错本，为什么呢？因为这个孩子的记忆性不太好，而且他的收纳习惯特别差，他的书包里面都是乱糟糟的，他的卷子不是被谁撕烂了就是不见了，要不然就像垃圾一样放在书包里面的某个角落。所以他没有办法复习，我在初一下期的时候发现了他这个问题，之后我就告诉他，你一定要简化你的东西，卷子你收纳不好，算了，不要了，这个习惯不要了，我们想一下，数学怎么样可以两三个东西就能够装在你所有学习的东西，笔记本和改错本合二为一，不然你会遗失，只要做完了的卷子你可以不要了，做完了的参考书也可以不要了，因为上面错了的或者是重点需要注意的，你已经摘抄下来了，教材怎么办？教材放在柜子里，需要查阅的时候拿出来，后来这个孩子他书包里面关于数学的就一个东西，就是作业本，因为我们的作业本是一个大的笔记本，这个。作业本既是他的改错本，又是他的笔记本，你看这个习惯就是为他量身打造的，其他孩子就有效仿了，因为他当了三四年级第一名，我说你们效仿个啥呀，你们习惯这么好，你需要这样打破重组吗？就没有必要。","我们先梳理一下这节课的内容，首先为什么习惯要做筛选？第一是因为习惯的培养周期长，第二是因为根据孩子的特点，一段时间只能培养一个习惯，第三，培养什么习惯是因人而异的，所以我们要筛选出来接下来要培养什么习惯，然后把其他习惯全部抛弃，就盯着这个习惯培养，突破了它再考虑下一步。","然后怎么筛选。第一，收集信息，就是孩子的学习信息，他有什么坏习惯，这些坏习惯未必要纠正，你看刚才我举了一个例子，他有一个坏习惯，但是我发现已经没有办法纠正了，可以拿来所用。收拾不好的孩子怎么办？丢掉！从不反思的孩子怎么办？评价！从不预习的孩子怎么办？追问！这节课我不说那种最具体的哪个习惯对应着怎么拿来所用，这个可能这整个课程他是讲自驱力的啊，讲习惯的课程看以后会不会出，但是这节课就是想让父母们都明白，我们收集信息要带着客观公正的角度去收集，不要看着坏习惯就讨厌的很，看着好习惯就贪婪的很，先全部拿过来进行一个整理，和孩子一起商量，这段时间我们培养什么习惯比较好，哪一个你比较容易做到？比如说要培养晨读的习惯，为什么要培养晨读的习惯？因为可能分析到，第一我们早上起床是比较早的，第二可能你的语文是你现在要加紧的，或者是孩子本来背诵的时间就不够，孩子他比较弱的地方就是语言表达等等等等，先分析信息再确定习惯。","第三是要讲一个原则，其实在刚才的啊，我的授课里面已经多次提到了，就是这个习惯一定是。最容易培养的，为什么呢？你第一次第二次培养习惯，不要挑那种难的，先挑简单的，当孩子一个一个养成之后。然后他有了成就感，他就会更信赖你，他就喜欢你给他安排某一个习惯养成的这样这样一种计划，你一来就培养那种看起来虽然确实很重要，但是特别难培养，就是对于孩子来说特别难培养的习惯。我举个例子，比如说孩子本来他早上起床就很困难，你一定要培养晨读的习惯，就不容易办到，不容易办到就会沮丧，一家人都在沮丧。最后这一个计划很有可能会泡汤。","第四点，其实你听完这一节课下来，你就会发现，当你对习惯有了这样一层的理解，你就没有多大的焦虑情绪了，这其实也是挺重要的。我一直认为父母们，如果压力系统也健康，其实对孩子来说真的是一种福气。"],"id":"c1-17","course":"如何唤醒孩子的自驱力","n":17,"chars":2860},{"chapter":"惯性系统","title":"04 台阶","paras":["这节课讲惯性系统里面的台阶，这节课的操作性很强，但是各位一定要注意，依然必须在压力系统、动力系统以及这个惯性系统的前几节课这些东西的前提下进行这一节课的内容。我一再强调，我这个课程是有顺序的，如果孩子掌控感缺失，那么你怎么给他铺台阶都没用。我再举一个例子，如果上一节课那个筛选我们没有做好，孩子在自己形成习惯的过程中就会糊里糊涂的没有动力，他不信赖这件事情。发动机没有发动，何谈后面的惯性。所以我在这节课适时的提醒一下各位。","好吧，我们回到这节课的台阶，什么是台阶？我们依然举一个具体的例子来说明这节课它的底层逻。比如说我们要培养孩子反思或者说复习的习惯，这是一个好的学习习惯，被你筛选出来了，觉得这一阵子一定要培养他，但是你在培养这个习惯的时候，你一定会发现他落不了地，这个落不了地的原因很简单，因为我们成年人可能已经有反思和复习的习惯了，所以我们常常忽略一个问题，对于孩子来说，你看似非常容易的复习，对孩子来说太困难，这种困难并不是表面上看到的啊，你只需要列一个什么表，然后把你要复习的内容写一下，然后个个的去击破它，然后反思一下今天的错题，今天没有完成的事情，今天还有什么事情做的不足，说的很轻松。这个地方的难度在于什么？孩子他没有意识。我是教数学的，你知道数学里面最难的是什么吗？我们在做一道题的时候，想不到那里去，这就是数学的难题。其实对于孩子来说，他要培养一个习惯，对他来说最困难的是你只要不提醒他，他就想不到那里去。","孩子晚上回来做完作业没有复习，第一天你提醒了他，他复习了，第二天又提醒他，提醒了十多天之后，父母忍不住了，然后就开始给孩子说教，说了教之后，孩子一直点头，他不是敷衍你啊，他是真的觉得自己应该复习。可是到了第二天晚上，他做完作业依然会忘记去反思，去复习，为什么？到底是为什么？因为复习对于我们已经养成了反思习惯的成年人来说，它是一个基础，因为我们已经养成这个习惯了，而对于孩子来说，它是一个目标事件，也就是说这件事情，对于孩子来说，复习是一个终点，对于我们来说，复习只是一个现象，这个地方有点难理解，我多啰嗦几句，我不知道各位学员有没有在家里面做菜，如果你经常做菜的话，你会发现整个比如说某道菜的流程，你几乎没有耗费任何心神，就不小心把它做出来了，而你的精力主要在什么地方，主要在我要做什么菜，怎么样可以让味道更好，我的妻子不吃什么，我的孩子喜欢吃什么，你在想这些比较其实更高维度的东西，如果这个时候你的老公或者老婆回到家，今天你没有办法做菜，你怎么教导他做菜，你第一句话就是少放点盐，可是你知道吗？对于这个从来不做菜的人来说，菜籽油在什么地方他找的都困难，然后他就问你这道菜怎么做啊？你听一下你的回答不可能是这样，就是做菜这件事情不可能是这样。","可是我们跟孩子交流的时候，常常用这样的回答，就是他问你这道菜怎么做啊？你回答的是颜色鲜艳，咸淡合适，微辣微麻，你讲的是一个菜的结果，你知道吧，怎么完成这道菜它所有的工序，你一句话都没有说，为什么你不说？因为对于你来说，这不是自然而然就应该知道的事情吗？所以我多啰嗦几句，这个例子基本上就能够体现我们在培养孩子习惯的时候，我们的标高往往是非常高的。你要复习，复习对于我们来说是非常正常的事情，对于孩子来说，他是一座要攀登的大山，中间有很多工序需要处理，所以我经常听到我们班上有家长说，你复习好了没，孩子只能说差不多了，没有任何评价，没有任何标准，没有任何工序，没有任何的台阶，那么我们到底应该怎么培养孩子的一个习惯，要不断的拆解这个习惯的前置的前置的前置，最后把培养这个习惯形成一个因果关系，我做到了第一点，所以我才能做到第二点，才能做到第三点，最后才能够培养好这个习惯。","那么我还是以复习这个例子来说一下，刚才我那一段比较抽象的话，首先复习是一个结果，他的目标是什么？查漏补缺，你看很多孩子连查漏补缺的能力都没有，你叫他复习。所以复习的第一个前置是查漏补缺，那么我们其实应该先培养的是孩子查漏补缺的能力，那么他就又分成了两个能力，一个是查漏，一个是补缺。我们先说查漏，怎么查漏，一般就有三种办法，第一个办法是孩子如果已经有错题本了，那么这个错题本就是他大概率的漏洞。第二叫做梳理，如果孩子时间比较多，他可以把今天的内容进行一个梳理，然后在梳理的过程中有疑问，这个疑问就是他的漏洞。第三个方法就是评价，我没有改错本，我也没有时间来梳理，或者我梳理的能力比较差，那么怎么办呢？我就拿一套卷子来做，错了的题就是我的错题本。好，现在我们来看哪个习惯最好培养，其实是评价，所以很多家长说你不复习啊，你梳理一下，梳理一下，你知道梳理这个习惯有多难培养吗？我当了十多年的数学老师了，没有几个孩子包括学霸能够梳理好我们今天学习的内容，但评价就很方便，评价只需要花钱买一套卷子，孩子愿意做，做了愿意改，或者他不一定是一套卷子，可以是我们收集的某一个题型的题，虽然我不知道你的漏洞在哪里，可是最近比如说数学，它最重要的一个章节是反比例函数的一个填空题，跟面积有关的，那么我就在市面上找的那种参考书，把这种题全部总结下来，我不知道你有没有问题，你也不知道你有没有问题，那么很简单，我们做五六十道题，小题，简单的题，看你的正确率如何，如果。有问题我们去分析，这就已经是复习了，如果做不到，还有一个办法，就是把这个星期的作业拿出来，把错题看一看。所以我们如果要培养孩子的一个复习的习惯，就要培养他查漏补缺的习惯，那么就单单这个查漏的习惯就分为了，你如果有改错本，你就看你的改错本，如果你有梳理知识的能力，那么你就梳理知识，如果你没有这两个能力，你可以做评价，做评价有比较复杂的评价，有比较简单的评价，如果你都没有，你可以只看看你的作业的情况，看看你的课本，这个时候才落得了地。","那么我们在培养复习的习惯的前期，你都不要提复习这两个字，你跟孩子一起商量，你觉得是改错本更好，还是梳理知识更好，还是每天。做一个小评价更好，还是每天在作业里面寻求一些啊新的感觉、感悟更好？一旦确定拿一个星期、两个星期专门培养某一个习惯，比如说就培养孩子每天晚上一个小评价的习惯，十分钟的小评价就会反过来逼迫孩子去查自己的漏洞，这就叫落地。你想一下，你告诉孩子，你要把你的漏洞找到啊，孩子当然说好，他其实心里面也想的是好啊，我真的要找到我的漏洞，可是他就是找不到，他没有意识去找。每天做完作业之后，如果到了要找漏洞的时间，他只能坐在写字台前面发呆，没感觉，这个时候如果父母去催促他，你知道他心里面有多烦躁，这不是说你们不尊重他，也不是说你们亲子关系有多大的问题，他就是会烦躁，因为他也不知道该干什么，你也不知道该干什么，但是你们都知道复习是个好东西，我们要养成这个习惯，孩子也想养成，你也想养成，可是就是没有找到那个入口，那个入口是我们培养习惯最重要的东西，这叫做什么？这就叫做台阶。","一座大山，我不要直接就让孩子盯着山顶，你盯着山顶，你一定要到山顶，你要铺台阶，孩子他自己也要铺台阶，一步一个脚印，完成了第一个习惯，再完成第二个小的习惯，最后那个大的习惯不知不觉就养成了。大家可以思考一下，比如说刚才说了查漏，现在还有一个东西叫补缺。是吧，那么我知道我的漏洞了，是靠评价完成的，或者是靠改错本完成的，那么我怎么补缺呢？这。那我就简单说一下，因为刚才已经有一个非常详细的例子了，你可以问老师来补缺，你可以用参考书来补缺，你可以把你的漏洞写在你最重要的那本书上或者笔记本上，然后靠什么，靠接下来的学习来补缺，其实这个才是我经常推荐孩子，就是我自己的学生他们最好的做法，为什么呢？其实因为老师他后面还会讲到这个东西，你的查漏其实已经让你开始重视这个东西了。所以你在第二天的学习中，当老师讲到或者作业又出到这一类的问题的时候，你就变得谨慎，其实这样的学习已经是深入了这个学科的内部了，他就会学到好，这就是一个好习惯了。","我在培养我孩子晨读的习惯的时候，你知道我拆的有多细。我最开始培养的是他出卧室向右转的习惯，因为他才四岁，他现在天天都在晨读，乐此不疲。我最开始根本就没有提晨读的事情，就是你出卧室，因为我们的阳台在出卧室的右手方，所以每次我出卧室我就跟他玩游戏，向右转，转了一个星期去阳台，最后我的孩子半个月之后，下意识的每次洗漱完毕就去到阳台上站着发呆，然后我就叫他我们在阳台上每天早上可以向着外面吼几嗓子，我也没有提晨读，一个月之后，我的孩子他出了卧室就向右转，然后去到阳台，然后就特别想大声的说话，我就知道时机到了，来，我们来读一首小诗吧，这叫什么？这就叫台阶。循序善诱，说难听一点，引君入瓮才是培养习惯的康庄大道。","那么各位想一下，我这个惯性系统的前几节课就非常有价值，因为你一段时间只培养一个习惯，而且要筛选出来，那么你就有精力去拆解这个习惯，找到习惯的前置，找到前置的前置，他就不会辛苦。如果你一段时间要培养五六个，七八个习惯，你根本不可能像我说的这样铺台阶，一步一步来，一步一步的培养。这半年我一定要让我的孩子养成预习的习惯，半年了，你可以一个月一个月的做战略规划，第一个月，比如说你的孩子是小学，猜你的数学老师穿什么衣服，让他先养成对明天感到好奇的感觉，第二个月猜老师明天是拿课本还是拿参考书，还是要考试，第三个月如果老师要讲新课，你猜他会讲什么，他猜成习惯了，最后就变成预习了，所有的习惯，只要是那种要培养的习惯，他都有潜质，其实所有的都有，你看那个孩子走路，各位的孩子在一岁的时候走路是不是依然是分了步骤的呀？最开始可能有个学步车，后来说学步车有什么不好，不管怎么样，最开始你不会叫他一定要走得虎虎生风吧，先要抬头，然后要学会翻身，要学会爬行，然后最开始双腿站立的时候要有栏杆或者是我们的搀扶。就走路这种习惯我们都搞了六七步，你还认为一个习惯的培养是直接说说而已吗？他一定有台阶的，我们去找每一个习惯的前置，去找每一个习惯的台阶，然后给予我们自己，也给予孩子一个时间和空间，然后一步一步的来，就非常好培养。"],"id":"c1-18","course":"如何唤醒孩子的自驱力","n":18,"chars":4067},{"chapter":"惯性系统","title":"05 流程","paras":["这节课我们讲流程，让我们从培养孩子习惯这个范畴中暂时的出来，回到惯性系统的本身。毫无疑问的是，流程能够保证我们的孩子学习生活的惯性。","什么叫做流程？最简单的理解就是你做事情的先后顺序。事事有流程，孩子心中就有数，其实也对应着压力系统，心中有数就有掌控感的感觉。当每件事情都有了固定的流程，那么每次孩子只需要干一件事就是开始，一旦开始就停不下来，因为有流程在管理他的节奏，这就叫惯性。那么怎么做好我们孩子学习生活中的流程管理呢？我们一步一步来，最开始不要搞得很高大上。注意我上一节课说的台阶，最开始的流程应该是极其朴素的，否则孩子做不到。那么就要求我们养成一个最基本的习惯，叫做列清单，不是列计划。列清单有点像备忘录一样的东西。具体操作是这样，拿一个专门的笔记本，不要写日期。注意所有事情的初级阶段，你一定要尽可能的避免干扰我们孩子最后失败的因素。如果你写成了计划，约定了日期，他可能会失败，失败了这件事情就很难再培养起来。所以我们列清单最开始要朴素到什么程度，没有日期流水账一样的东西，将自己能够想到必须要做的事情全部写在这个笔记。基本上生活习惯就不要写，例如语文，下个星期要背某篇课文，写上；英语有十个单词需要听写，也写上；数学我要解决某一个我没有搞懂的问题，也把它写上。不止是学习，我要记得买铅笔，因为我铅笔用完了，写上出门的时候今天要到我书房的垃圾，家里的茶叶没有了，我要提醒我的妈妈帮我买一下茶叶，能想到的全部写上。写上之后做第二件事情就是在后面打分，最开始的时候不要去分紧急程度和重要程度，把它合二为一，打一个综合的分数，比如说今天下午就要背诵一篇英语课文了，所以它是95分，特别高的分，代表着我要先完成这件事情。我要学游泳，虽然这个欲望很重，可是他不太紧迫，我可以给他打个20多分，代表着我把其他重要的事情完成了之后，我可以开始考虑这件事情。最后你就得到了一个非常简易的清单，上面列举了我最近一定要干的事情，并且后面有一个分数，我的目标就是先从分数高的事情做起走（做完就划掉）。这是什么？这是流程的前置，先列清单，他看起来还不是流程，但是他会指导我们的孩子去做他生活的规划，他渐渐的就有计划性。","所以我说上一节课那个台阶是非常有操作性的，我们总是在训练一件事情的前置，而不是这件事。当孩子养成了列清单的习惯，我们父母也变得特别的轻松，我们只需要偶尔去和他商量，或者去看一看他的清单，并且可以适时的提出自己的生活经验，我是怎么安排这些事情的前后顺序，生活中有什么时间可以见缝插针来完成你这个清单里面可能比较小的一个事情，掌控感也回来了，条理性也有了，孩子也不忘事了，我们的评价也能够落地了。","所以我说惯性系统是我们很多教育落地的地方，在动力系统的评价就在这个时候也落了一下地。我的评价很简单，就是你的清单执行的怎么样，执行的不好我也不批评你，但是我要指导你。我可以辅导你，因为这件事儿是你的事情也是你写的，我们父母只干一件事情，就是给你提出要列清单这样一个要求，孩子很乐于列清单的，我每一届在班上告诉孩子要列清单，他们都非常非常的开心。当孩子完全养成了列清单这个习惯之后，我们就可以开始提高我们流程管理的这个维度，可以在这种事务管理中加入时间管理。就是刚才那个清单，只有一件又一件的事情，可是没有考虑时间，现在我们把时间管理也纳进去，每件事情写上截止日期，然后我们把有些事情，比如说读书，可能我们可以把它固定在早上的某半个小时。阅读我们可以固定在周六周日的某一个半天，也就是我们可以开始用时间去框住这个清单里面有一些必须要做而且常做的事情了，这个流程管理就又上了一个维度，其实这已经叫做在培养孩子的节奏。我在惯性系统概述里面就说到，惯性系统其实有两个，一个是习惯的培养，还有一个就是他生活的节奏感，当孩子已经把这个时间管理都做好了，他已经很优秀，我们可以再清单里面再加上可以娱乐的东西，就是我们把我们生活的娱乐也变成一件又一件的事情写在清单里面，比如说玩手机游戏，你知道这个惯性有多强大吗？我以前有写清单习惯的孩子，一旦在清单里面出现了玩游戏，看小说这一类娱乐事物的时候，他的自控力真的是超越平常人，因为这是一个惯性，他已经习惯了按照清单上面的事物进行先后顺序的排列，并且安排好这些事情和自己的生活时间。他在自己的节奏上突然加入了一个容易让他沉迷的，比如说手机游戏，这个手机游戏会被他的那个惯性系统控制的特别好，我们在旁人看来就叫做自控力好的人真到了那一步，其实好多事情你都不用操心。","在这节课的最后日常提醒大家，我们在整个过程中请留意压力系统所说的所有的概念，要求孩子列清单是给他掌控感，而不是我们去掌控他。是他掌控事情的，不是我们掌控他的。你没有完全领会压力系统里面所有的示弱空间等等等等。拆解这些，你让他列清单，有可能又是一个沉重的任务，负担适得其反。但是如果你发现你前面的压力系统、动力系统和惯性系统的前几节课都做得特别好，你要是能够培养了孩子对自己生活的这种掌控感，你们能想象到吗？他的学习成绩首先不会差，他的人生一定会很好。"],"id":"c1-19","course":"如何唤醒孩子的自驱力","n":19,"chars":2069},{"chapter":"惯性系统","title":"06 共振","paras":["既然我们孩子的惯性是一种固定的节奏，那么他的节奏就很容易被扰乱，因为节奏本来就是容易被扰乱的。在教育孩子的时候，一定要考虑到孩子他本身是软弱方，那么给他提供一个可以和他的节奏共振的环境就极其重要。","这事儿我说出来大家都明白，当你要培养孩子的某一个生活节奏、学习节奏的时候，我们首先这个家庭也要养成一种与之匹配的节奏，这个要和围着孩子转区分来看，比如说你的孩子在小学每天晚上要阅读半个小时，那么这半个小时家庭就应该营造一种至少是适合阅读的环境，特别是在培养的初期，你别看有些孩子天天家里面打麻将，他还是可以认真阅读，那是因为他的惯性已经养成。如果你的孩子还在养成这一个生活惯性的过程当中，那么就尽量不要去打扰他，让他的这个生活节奏有土壤可以培养。我们可以跟他一起看书，就算你不看书，家里面也不应该是那种闹哄哄的。如果你有条件和经历，你可以带他去附近的图书馆，这就是共振。你要知道孩子他不是一个独立的人，他不是。没有人，是独立的人。我现在经常听到有这种观点，说你是一个独立的个体，没有人是独立的个体，他都有他的环境，人是社会关系的总和，这是马克思说的。孩子必然会受到你们这个家庭氛围的影响。我不知道有些父母听到这里。会不会觉得我在说大白话？我说的还真不是大白话。我刚才举的是阅读的例子，因为它比较浅显，我们培养一个习惯是有一个长时间的，那么当你要培养孩子某个习惯的时候，你就要做好一个心理准备，就是我们整个家庭都要适当的做出改变，以满足父母和孩子的不同频率，不要互相的干扰，造成内以后你要培养孩子晨读的习惯，比如说六点半就要起来晨读，结果每天父母八点钟才起床，这个习惯就不太容易养成，这都还算比较浅显的，比如说你要开始培养他的某个学习习惯了，比如说改错的习惯，一旦你有这个想法开始，你就要明白整个家庭都要经常复盘，哪怕是旅行了。回来工作了，回来一家人热爱复盘，就喜欢去多说一些生活中我做的好，我做的不好的事情，进行反思来配合他，这个习惯能够受到氛围的影响，产生一种共振，如果你天天说你要改错，结果你回到家沙发上一躺，给自己的妻子或者是丈夫说一句，今天我又做错事了，哎，算了，不管了，先管孩子，算了，不管了，先看电视，算了，不管了，先吃饭，你就没有反思的这种意识，就很难配合孩子改错的这个意识。","这就是共振，所以我说到这里，大家还认为是大白话嘛，其实是不容易办到的，我当班主任，接触了几百个家庭，那种孩子习惯好的家庭的父母真的心里有数，最近要培养孩子的情商呢，就跟自己的老公或者妻子在家里面经常点评我的朋友怎么样，那个朋友又怎么样，这是家庭的氛围，如果你自驱力课程前面的那些部分做的比较好的话，孩子很信任你，很信赖你，你还可以关注他朋友圈子的氛围。交友是可以干涉的，但是不能直接干涉，直接干涉别人的交友一定会引起反感的，但是可以通过我们的价值观的疏导，去左右孩子对交友的这样一种认知。","所以这节课在说什么？这节课说的是当孩子要培养一个崭新的习惯，就是在一个惯性形成的初期，我们要尽量的让他周围的世界和他共振，最不济不要造成干扰，好多家庭在惯性系统前面都做的特别的好，最后就是因为外界因素的干扰，功亏一篑，这个时候好多家里面的老人，保姆，或者是孩子在学校长期以来的那几个朋友，对他的这个习惯的形成造成了致命的一击。父母一定要关注到这一块，你要培养他的一个习惯，可能长达半年，在最开始给孩子铺台阶的时候，比较轻松的时候，就要开始着手去掌控这个局面，如果是家里面的人就开会来解决，那个是家务事了，你只能够尽力的去解决，如果是学校的或者家里面的事情没有办法解决的，你要想办法挡在孩子的身前，什么叫挡在孩子的身前啊？就是你要通过你的语言和孩子的交流沟通，尽量的让孩子去屏蔽这些干扰。","你发现吗？教育孩子特别像在当一个军师，你的孩子就是那个将军，你加油去打仗，后院的事情我来帮你摆平什么，你打仗出了问题，我给你三个锦囊，给你铺台阶，给你拆解问题，分析问题，把地图挂出来给你看，有点那个味道。这节课就是我要稳定你的后方，安抚那些其他的军队，不要干扰我们，拉拢我们的友军。当孩子的节奏感养成了之后，就不需要我们干这些事了，他在真的在那种棋牌室，也能够认真的按照他的节奏办事，那个力量不容小觑，这就是我们看到的那种在不同场合不管有谁来干扰他，他都能够认真学习的孩子，那是惯性已经养成。"],"id":"c1-20","course":"如何唤醒孩子的自驱力","n":20,"chars":1776},{"chapter":"唤醒系统","title":"01 唤醒系统概述","paras":["这一节课我们讲唤醒系统。到底要讲什么？其实我们的孩子在成长的过程中，家庭做好了前面的压力系统、动力系统和惯性系统，他的整个自驱力系统是健康的，往往这样的家长还没有来买我的课程，很多时候是孩子已经出现了烦躁的、疲惫的、抵触的、厌学的这样几种情况之后，父母们感觉到棘手了，才会到处寻求帮助。","但是我前三个系统必须要说，因为它是培养推动孩子自驱力的一个土壤，可是我们在真正实际操作的时候，孩子已经出现了不同程度的厌学的，自驱力被破坏的情况，我们其实要做一些教育方法的修正的，这就是这个唤醒系统它的内容。在这一节课我要提醒各位学员，就是特别是我们压力系统里面的拆解，动力系统里面的激励，还有就是惯性系统里面的台阶等等，这几节课他在孩子出现了不同情况厌学的时候依然是有效的，再说明白一点，就是你的孩子如果出现了不同程度的厌学症状，那么我们前面的课程依然是要坚持的走下去的，只是这一个唤醒系统我们做一些补充，就是为因材施教而设立的。","前面三个板块是默认了孩子他的整个自驱力系统是健康的，他的整个心态是单纯的，而这一个板块我将带领大家走进那种烦躁的、抵触的、疲惫的、厌学的孩子，他到底在想什么，然后我们在教育他的时候应该做出一些什么改变？怎么把一个孩子从深渊中拉起来，比如说他的压力系统已经被破坏了，怎么唤醒他的掌控感，他的动力系统一片荒漠，我们的语言，我们的状态就很容易伤害到孩子，我们怎么避免这些伤害，并且还可以否极泰来，给予他动力。","孩子在不同程度厌学的时候，他不是就不培养习惯了，他的生活依然需要惯性，我们怎么在孩子他已经有一系列的负面的心理活动的前提下，依然还可以培养他的习惯？这是我们这个板块要研究的内容。","前面三个板块主要讲的是一个底层逻辑，它是一个逻辑，而唤醒系统讲的是一种因地制宜、一种因材施教、一种实事求是，其实讲的是一种思维方式。那么他的落地性看似很强，其实需要家长举一反三，没有办法，因为每个孩子是不一样的，我不可能在课程里面把每一种情况全部说到，依然是用普适性的例子来串联我们的这个唤醒系统的逻辑。这里面牵扯到孩子可能有叛逆期，牵扯到孩子可能已经在家里面不去上学了，牵扯到孩子天天学习的时候哭泣、烦躁、暴躁，甚至是牵扯到孩子可能已经认命、疲惫，无所谓了，他背后的原因到底是什么？我们又怎么样借势而为，把这个人性的东西拿来所用，最后让孩子步入正轨，依然能够有自驱力的学习。","我在这儿，给各位父母打一个气，即使到了高中都还来得及，我们可以想象一下，其实在社会上我们遇到很多这样其实已经堕落了的，他都能够振作起来，所以首先在这节课先希望各位学员有信心、有希望，这是你们要办到的。是我要办到的事情，是当你有信心有希望之后，我这里有方案，那么一切都会越来越好的。"],"id":"c1-21","course":"如何唤醒孩子的自驱力","n":21,"chars":1127},{"chapter":"唤醒系统","title":"02 后盾","paras":["这节课家长们一定要注意，这是整个唤醒系统的一个基调，就是孩子出现了烦躁、疲惫、逃避、抵触或者是放弃。不管是哪一个情绪，只要是明显的出现了，千万不要定义孩子不乖，家长们一定要调整这个思路，是孩子遇到难处了。","这两个想法会直接导致你的整个教育方向出现巨大的偏差。如果你觉得是孩子不乖，那么你将站在孩子的对立面，和学习这件事情一起去欺负他，如果你觉得孩子是遇到难处了，那么你将作为孩子的同盟者，和他一起去战胜困难。我们都知道孩子如果出了问题，亲子关系最重要，那么怎么让我们的亲子关？变得良好，最重要的就是你的定位是孩子的友军，而不是孩子的敌人。别说你在帮助孩子，只要他感受不到，这个关系就无法健康好。","你首先把这个想通了，我们再来想，如果孩子遇到难处了，我们要作为他的同盟者，这个同盟者是以什么姿态出现的，就是当孩子的后盾。不管孩子是出现了烦躁、疲惫、逃避、抵触或者放弃，我们这一个课程都把它叫做是不同程度的厌学状态，你要找到这个根源，孩子之所以会厌学，就是因为他处理不了。没有人不想学习好，大家心里面一定要坚定这个信念，所有人都想学习好的，他讨厌学习，讨厌的根本就不是学习。讨厌的是要学习好而付出的那些自己难以承受的成本，那些成本来自什么地方？一个是父母、老师、同学的否定，这会带来负面的情绪，破坏他的自驱力，一个是来自于繁重的学业负担，或者是不断的挫败、失败而产生了自我否定，最终感觉这件事情就是学习这件事情没有被自己掌握在手中，找不到一条通往胜利的路，他就会无所适从。一个人无所适从的时候，他依然会振作的尝试一些方法去改变现状，可是这个时候如果周边的人不理解，或者不断的又继续的失败，他就没有办法了。最开始就是烦躁，因为他想解决这件事情，但是解决不了；然后慢慢的就疲惫，因为太累了；慢慢的就开始逃避，无所谓，我不喜欢学习，再接下来叛逆情绪就会非常的重。这个其实未必是青春期，不是青春期的时候，你会发现孩子有些时候都很叛逆，为什么呢？因为你只要触碰到他学习这个敏感的点，他就会跳起八丈高，为什么呢？因为他要堡自己脆弱的心灵了，当然最后他可能就放弃，放弃了其实真的很麻烦。","那么孩子最开始本来是烦躁，他为什么会一步又一步的走向了深渊？我们在最开始孩子烦躁或者疲惫的时候，就没有当孩子的友军，作为了他的对立面，和学习一起去控制他，给他增加任务了，我们应该当孩子的后盾，当孩子的友军，当孩子的同盟者，怎么当？","我举一个例子。虽然这个例子未必是你孩子的情况，但是大家通过这个例子进行举一反三，比如说一个孩子，他的成绩在中等偏下，你知道他要遇到多少的困难，第一，父母和老师，包括他的同学对他不太认可的，而且这种不认可你装都装不出来认可，他自己就知道自己的情况。我这个唤醒系统基本上是已经到了小学高年级或者初中、高中了，因为你要破坏他的自驱力可能需要时间，那么到了高年级才可能出现唤醒系统里面的方法，所以孩子他已经有意识，他知道自己成绩不好，那么你们是不可能认可我的，所以这是他的第一个枷锁。他的第二个枷锁就是他可能完不成作业，繁重的作业负担，比如说数学这一个学科，他可能做不起老师布置的这个后面几道题。英语可能背不了课文了，因为时间不够，上课可能听不懂一些内容了，他就会恐慌，一个人在恐慌的时候，他是会自我保护的，父母在这种时候怎么做他的后盾？第一，你要明确的告诉孩子，我们发现了你现在学习上确实遇到困难了，可能有一些学校的任务没有办法完成，但是爸爸妈妈很开心的是，我们看到你在努力的解决问题，那么在你努力解决问题到你最后成功之前，会有一段时间会遭受老师的责罚，这个时候爸爸妈妈能够帮你挡多少就帮你挡多少，挡不掉的，我们陪你一起受着，只要你在努力的去突破，去进步，我们永远是你的后盾。先表明立场，我知道你的难处，我可以帮你挡，我要当你的后盾，而且我接纳一件事情，就是你的努力，它是有一个过程才能够达到成功的，孩子也就有了空间。所以我说我唤醒系统其实是前三个系统的遇到问题之后的实际操作，这其实也是一种给空间。你光给空间没用，所以第二点你要给方案，既然我们可以帮你挡一挡，你也一定会努力的，现在我们就是一个同盟军，那么我们要想一下这件事情按照什么流程来比较容易缩短这一个痛苦的瓶颈的时期，然后这种方法我会放在下面几节课说，但是这个时候你要给他一条明路，这是我们这节课后盾的内容，这条明路是你们一起商量的，你的后盾的作用就做到了。","第三，你要容许孩子出现烦躁、疲惫、抵触、放弃这些一系列的心理活动，他会反复的出现。你虽然给孩子当了后盾，但是你要知道，孩子他的心灵依然是脆弱的，当他烦躁、疲惫、逃避、抵触、放弃的那个时候，那个时刻只要你发现，你都要干涉他，你只需要拍拍他说，你有这样的情绪很正常，这就是你的瓶颈期，这是最难熬的时候，可是也是最酷的时候，可是也是最关键的时候，可是也是离胜利最近的时候。我不会劝你去克服困难，我想告诉你儿子，或者我想告诉你我的女儿，我和妈妈都在，或者我和爸爸都在，软弱，一时的软弱并不可怕，因为你的友军很强大，就是我们，你遇到难处了，我们一定会站在你身后，你什么都不要怕，你好好干，你干你的，这是当孩子后盾的状态。","我最后一个部分说一下，我们怎么可以当到这个后盾，很多家长其实听着很舒服，可是做起来很难，我告诉你，你做起来难的地方到底在哪里？最重要的还是我第一个部分说的，你根本就不知道他是孩子的难处，你知道孩子遇到难处，他说的话，他的表现有多么像在游戏人生，或者说在抵触你，就是他自我保护的时候，很难让你看出他是遇到难处了，他一般烦躁的时候，他就是我不想学了，或者就在书房里面哭，这个时候还比较容易看出来。但是他疲惫的时候，一般就体现出来是拖拉磨蹭，然后在那里发呆，画一会儿画，手上搞一些小动作，这里就已经有很多父母看不出来，孩子其实是已经开始有点厌学、有点疲惫、是遇到难处了，他就会去批评孩子，批评孩子你就站在对立面了，你就不是后盾，如果孩子已经逃避了，那么这个时候更难看出来，因为他给父母的感觉就是学习是无所谓的，然后特别的烦，你们讲学习这件事情，偶尔还会告诉你班上的同学们也在做一些什么不好的事情，又在谈恋爱，又在玩手机，谁又开始偷东西，就是跟你讲很多负面的东西，以完美他的整个不想学习的这种念头。他其实也在自我催眠，很多家长听着就来气啊，就开始教育他，你又站在他对立面，你要把他拉到是你一伙的，其重点在于你不要去跟他掰扯他讲的那个话，你要把他遇到难处这四个字啊，遇到难处当做前提，然后再给他交流，你只需要非常心疼的看着他。我知道孩子不要怕，你现在觉得学习无所谓，有这样的念头我都超级理解了，谁没遇到过点难事儿呢？你理理头绪，我和妈妈永远都在你身后，如果老师因为你这个态度骂你了，同学因为你这个态度觉得你的学习不好了，我们可以，尽可能的帮你挡一挡，因为我知道你在。一个很关键的瓶颈期，在瓶颈期就会有你这样的念头，每个人都有的啊，我一直强调啊，我说的话，首先我是说四川话的，我说的话受到我的语言环境的影响，我只给大家提供一个沟通的逻辑，你的用词到底是什么样的，那完全是看你的一个语言风格。如果孩子出现了抵触，那就更麻烦，只要你谈到学习，他就会跳起来，你仔细想一下，很多家长就不明白，我一谈学习，孩子就生气，他就不爱学习了，其实你们再往下面想深一点，他正好是因为爱学习啊，可是他做不到啊，他觉得没有办法把这件事情干好，他才有可能那么敏感，他完全不重视的事情，他那么生气干啥呀。然后，那时候他的心里面就是啊，学习全是你们给我的，根本就不是我自己想要的，那些全是自欺欺人的话，你也不要理睬，我见过这样的父母，就处理的特别好，真的就是可能跟他们的家庭的风格有关，孩子在抵触他的时候，爸爸一把把自己的儿子抱住，孩子虽然当时很尴尬，但是后来这个孩子发展的特别好，就是这跟家庭风格有关。这个父亲一直在告诉自己的儿子，我了解你的苦衷，我永远是你的后盾，我支持你的奋斗，我也能接纳你的软弱，但同时我又相信你能够振作，就是这一系列的情绪全部给到孩子，你就当了一个后盾，而不是敌人。","如果孩子已经放弃了，那那直接就看出来了，他，他不想学习了，放弃了怎么办？放弃了，它已经是最后一环了，当然我们采用的方法也是时间最慢的，也是最辛苦的，其实我们怎么当一个后盾，更不像后盾了，有点像一个港湾，就是你不要再去说了，真的提供一个温馨的有安全感的家庭环境，看到孩子一点点闪光点就多夸一夸，虽然我一直说夸多了不行，但是这个时候它不一样了啊，它已经心如死灰，你要不断的去挑它的闪光点，然后你的环境是安全的，像港湾一样是温暖的，那么孩子还需要某一些契机，他才能够振作起来，大家也不要觉得太难，我们遇到很多这种放弃学习的孩子，其实基本上都被拯救了，为什么呢？生活它很琐碎，你总是给他温暖，给他闪光点的表扬和夸奖，给他这种港湾，给他这种安全感，你天天给，其实孩子很容易找到那个契机的，没有大家想的那么那么的困难，当然是有一点。","总之这节课在讲什么呢？在讲孩子遇到难处了，而不是突然不听话了。这个时候既不要家长在那儿自责，去分析原因啊，也不要在那儿批评孩子，当他的友军，当他的后盾，总是告诉他，我看见你的苦难了，我相信你能振作，总是告诉他，我们永远都在，这是情感层面必须要做的事情，不然后几节课你根本就没有办法操作，因为你是敌人，他啥话都不听，你们沟通的桥梁断了，孩子就在野蛮生长，那就比较麻烦。所以如果孩子出了问题的家庭，你们先听这节课，后面的方法你觉得再好再有用，你这节课做不到，后面的方法都是白说，自娱自乐而已。"],"id":"c1-22","course":"如何唤醒孩子的自驱力","n":22,"chars":3887},{"chapter":"唤醒系统","title":"03 起点","paras":["这节课我们依然讲一个让孩子摆脱困境的方法，就是起点。我们知道孩子出现了不同程度的厌学状况，他是因为遇到难处了，那么我们在上一节课已经做了他的后盾，给他提供了一个港湾，让他有了安全感。你做到了这个，孩子就有了振作起来的可能和欲望。但是孩子在振作起来的那一瞬间，会遇到一个非常巨大的困难，他在逃避学习的时候，心里面还算舒坦，只是有点慌，可是一旦他想振作起来，他面对的是几座大山，他们有一个共同的名字叫做：账，他欠账了，不要说孩子了，一个成年人只要欠的账足够多，他都特别想放弃，没有几个孩子受得了的。","我们老师经常到。那种孩子，厌学的孩子，他突然想振作起来了，躲在一个角落里，不让其他人知道，悄悄的暗自使劲，可是他一旦使劲那么一两天，他就崩溃了，为什么？因为他没有办法了，他欠的账太多了。这样的孩子往往在突然振作起来的时候，会给自己立一个目标，比如说几天我要把前面的东西全部学完，我们都不要说他到底办得到还是办不到，就这件事情就会让人疲惫不堪，因为别人都在往前走，而只有他在复习。还有一个问题就是这样的孩子他往往本来惰性就很重，他也克制不了自己，他就在那种无穷无尽的自责、疲惫、懒惰、痛苦不已。到底什么思路可以解脱这样的孩子？就是起点。我非常坦率的告诉各位父母，我教过小升初、初中、高中，其实某一个学科它不同章节之间的连接，有。但是没有大家想的那么的紧密。我们永远都不要叫孩子去复习，去查漏补缺，就是因为我们要让他以一个全新的状态投入到一个全新的章节中，把过去都忘掉，让孩子找到那种重新出发的感觉。洗心革面为什么那么难啊，就是过去再牵制自己，我们要把孩子的过去想办法给他拿掉。欠的账怎么办？不还了！父母肯定现在在疑惑，这种方法到底可行吗？欠的账真的就不还了吗？这节课有一个很重要的只有老师才能够提供的价值，有一个真相父母都不明白，","第一、一年级的很多东西都不在学科的主线上，比如说初一数学学的线段和角，小学学的什么数论几何，一些应用题的做法，其实对他整个数学的影响都不大，孩子直接在人生中把这些东西砍掉。都不影响他最后高考得到好成绩，所以有些孩子说我荒废了好几年了，我可能一辈子都只能当后进生了吧，你要告诉他，不是那些东西学了也没用。当然我在这里要告诉各位父母，学了当然是有用的啊，他主要锻炼了我们的一些学科能力，但是这些知识是没用的，你去补它没有意义了，往前看，前面依然能够锻炼我的学科能力，所以是不是只要提高了对学习这种应试教育的学习的一个认知，我们就直接知道。其实好多东西都是可以丢掉的，你去年没学好，前年没学好啊，问题都不大的。学习本质上是在提高你的学科能力，那些知识只是一些载体，前面的载体没学算了，后面还有载体，我学扎实一些，学踏实一些，学深入一些，依然可以成为优生。这是第一种情况，这种情况其实涵盖了起码60%以上的这种学科知识是可以直接丢掉的，那么还有一部分知识，它确实跟后面的章节有紧密的连接，这种东西怎么办？也告诉孩子丢掉不要了，但是就有一个操作上的难点，就是你丢掉不要了，后面的知识确实就会学的更痛苦，你就买一本参考书，告诉孩子，不要去复习怎么办呢？学新章节的时候，做新的作业的时候，如果你发现有个东西完全不知道是怎么回事儿的，你就把那个东西拿来看一看，就看那一个知识点，其他的都别看，你把那一个搞懂了就行，千万不要啊，我遇到一个知识上的困扰，然后就去把那一学期的那一章的东西全部都要学一个透，这样好像才是正规的学习，不用你直接理解到那个知识点就可以了，让孩子轻装上阵，你要注意，你要解决的是一个已经有点厌学情绪的孩子，不要搞理想主义那一套，永远叫他盯着前方，出现荆棘就披荆斩棘，出现巨大的没有办法跨过的困难，就直接无视，先跑起来，把今日当做我的一个全新的起点，一切归零，没有负担重新出发，而且还有惊喜啊，因为你并不是真的归零了，其实你多多少少还有点儿那么点儿东西好，现在孩子就又有了后盾，又有了起点，他的心理建设基本就完成了，可是他接下来还会遇到困难，那么我们就要在他学习的中途给他拿掉让他为难的东西。我再强调一遍，我们面对的是一个有厌学情绪的孩子，不要觉得我们把他呵护的太好了，他现在就是欠呵护，呵护的就是他，当他跑起来了，你再去锻炼他也不迟。"],"id":"c1-23","course":"如何唤醒孩子的自驱力","n":23,"chars":1730},{"chapter":"唤醒系统","title":"04 肯定","paras":["这一节课我们讲唤醒系统里面的肯定。孩子已经出现了不同程度的厌学情绪了，我们怎么去肯定孩子，你不可能肯定他的厌学情绪吧，你也不可能肯定他做的好，因为他做的就不好。可是我们知道这个时候又不能否定孩子，要去肯定孩子，那么到底应该肯定什么呢？肯定一个东西：节奏，不同时期你肯定的节奏有所不同，在刚刚你捕捉到孩子有厌学情绪的时候，你要肯定的节奏是你不是厌学了，你是遇到瓶颈了，一个人有瓶颈很正常，你突破了他，你就脱胎换骨。","大家不要看考进我的班的都是一些优生，就是小升初发挥的比较好的，可是有些孩子他是因为父母控制的特别紧，所以已经有点厌学情绪了，他们很信赖我，跑来问我说我不想学习了，到底应该怎么办？我第一句话就是，对了，你遇到瓶颈了。人在学习的过程中就是会遇到瓶颈的嘛，你看其他学生都糊里糊涂的，根本就没有思考过学习，你现在在思考，思考的时候很痛苦，这段时间很不想学习，觉得没有什么意思，而且甚至会觉得任务很繁重。可是你要明白，这不是你出了什么问题，不是你犯了什么错，而是你遇到你学习生涯中的第一个瓶颈了，你突破了他前面就是新世界。谢谢你告诉我，这段时间我会做你的后盾，陪你一起度过。你看，这就是第二节课讲的后盾，我很看好你。突破瓶颈的孩子一般都比那种糊里糊涂的孩子还要厉害，你看你肯定的是什么。你没有肯定他做得好，也没有肯定他聪明，也没有肯定他的想法是对的，你肯定了这件事情是必然发生的，他不是坏事，这是一个方面的肯定，就是在孩子刚刚出现问题的时候，告诉他这是一个瓶颈。","第二个方面就是孩子他其实厌学的时候，你会发现，你要捕捉到他一定会有振作的时候，你平时情绪是稳定的，和孩子的沟通是正常的，那么你就可以在这个过程中就是厌学的这个过程中没事就把孩子叫过来。我观察你一段时间了，虽然你觉得你学习没有上心，平时过得浑浑噩噩的，但是以老爸老妈或者以老师多年的经验来看，你在突破瓶颈的这样一个正确的节奏上，黎明前就是黑暗的。现在你是最痛苦的，熬过去你就能看到希望，你看到没有，你避免了正面的冲突去掰扯，学习重不重要，学习有不有趣，你该不该学习，直接把这些丢掉，告诉他前面星光灿烂，你在正确的一个突破瓶颈的一个道路上，你的节奏很对，短暂的低谷正是通往高峰的必经路线，收回拳头就是为了猛烈的出击，你要肯定他就在这条正确的道路上。","我很坦诚的告诉大家，即使是第一届我教平行班，我们班上都没有厌学的孩子，一般孩子厌学到中途的时候，我经常就把这种有点厌学情绪的孩子叫过来，给他说，你的节奏是对的，我看了你很久了，你就这样带。你现在很苦恼，我明白，但是我看你越来越在一条正确的节奏上了，你马上就要见到曙光了。其实孩子很懵，因为他真的什么都没干，但是你做了一个很强的心理暗示。就是孩子会想，诶，我要看到曙光了吗？我怎么就在一个正确的节奏上了呢？我这节课没听呢，作业我没做啊。但是他结合你最开始给他说的瓶颈，他会隐隐的感觉到，难道是生活在推着我走吗？我没感觉到，可是我确实在走。当然这个肯定的前提是你在孩子的心中有一定的权威性，如果没有权威性也不要紧，你话就不要说那么满，甚至你可以借孩子心目中特别尊敬的人的话来告诉他某某老师说的，说你最近虽然在度过一段艰难的时期，可是你度过的方式非常的好，你马上就要度过了，你在你的节奏上，我听了很高兴，我来鼓励你，我知道你现在很苦恼，这句话其实要经常说，我知道你现在很苦恼，其实有些厌学的孩子，他心中未必是时时刻刻都很苦恼，但是他大体是苦恼，你讲完他就会因为他苦恼这件事情而由生出一种良性的压力，另一方面，你又在肯定他，在正确的道路上，前面就是曙光，此消彼长，对孩子来说，这个选择并不难。","这是第二个方面的肯定，第三个方面的肯定是发生在孩子振作起来之后，看到那么一点点成就的时候，我恳请各位父母不要欢欣雀跃，对很多孩子来。说你的欢欣雀跃是一种否定，我在激励那一节课里面专门就说了这个事儿，孩子从600名啊进步到了400名，你去欢欣雀跃，他会觉得你看不起他，依然肯定他的节奏，你看我说你节奏是对的，你进步了，要我说啊，你还在这条路上，曙光马上就要来了，你看看这条路就是对的，你的瓶颈马上就要突破了，好样的，你的苦恼是不是少多了？不要着急，丰厚的果实还在前面等着开张啊，孩子。","当然我每次都要强调一遍，我有我的语言环境，我是说四川话的，其实我说普通话有点怪怪的啊，你们用你们的语言的这种表达习惯去传达这一节课的这种逻辑，一定要肯定孩子，但是不要盲目的肯定他的成果，他的聪明啊，他做的有多么好，肯定他就在正确的路上，要肯定他就是会遇到瓶颈，你把这个厌学的事情说的合理了，孩子就不会自我否定，他的力量就会被解放。所以我一直说家庭教育有一个前提，就是你要相信孩子本来就有自驱力，本来就有力量，我们是去解放这种力量，不是去给予他这种力量。在唤醒系统里面，你就更能够体会到什么叫做解放，屡试不爽。"],"id":"c1-24","course":"如何唤醒孩子的自驱力","n":24,"chars":1991},{"chapter":"唤醒系统","title":"05 突破","paras":["这唤醒系统的最后一节课呢，我们讲突破，以前我发过一个视频，说差生最好的办法就是用突破一个知识点，撕开一个口子，当他突破了这个知识点，撕开了一个口子，他就看到希望。一个看到希望的人，他是不太愿意放弃的。你们一定要注意孩子厌学的机制，最深层次的原因就是看不到希望。","我们都知道希望很重要，但是怎么达到有希望这样一个结果呢？就是突破。为什么是突破而不是努力？就是因为他已经处于不同程度的厌学状态，他没有办法像其他孩子那样努力，他只能逮住一个知识点、一个能力点进行突破，让他看到我还是有希望。大家可以模拟一个场景，就是你的孩子。即使是被一群街头小混混堵在了一个死胡同，要揍他，你的孩子叫天天不应，叫地地不灵，这是很多厌学孩子的一个真实情况。别说孩子了，就算是我们遇到这种情况都束手无策。我告诉你有办法，这个办法既不是突然就有了一身武学技巧，把这些街头小混混全部撂倒，那是不可能的，也不可能抱着头在地上任人宰割。这个办法是你别管其他人，你盯着人群中最弱的那一个人，或者就是那种厌学情绪还比较好一点，他还比较有实力的，就盯着那个最重要的那个街头小混混，除了这个你盯上的人，其他小混混怎么打你，拽你、拉你，你都不要管，就揍那个你盯上的人。一直揍，揍到他服气为止，这场战斗才有可能打赢。而其中的关键就是气势，在打架中叫做气势，其实在学习中就叫做希望，这个希望怎么来的？突破一个关键点，或者突破一个薄弱点。","我记得我很早以前有一个学生，他上了高中之后休学了半年，因为身体原因休学了半年，然后再去上学的时候就跟不上了，他就有点儿厌学，他父母和他本人都特别信任我，来问我应该怎么办，我就告诉他，英语做做样子，语文做做样子，最好突破的是理科，物理、化学知识点太多，先把它放在一边，就攻数学，数学你拉了这么多的账，那哪些都不管了，我告诉你哪个知识点最重要，什么抛物线、双曲线不要了。就搞椭圆。搞多久，一个暑假再加两个月的上学时期，加起来四个月就只做椭圆的题，其他学科全部做做样子。当时他的父母和他本人其实都有点儿恐慌的，因为我提的这个方案意味着他会欠更多的账。但这个孩子本来在初中就是一个逆袭的孩子，他特别信任我，他就说如果不成功我就降级。我说对嘛，置之于死地而后生，你还有降级这条路可以走，那你怕什么？你先试一下，试半年。后来这个孩子考上了四川大学，对他来说相当不错了。毕业之后他来找我，他说当时因为后来就是那一段，半年之后他没有来找过我了，他是毕业之后才第二次与我相见，他说李老师，我没有用四个月，我一个月就解决了。他说当我解决了椭圆之后，我觉得。整个世界都明亮了，我觉得我又行了，就是要找到这种感觉。","厌学的孩子没有希望，怎么心灵鸡汤，怎么激励他，其实都只是暂时的一种安慰剂的效应，真正要落到实处，要让孩子看得到客观的希望。而客观的希望，按道理他这种休学了半年，还有有些长期厌学的孩子，他已经欠了很多账了，客观的希望看似是很难办到的，但是有一件事情可以办到，就是突破，其他的都不管，我就打这一个点，那我就比你们所有人在这一个点上都有优势，我牺牲所有的学科来得到一个优势，而其效果就是会重拾信心，那个时候你还认为你欠的账很重要吗？一个有信心的孩子，他虽然又欠了一两个月的账，但是比一个厌学的孩子这种比较就是天壤之别，抓主要矛盾，先解决希望的问题，先解决自信的问题，先解决厌学的问题，再解决欠账的问题，那个问题都是最后水到渠成的，这是第一种突破。","对于那种厌学程度比较轻的，还有一种突破办法，这个是我们用的最多的，因为如果没有出现上个例子那种已经休学了半年这种孩子，我们学校的学生即使是厌学了，他欠的账也不太多，而且其实大部分的家庭孩子也只出现了比较轻微的厌学情况，那么就没有必要牺牲那么多来重拾信心，牺牲什么东西，牺牲难题，这是我当老师的第一年，我的师傅教我的第一个绝招，每天练简单的选择填空题，我当时其实是很懵的，我觉得这个师傅不教真东西，天天教我练孩子的基础，我怎么把我们班上的优生提高呢？可是我坚持了半年之后，我发现不仅是那些差生成绩提高了，优生也得到了提高。我当时都很迷惑的，天天练基础，把难题丢掉，不进行任何的数学思维训练，我们是初中啊，而且当时我们已经学到初一下期了，已经有全等三角形这种特别考验数学思维的东西，我能够把一个平行班，当时我第一节教的还是一个平行班，拉到正数第二名，全靠这个方法，就是每天几道简单的题，题又少又简单，天天练难题会出现吗？会出现。因为年级上有考试出现了，我也会评价，甚至就是把答案贴在教室的后面，不做任何改错的检查，不做任何要做对的这种要求，第一届就取得了巨大的突破，而且第二届、第三届、第四届我都用这招屡试不爽，从未失手。我当时还觉得我的师傅，因为他年龄稍微大一点吧，我觉得他是老古董，天天叫我夯实基础，那个基础好了，我们都知道很重要，可是夯实基础你不能解决难题呀。后来我才知道，他跟夯实基础没有啥大关系，他主要解决的是孩子的掌控感、自信心，他给孩子的是成就感和希望，你说孩子是傻子吧，他不知道你在给他练简单题啊。我告诉你，他知。啊，他的理智世界告诉他，我练的题就是简单的题，我正确率高并不能代表什么他都知道，可是他的潜意识就告诉他，我很棒，我能够。当他遇到那种中档题或者有点难的题的时候，他就有一个惯性，就是觉得我能够解决，好像不太难，他就走了几步，走了几步，他发现这道题还真的就做出来了，这个时候他突然发现，诶，这道题我以前是做不出来的，现在我能做出来了，一步一个脚印，慢慢的对自己的信心就越来越足，一般进行个两三个月，班上的学生全部都求知若渴的希望我讲难题，每一双眼睛都在告诉我，李老师，不要不相信我们，我们能行，有了这种状态，你说他能学不好，那就是一种心理暗示。我们想另外一个极端就，如果孩子总是做那种难题，一天的作业中有那么四五道题他都做不起，那么他一定会有点厌学情绪的，因为真的是不太好受那种感觉，每天都在错，每天都做不起，最开始还有点想法，想认真听一下课，想认真改下错，可是每天如此，他知道那些是难题，你看跟他知道那些是简单题是一个道理，他就算知道那些是难题，但是他常常做不起，他都会灰心丧气的。他知道那些是简单题，但是他常常做得起，他都会满怀信心的，这就是一个很简单的人性问题，后来我就跟我师傅说啊，你真牛。","那么家长应该怎么做呢？其实我的粉丝群里面已经有好几个家长采用这种方法，一个月就获得了很大的就是孩子的成绩，获得了很大的进步，每天五道选择题，或者每天五道那种计算题，每天也不做任何的惩罚，不做任何的要求，就每天只提出一个希望，就是希望这种简单的题，你能够把它做到全对，这个希望是有基础的，你一定要给他精打细算，把期末考试，半期考试的这种卷子拿来，你说你看你基础做完了，你能够得到多少分，那么你这些基础能够花多少时间，我告诉你大概的比例是这样的，像数学这门学科，你把所有的这种基础的题做完，150分的题，你可能能够得到105分左右，而这105分两个小时的考试，他只需要花40分钟左右，也就是说40分钟他能够得到105分的基础题。可是他总是会错是吧？那么剩下的45分，他要用一个小时20分钟来做，你给他一个心态，什么心态，你这一个小时20分钟你可以玩，你得一分全是赚的，但是前提是那105分你可以完全的得到，或者得到大部分，你这个精打细算之后，你每天给他练那么五道题或者十道题就有了基础，小学可以练多一点，因为小学做的特别快，总之不要超过十分钟，你要知道你这一个项目，你这一个教育方法，并不是让他真的要掌握什么东西，或者夯实什么基础，你就是让他找到那种感觉，那么十分钟就够了，重在每天坚持，你不要看到他天天全对，你就想给他加难度加量，我们的目的是什么？就是让他天天全对，他就能够达到一个效果，叫做突破，这个效果的效果就是希望，希望可以驱散所有厌学的阴霾。","我希望各位学员一定要坚信这一点，一个有希望的人，他是不想放弃的。我看到很多家长都是如此，就是自己的孩子特别厌学，又叛逆，家长就觉得我不想管他了，那这就是一个放弃的状态。一旦孩子开始振作，没过半年，家长甚至把工作也辞了来陪孩子，我说你半年前不是不想管孩子了吗？他说我孩子不是振作起来了吗？我看到希望了啊，我觉得我能付出一点就付出一点吧，你看家长也一样，孩子也一样，他一旦看到一点希望，他就不愿意放弃。所以这节课是集大成者。","你再回味一下前面说的后盾，说的拆解，说的台阶，那些课全部在这节课最后的突破中可以得到集中的一种运用。我前面好多说的家长要给孩子的那种感觉，那种激励，培养他的兴趣，兴趣就是深入的感觉嘛，要跟孩子站在同一个阵营，这一切的一切都是为了保证我们很落地拆解台阶，然后这个评价这些具体的教育的落地。突破是很落地的方法，但是我在给班上的学生搞突破的时候，前面的压力系统、动力系统、惯性系统中所有的东西一个都没有少，不然孩子不信赖，一切都等于白搞，你说的话他不听，就没有办法。你说的话他为什么要听？有的家长觉得是一个沟通的问题，你从课程的第一节课看到现在，你还认为是一个沟通的问题吗？其实还是你心里面对教育孩子的认知的角度的问题，你的角度对了，你用最笨拙的话说出最真诚的语言，孩子都知道你是我的友军，你不是我的敌人，所以不要费尽心思去伪装自己的沟通技巧了，真诚也可以很好。那么祝你的孩子能够早日突破。"],"id":"c1-25","course":"如何唤醒孩子的自驱力","n":25,"chars":3794},{"chapter":"总结","title":"总结（重要）","paras":["到现在呢，整个自驱力课程就已经结束了，但是在最后我要说一个很重要的问题，就是我们对孩子学业成长的一个认知，如果这个认知出了问题，那么我们在用整个自驱力课程体系的时候，就会出现一种不真诚的现象，那么很多教育效果都会大打折扣。","我用一个逻辑把这个教育认知告诉大家：","首先第一个逻辑，我们人类到底和学习是什么关系？有大量的现象表明，学习其实是人类的本能，这个本能来自于两个地方，一个是对未知世界的探索欲望。你看我们孩子小的时候，他对外在的世界有多么的好奇，他就有多么的爱学习。","第二个就是我们为了提高生产效率，或者是获取食物的效率等等这一切，而必须要学习来提高效率。所以学。其实提高我们的生命效率的，那么这是一个有目的性的欲望，它也是促使我们爱学习的一个原因，所以这是第一个逻辑，就是我们人类是爱学习的，需要学习的，是不由分说的，不用去讨论的。","那么这个逻辑稳定的前提下，我们再讨论第二个逻辑，就是学习到底为什么会变成了今天这个样子，就是要去学校学习，最开始是因为社会需要，第一选拔人才，第二，其实也是为了教化民众，他本质上还是想提高我们整个社会的效率，是一个有目的性的行为。那么从这个角度来看，我们花钱让孩子去学校学习，其实是给孩子的一个福利，也就是说我们是让学校提供一个是制度，一个是社会性，还有一个就是配备良好的老师为你答疑解惑，来让你比你自己学习有更高的效率的。所以不管是听课、上学、做作业，其实都是为了提高孩子效率的，并不是要约束孩子的。这个地方很多家长脑筋都转不过弯来，因为像我们这一代的家长，小时候其实被告知了学习是需要很辛苦很刻苦的，所以我们总觉得这个是好像有点反人性的，其实学习完全是顺应人性的，是我们以前接受的教育给我们的一个心理暗示，让我们觉得学习是苦的，吃的苦中苦，方为人上人，是这样一个逻辑，这个逻辑在整个课程中是不存在的，而是我们本来就要干这件事儿，怎么提高效率，让我们更愉快、更轻松，当然到最后也更卓越。","所以我们要解放这些让我们吃苦的东西，说穿了就是毒性压力，也就是说我们的孩子如果讨厌学习，他讨厌的不是学习，而是学习的成本，成本很高，那么我们就主要的作用是优化成本，就是让成本降低。所以所有的好的学习习惯，学习方法，什么预习、做作业，还有就是老师、学校提供的打引号的服务，他是为我们的孩子在解决问题的，但是孩子看不出来，所以这是第二个逻辑，","第三个逻辑，其实大家可以再去回听一下动力系统里面的这个效率，你就知道，其实我刚才说的这个对教育的认知，就是提高孩子学习动力的一个基础，家长们心里面就要有这个教育认知，不然你说出来的话就不真诚。所以我在以前有一个视频里面就强调过，我们一定要把价值观放在首位，自驱力放在第二位，然后接下来是学习习惯、学习方法。最后才是学习的那些知识，","我没有讲价值观，是因为它太大了，所以我第一个课程是讲的自驱力，下一个课程我可能会讲习惯或者是学习方法的培养，大家可以看一下我惯性系统的一些基本逻辑，我可能会把惯性系统里面的基本逻辑直接出一个每一个学习方法，每一个学习习惯的这种培养流程，这个习惯到底要不要培养，比如说预习的习惯，到底你的孩子是一种什么情况，就必须要培养了，你的孩子是一种什么情况，可以暂时不用培养，就是筛选嘛，然后怎么铺台阶，怎么找到这个习惯的潜质，最后怎么评价这个习惯有没有养成，每一节课把每一个习惯都这样给大家啊，详细的解析一下，这是我目前的想法，但是我最后就还是要强调，我们的自驱力是建立在你的价值观稳定的前提下的。而习惯的培养一定是建立在自驱力这个课程的体系下，它真的有一个顺序，没有办法，你最后只盯着知识，你是什么都完不成。","价值观、自驱力、习惯、学习方法、知识你要按顺序来，你一旦跳过，那么就很难成功，你一旦按顺序来，其实就很多事情就变得水到渠成了。"],"id":"c1-26","course":"如何唤醒孩子的自驱力","n":26,"chars":1557}]},{"id":"c2","name":"自学方法","author":"星星学长","desc":"23 节 · 学科方法 · 学习动力 · 考试心态","source":"语音转写逐字稿","lessons":[{"chapter":"自学方法","title":"01 学习认知篇","paras":["大家好我是星星，我们这套课的目的就一个，帮助你变成一个学霸。所以我们把它起名叫做学霸觉醒课，毫不夸张地说，这套课你如果能够听完并坚持实践。你就是一个准学霸了。注意啊，我说的是听完并实践，它这个性质呢，有点类似于你们听过的那种，学科之类的网课，就是做完了要刷题，否则的话随着时间的留神。这些课的作用就会逐渐的变小，那好在呢，我们这属于方法论的课，我们这个觉醒课讲的内容。基本上你每天只要一学习，就一定会用到，它每天的强化的实践的使用，这样的话，你的效果就有了一定的保证。","那我上面刚才用的词是准学霸，因为这套课看完之后，你已经具备了成为一名学霸的各种资质，而且这种资质是弃掉了。学霸们的各种缺点，留下优点之后的一个集合，但你跟你们学校的学霸还差有知识。题目上的积累，那个需要你再接下来投入时间去训练。","注意啊，我让大家成为学霸的目的呢，是你，是希望你考到一个理想的分数，去往你喜欢的大学，而不是为了让你超过某人。尤其是超过了那些，让你嫉妒的学霸。所以我在这里回答一个，很多学生都关心的问题啊，那既然说那些学霸，现在已经比你们。多积累了那么多知识和题目了，即使你现在学会了，也开始积累了，是不是永远也无法超过他们。","首先第一点，我们高考是有满分，750，那上面是有上限的，第二点，我们没有必要去跟他们比较。况且即使在积累，他们也未必掌握了最正确的方法，毕竟初高中学习，它是一个为数不多的。只要努力就一定有收获的一个阶段，他们完全可以积累的很慢但很长，第三点呢，学习一般有三个时期。第一段是痛苦期，第二段是快速增长期，第三段是平静期，听完课，你们知道了该如何去学习之后。即将迎面而来的就是什么，痛苦期，就坚持过以后，你就会立刻进入到快速增长期，这个时期。","你的提分速度，是学霸现在的几倍，甚至几十倍，那接下来呢，就是到了一个平静期，也可以说是第二个痛苦期。可能就是他们现在的状态。所以说，你完全不用担心你的起步，相反，你从现在开始学，是你最快的提步，大家可以回忆一下。你们是从什么时候开始厌恶学习的，说一个你可能不愿意相信的事实。","其实我们人类的大脑，它是享受学习的，它就是为学习而生的，至少在你刚开始学习的阶段呢？你一定会享受过那种，学会了某种支点，它就会给你带来很大的快感。然后你拿着这个支点去做题，把题目做对，那种成就感，你一定一定体验过，这就是我们人类大脑的设定。","那么，它就是比较喜欢陌生的刺激，那这个刺激越强烈，那就越兴奋，我们平时所说的好奇心。其实就是大脑对这种新鲜事物的渴望，那这样你就能理解，就为什么那些学霸，那些科学家。数学家，他们能够费心忘食的去搞学习，搞研究，你以前理解不了，觉得这么痛苦的事情。为什么他们能坚持呢，是因为他们的意志力特别强吗，不。","其实人家是特别兴奋，特别喜欢做这种事情，那除了学霸之外的那些人呢，他为什么会害怕学习。他是因为，难道是因为学习难吗，我跟大家说，如果学习难，那这个年龄段的人，他就都出去打工去种地了，就是因为学习相比于这些。它是轻松的，对于未来的发展是更好的。","所以说大家才会在这个年龄段选择去学习。所以说学习相比于干活。其实轻松很多，那为什么，就是因为大家害怕失败，很多学生不愿意去学习的原因，就是怕自己努力了，还是失败，这样当别人问你。为什么考不好的时候呢，你可以理直虚壮的回复他，我压根儿没学，我要是好好学，我一定能考好。这也是就是你们跟学霸，一个很典型的一个区别，认知上的，就学霸，他为了学会某种知识。他为了做出来某道题，甚至可以一宿不休就要去死磕，他从来没有想过自己会失败，而大家呢？","会因为害怕这个失败，为了这个不失败，就在一开始选择了放弃，我拿我自己举例子。我是一个做教育自媒体的，如果我现在突然失去了，教育自媒体的专业知识，你问我有信心重新开始吗？我一定会回答，我有信心，因为我曾经成功过，我就一定可以再做到，但如果你回到，我刚刚创业的那个时间点问我。我可能会说，我相信我能做到，我不能做到百分之百确定，这就跟你们学习一样，即使学霸现在忘掉了。所有的知识，忘掉了所有做过的题，但他这个想法还在，他就依然可以重新开始，而且学习真的不难。","况且你们还有我来帮助你们，把这些成为学霸的方法呀，资质来给你们总结好，你只需要去执行，而连摸索他都不需要。所以说讲到这里，要告诉大家，我们21世纪最稀缺的就是勇气，不要害怕，学习不难。不要提前预知自己学习的失败，并以这个失败为理由，给自己找借口，我每次做自为体。做不下去的时候，绝望的时候，我就会想起来，我还有妈妈要养，我还有自己的生活，要去自己给自己创造。","所以说，我不会因为这点小挫折而放弃，这就是一个比较好的，一个积极的一个心理按摩。是督促我继续的一个内趋力，但有的时候，大家也可以使用外趋力。比如说，我只要学不好就会怎么样，我在某个人那里交了押金，如果我不定时的打卡。我就会失去我的押金，就这种外趋力，但有的时候，它会给你造成，极大的一个心理压力。","比如说，只要我考不好，我就会怎么怎么样，在这样的压力一旦过度，就会对你的心态造成影响。等以后你就知道，你这个心态会对你的学习，产生的影响，是特别特别重要的。所以说，大家最好通过内趋力，来鞭策自己，你想一想，你自己以后，想要什么样的生活，这样的生活。你靠刷短视频，打游戏，看小说这些，能不能给你带给你，那你在这个当下，这个年纪，除了学习。你还能干什么，你可以去想一想，对吧？","所以说，我们总结一下，我想告诉你几点，第一点，从现在开始学，用我这套课程，教你的去学。绝对不晚，第二点，学习真的不难，学霸不是那么遥不可及的，那第三点，你跟学霸当下。有几个最大的差距，心态，认知。注意力，认知我刚才已经说了一些，不知道大家还记不记得，学霸是享受学习的，他们不会为自己预设失败，而是相信自己一定能学好。即使失败了，他们也会继续，而不是放弃。","其次是注意力的差距。其实你们之间，统计的巨大化是，被日益拉开的，大家每天在校的时间都一致，你们上着同样的课。上着同样的自习，而他们呢，却能做到每节课都高度集中，那长此以往，你们的成绩就被拉开了。放心，我们以后会教你，科学的注意力训练，以及如何保证好，你的课程效率的，再其次的差距，就是学习习惯。休息，饮食，运动冥想等等。","所以请大家充满信心，无论你现在出去学习的，哪个阶段，你都是有非常大的潜力的。那听我的课，最好要准备好一个，你常看的本子，你听到我课，讲了哪些重要的时仓，你就立刻记到本子上。记一个最简洁的。然后去执行就可以了，你应该能感受到，我的语速其实特别快，因为我不想，为了水课程的时长，而讲的啰里啰嗦。我争取让大家快点看完，快点执行。","然后最后快点提升。"],"id":"c2-1","course":"自学方法","n":1,"chars":2711},{"chapter":"自学方法","title":"02 制定学习计划的方法","paras":["大家好，我们这课的标题呢是请把计划刻在脑子里。其实给每天的学习写一个计划，是几乎每个高中生都要做的事，但绝大多数的高中生，还是想学什么就学什么。想起来什么就去学什么，那我们这节课呢，就是想唤醒大家写计划的一个意识，并且告诉大家如何写出一个正确的计划来。那可能会有学生说说学长，我我之前写了一个月的计划，但考试的成绩还是下降了。","然后我就放弃了写计划。其实这句话中存在两个问题。第一个我在之前的课上已经讲过了，考试成绩并不能作为你是否提升的依据，写计划并没有让你下降，而你是否从中提升。你要在平常的学习中自己去总结。第二个有一句格言我比较喜欢，我们不是计划是失败而是失败的计划，你细品这句话其实说的很对。我们写计划肯定不是为了失败，是要成功对吧，那为什么失败了，可能是你计划的不对。那成功的定义是什么，达成我们预期的目标对吧？","所以你，计划正确的大前提，一定是你的目标是符合实际的，你会发现班里有很多同学每天从早学到晚。下课都不离开座位，他每天晚上都学到很晚很晚，按时完成老师的各种作业，但他们的成绩却一直不高。这就是所谓的假努力。其实他们也不像这样，这种时候呢，他们就应该改变一下学习策略，因为你在错误的路上前进。那停下来就是进步，那什么样的目标是不切合实际的呢，第一，无论多么努力都无法完成的目标。第二需要特别长期努力才可以，成功的目标。","比如说你现在高三三四百分，你还想考清华北大，这个很不切合实际，那当然了，我相信还是很少有学生。定第一个这种目标，我重点讲第二个。比如说你给自己定目标，背下来3，500单词。比如说你想要让自己，把数学落下的老术啊什么的学会。","其实这些都不是好的计划，大家记住，计划要越小越具体越好，越小越具体，你要把一个大的学习任务。拆解成一个一个的小任务。比如说给大家举个例子啊，我来当场给你制定一个正确的规划，让你看看，我就拿高中在3，500单词举例。假设说，我把它，把它分为35个集合，每个集合中有100个单词，那每个集合背两次背完。那我们一共就要背70次对吧，那这个时候我们可以尝试先背两次，取一个平均值。估摸一下背一次大概需要多长时间。","然后另一个时间表，看看自己一天背多少次，那假设说你一天背一次，你就在今天的计划表上写上。半次50完成了你就打个勾，那由于背单词是需要同步的，每背三次我们就要复习一次。那这一次，我们就要复习前三次背过的单词，那我们70次，的任务就变成了83次。那每背完总任务的1，3，我们就要再用一次来复习前1，3，那这样的话就变成了86次。","最后我们再加上4次快速重复记忆，看单词的时间，那就意味着背完3，500个单词。需要大概90次，那刚才我们说的什么叫快速重复记忆，看单词就是你在背完之后你要，还是要把这个你背过的单词拿出来。用眼睛快速的去扫，快速的去，算它回忆它这个就是快速的重复记忆，啊之前你已经估摸了你背一次需要的时间。那你就可以决定你是一天背一次呢，还是一天背几次呢，那如果你一天一次的话，新个月就可以搞定3，500个单词。","那然后我们还可以思考背诵的具体步骤。比如说我们每天早上早餐的时候看一会，晚午餐的时候看一会，晚餐的时候再看一会。那课间呢还能穿插着再背一会，那如果这些时间还不够，那你就再抽出一个小块的时间来，并且你还要记住要在晚上睡觉之前。再打开复习一下当天背过的单词，这样一个背诵英语单词的计划就制定好了，我希望大家。立，个，开始锻炼这种给自己细化任务，计划学习步骤的能力，让他成为一种习惯，啊。","那我们接下来要讲有些人，不适合做计划，有时候你精心准备了一个计划，可还是完不成。为什么呢，一个很可能原因就是你的行动力不足，写计划是一个帮你锦上添花的办法。但他不能雪中送炭，他能够帮你从十快速的迈步到一，却不能帮你从零到十，如果你现在连基本的学习时长都没有办法保证。那你的计划就只有一个，去，学习，无论你学什么哪怕没有计划，但只要你去学他都有。都是有提升的，那反过来如果你只写计划，却没有行动，那他是没有任何提升的，那第二类不适合计制定计划的人就是他目前，还没有能力制定一个合理有效的计划。","比如我上面说的英语，这是在我不断的背诵中总结出来的高效，背诵的办法，很多人可能计划就是三个字背单词。啊其他课也是。首先你要通过看我其他的课程了解每个科目的学，法。然后先写出一个，稍微简略一点的计划，在实践的过程中不断的修改，这里你光看课是没有用的。你一定要实践。","然后结合自己的个人情况写出，像我上面写的那个小且具体的规划出来，那接下来说列表。那现实中往往有一堆的任务，摆在我们面前，我们写的计划都是每日计划，显然每日计划肯定是完成不了我们。那么多学习任务的，那这个时候该怎么办呢，列表，你要把你所，把你要学的所有内容全部罗列到一张A4纸上。","然后你就会为遇到一个问题，先做哪些后做哪些，这个时候你就会，跳出一些专家来告诉你。你要把任务分成四部分，紧急也重要的，紧急不重要的重要不紧急，不紧急也不重要的。然后肯定是让你先做既紧急又重要的，紧急不重要的可以先不管，但重要却不紧急的需要优先处理，这个理论绝对是有道理的。","但是对于你们来说，很多人其实都搞不清楚他是不是真的重要，他是不是真的紧急，而在日常的学习过程中。其实并没有什么紧急，或者十万火急的事，我在之前的课上也说过，平常的考试，并不重要。所以你只需要判断这个事，是否真的重要即可，而不需要判断他是否紧急，因为没有什么紧急的事。那标准的是什么呢，标准只有一个，能不能实现你的目标，也就是尽头的高考。","所以你在，从列表中挑选任务来放到，当日规划的过程中，你就盯着那些对实现目标。重要程度高的任务优先，那再其次呢，你在完成任务的过程中，你完成一项你就勾挑一下，这样的话你一路过关斩将。你就会让你的心情特别愉悦，这也是为什么，计划要做的小的原因，我们要通过完成小的计划。来获得正法罪，我上面讲过背完3，500，词大概要90次，那每一次的完成，你都会产生一点成就感。来推动你背下一次，可若是你的目标是背完3，500个单词，那你就没有办法从中获得快乐。","啊就像这个本一样，你完成一个任务，就在前面抬一个钩来获得正法罪，那在你学习的过程中。你会经常对你安排的任务，有了新的想法。比如说当你背完单词之后，按正常的计划，你应该去做数学题了，你突然有一种冲动。觉得自己背的很好，想做一篇英语阅读，但记住，何非万不得已，否则不要轻易更改你的任务列表。你本来一天的任务就这么多，你总是修改，总是添加，你就会导致自己原本的计划完成不了，这样的话你的效率就会降低。","当然了你的那些新的想法不是让你放弃，你只需要把它写在，再办任务清单里即可，这样的话还有一个好处，就是在你完成今天的任务之后。第二天的任务也就想的差不多了，那这个写计划的思维呢，不仅对你高中，甚至等你到了大学。乃至以后都会产生巨大的作用。","所以说我希望大家从现在开始，就接受这种思维，并刻意的练习刻意的使用，等你用久了体会到它的好处之后呢？大家也就不排斥了，那到了最后呢，我还想说三点注意事项，第一我们写计划尽量用笔和纸。尽量不要用电子设备，因为这个电子设备你打开，你的注意力就会被分散掉，你总是忍不住看一下微信。有没有没回的消息，有没有朋友圈，啊这是一个挺可怕的事。","所以说请尽量避开电子设备，就可以买一本，像我上面放的那种本啊，就几块钱一本啊。第二呢，你白天写计划晚上一定要写反馈，就是反馈每项任务自己用了多久完成，这样的话你能从够。从完成时间上看出你的进步，你以前用一个小时做完的任务，你现在40分钟就能搞定对吧？那你肯定提升了对吧，还能让你对时间的把握更精确，那久而久之呢，你完成一项任务大概要多久。你就可以估摸出来了，那这个反馈总结，就可以在下面这个区域来进行写，那第三，我前面说任务要越小越具体越好。","那前期呢大家还有注意什么呢，少制定计划，就很多学生会写一大堆的任务。但是到了最后发现每个都完成不了。所以你一定要先少写，这下完成了可以休息一下放松一下。然后逐渐的把任务量加大。最后找到一个适合自己的量。"],"id":"c2-2","course":"自学方法","n":2,"chars":3272},{"chapter":"自学方法","title":"03 提高注意力的方法","paras":["我们这一课讲如何科学的提高注意力，为什么同样的上课，同样的自习，学吧的效率可以比你高那么多。其中最关键的一个因素就是。注意力，百度上对注意力的定义是这样的。注意力是指人的心理活动指向，和集中于某种事物的能力，是人对事物的关注程度，或集中程度的心理状态。","注意力可以表现为，对某一件事情专心投入的程度，也可以指一个人，专注于某一项活动的心理状态。所以你看。注意力实际上是什么，它是一种能力，那能力就一定可以通过训练来加强，今天我就教大家一个特别好。特别好一个训练注意力的方法，冥想。","首先我解释一下，为什么教大家冥想呢，第一，它是有科学依据的，通过冥想的练习，可以使你的大脑皮层的表面积增大。使大脑灰质变速，也就是说，它可以从硬件上去提高你的注意力，第二，很多学生可能听过冥想。但你不知道具体如何实操，你可能觉得它是一个没啥用的东西。","其实不然，冥想不仅能够提高你的注意力，还能让你身体，更健康，能够舒缓身心，提高你的自制力。改善情绪，提高效率，增强记忆力等等，这些都是有科学依据的，对于学业大的同学而言。它是一个特别特别好处多的技能。所以说，只有你切实的用过了，你才能体会到它的好处，第三，那就是冥想真的太简单了。它没有任何的门槛，特别好掌手，接下来我就教大家该如何实操冥想，冥想的练习方式是这样的。把你的注意力，全部集中到某件事情上，例如你的呼吸。","然后呼吸。然后保持，那具体怎么做呢，我给你拆解一下步骤的话，大概就这样了，你先找一个安静的地方。给自己设置一个倒计时，刚开始的时候，你可以设置的短一点，5分钟到15分钟之间吧？然后慢慢的可以增加时长，你周末在家有时间的话，可以增加到一个小时，那第二呢？用你觉得舒服的方式做好，你可以跪着坐，可以盘对坐，也可以直接坐在椅子上。","总之就是让全身放松，最好挤，挤背要挺直啊，你弓着背对挤住不太好。比如自然的放松挺直即可，第三，闭上眼睛，开始使用，深呼吸，将所有的注意力，全部集中到你的呼吸上，一旦发现注意力。转移到其他地方，就要刻意的把注意力，再集中到呼吸上，持续的深呼吸，在这段时间里。把脑子放空，不要去想时间过了多久，直到闹铃把你叫起来就好了，如果你训练训练了一段时间呢？效果还不错，你可以尝试一下，进阶版的冥想。","其实也很简单，就是把你的注意力，从呼吸上转移到身体上，用注意力去扫描你的身体。先把注意力放到你左脚的脚尖。然后，慢慢的移到左脚掌，左脚跟左脚腿，一直扫描完全身，以右脚的脚尖为结束，这个是进阶版的玩法，就是你无法长时间冥想的同学呢？你可以不做这一步，还是把注意力放到呼吸上就行，当你熟练的掌握了冥想这项技能的时候。你就会自然而然的，把它当做一种习惯，随时随地可以进行冥想。","比如说在出租车上，在吵闹的课间，对吧，你都可以用冥想来进行放松，因为冥想的要点真的太简单了，就是集中注意力，就是集中注意力。当你可以做到随时随地的冥想，说明你的注意力已经得到了很大的提升，你已经可以比较自如的掌握你的注意力了。冥想它的最终目的是什么，是在越来越长的时间里，你能够自如的把注意力集中起来，并且能够控制注意力。","所以如果你在冥想的过程中胡思乱想，走神甚至睡着了，那对你的大脑挥指没有任何的帮助，也没有训练到你的注意力，这样的冥想就无效了。当然了，你刚开始会走神很正常，你要及时的把注意力给装上去，把注意力给抓回来。深呼吸，调整好状态，沉下心来继续集中注意力，慢慢的你就会发现，走神的次数越来越少了，而且每次走神。在恢复的时间也变快了，也变得更轻松了，那这样的话，你的注意力就会得到很大的锻炼了。","说到这里，大家是不是觉得冥想的方法真的很简单，那还有没有更简单的办法呢，答案是有的，这个方法也是经过科学验证的。那就是刻意缓慢的呼吸两分钟，实际上这是一个能让注意力集中能力，更强的训练方法。它具体操作就是这样的，大约每10秒呼吸一次，一分钟呼吸5到6次，我从科学的角度给你快速的解释一下。为什么这么做，在你缓慢呼吸的两分钟内，你的心率变异度被极大的提高了，心率变异度就是你心率发生变化的时候。","快速恢复到正常水平的能力，那心率变异度的提高，它对于保持正常的心率水平很有帮助，而当心率处于正常水平时。大脑皮质与大脑灰质的养分，它的供给是最充足的，此时你的大脑就处于，最佳的工作状态。那集中注意力就变得更加的轻松，这种简易的冥想方式，几乎适用于任何的场景，你在上课之前。","比如说这也特别重要，你在考试之前，你在自习之前，只要你在未来一段时间，需要高度集中注意力。你就可以提前几分钟，开始缓慢的深呼吸，把自己的状态调整到最佳，我们来总结一下。提高学习效率的根本，它是什么呢，提高注意力，因为你每天上课自习，它都是需要你的注意力高度集中，才能够效果最大化。训练注意力最好的办法是什么，是冥想，那日常的冥想训练就是，闭上眼睛深呼吸，把注意力集中到呼吸上，或者是身体上。","去感受那种控制注意力的感觉，在时间短的情况下，你可以尝试的，恶意缓慢呼吸两分钟。把它当做一种习惯，你的注意力也会得到很大的提升。"],"id":"c2-3","course":"自学方法","n":3,"chars":2055},{"chapter":"自学方法","title":"04 高效记忆的方法","paras":["这块来教大家如何高效记忆啊，在学习的过程中呢，我们需要记忆的知识可以分成两种。一种是像语文古诗文啊，英语单词这样必须一字不差背下来的，而且呢是那种知识点之间没有。没有什么关联的，那对于这样的知识点呢，我们要做的就是重复背，及时检测自己是否能够完整的。正确的默写下来。","注意在记忆这类知识点的时候呢，你一定要拿边拿着笔写边背，因为考试它考你书写。不是靠你背诵，拿着笔边写边背，可以有效的防止你走神，或者是写错笔字啊，而且你还要经常的检测自己啊。默写看能不能写下来，那关于背英语单词呢，我还单独出了一节课啊，那个方法真的特别好用。无论你是哪个年纪的，它都可以帮你快速高效的，背完考核的词汇，那另一种知识呢，就是像生物政治这种。逻辑性关联性比较强的，而且它是不需要逐字背诵的，在背诵这样的知识点之前呢？","我们就先需要进行思考，先对要存入大脑的信息，进行一个简单的处理，就背之前思考五分钟。小时，那该如何进行思考呢？首先你要学会翻旧账，也就是搭建新旧知识点之间的联系，利用旧的知识点去记新的知识点。如果你每次翻开一个新的章节，都是平地起高楼，脑子全空记记忆。","那么你一定是又慢又累的，那知识点之前呢，通常是有联系的，那每次在记新的知识点之前。你都要问问自己，你现在要背的东西，跟脑子里已经有的知识，有没有关系，能不能利用已有的知识。来帮助你新的记忆，如果你遇到了相似的知识点，你更是要花几分钟，把它们区别开。你问问自己，它们到底哪不一样，这什么原因导致的不一样，你千万不要无脑背啊，否则的话不仅花时间，还特别容易混淆。你背的越多，可能效果越差，那接下来，我们讲讲在背诵过程中，我们具体要如何操作。","首先我们要明确，从我们记知识点到考试的时候，应用这个知识点，包含了两个过程。一个是输入过程，一个是提取过程，科学研究表明啊，认真看过一分钟以上的信息，都不会被大脑遗忘。那有的同学觉得，自己背东西背不下来，是天生记忆力不好。","其实不是，当你认真看了一段话，这个信息其实就已经，输入到了你的脑子中，而我们回忆不起来呢，或者说记得不全。是因为我们的提取过程，出了问题，那接下来我重点，跟大家说一下，该如何训练自己的提取能力。首先啊，在输入信息的过程中，我们要留下线索，什么意思呢，在我们回忆的时候，大脑会根据输入信息时。流散的中司马迹，找到信息储存的位置，这把信息提取出来，很多时候呢，我们之所以想不起来，就是因为大脑里。","储存的信息实在太多了，而当我们在输入，这个条信息的时候呢，你又没有留下，任何的提示或线索。大脑自然就找不到，这个信息。所以说我们在背诵的时候，要先学会建立线索，也就是给知识点，加上一点提示，你会发现。当我们想不起来的时候，如果有人在你旁边，提醒一下，我们又能很快的反应出来。","其实这就是一个提示的作用，而我们呢，要学会自己给自己提示，因为考试的时候，没有人会提示你。那在背东西的时候呢，有的同学呢，他会给自己编顺口溜，有的同学会用联想记忆法。这其实都是在给自己留线索，只不过每个人的线索的方式，可能有点不太同，那我们建立线索呢？一共有两种常见的方法，第一种，思维导图，特别是要背，你那种神味的生物书啊，政治书啊。历史书的时候，你就可以用上思维导图，用思维导图，把各个章节，各个知识点的关系。","梳理起来，去记那个框架，让各个知识点之间呢，互相成为线索。注意，很多同学背导图的方式是错的，节点之下的分支全部记住。然后再背下一个大块，这样是错的，那正确的做法是，去记忆节点之间的逻辑，一层一层的去背思维导图。先背它的主干。","然后边背边思考，大主干之间有什么逻辑，分别是从哪些维度展开的。然后等背完主干之后，你再用同样的方法，去背下一级的枝干，这样的背诵过程呢，不仅能够帮助你，更高效的记住内容，还能对这一部分的内容。有一个整体的把握，对知识的理解也会更深刻，那关于思维导图呢，这里再给大家几点小提示。第一点，思维导图越是简陋，就越是有效，它就是用来一个直观的反应，你支点之间的联系的。你不要去花时间去画的那么好看，你就省去那些没有用的装饰，你画画绿绿的颜色。","我们说最多就三种颜色，做区分就足够了，多了它只会分散你的注意力，那第二呢，有条件尽量用电子版的导图。最好不要在纸上画，因为电子版的导图，它特别方便更改，那你在纸上容易越画越乱，反而不建议记忆。像电子版的那种幕布啊，这种都是免费的啊。","然后而且呢，你还可以在考前，把你的最后一版的导图，打印出来背诵，当然了，思维导图呢？它也不是万能的，有些支点它没有什么关联性，那这个时候，我们就要用到第二种办法，就是利用发散思维。从试点本身去找线索，你像我前面提到的，什么顺口溜啊，联想记忆法呀。","其实都是这个方法。但是我不太建议大家，去用那个联想记忆法，因为它需要你，冥思苦想的去编例子，这样的话会降低大家的效率。最好的办法就是，利用具体的题目去帮助记忆，当你遇到一个很难，背下来的东西的时候。你不要用你的记忆力去死磕它，你不如去三文课本，或者练色，你看看在题目中，题目是怎么运用这个支点的，从而来帮助你记忆。那我们在输入信息的过程中，给大脑留下线索，我们还要特意的去训练，提取信息的能力。","其实方法特别的简单俗报，就是多次去提取去回忆，这个过程很多人都不愿意去做。他不得不说啊，反复检测确实是一个相当痛苦的过程，需要一遍一遍的面对那种，就怎么想也想不起来的那种感觉。然后你再去背再检测，但如果你要把大多，大部分的精力你都放在了输入上，而害怕检测。那你其实背了再多遍都没有用。","所以你在记忆的过程中，你要及时的检测自己，你不用全部背完再检测，你背一会儿，就检测一下你刚才背了那个部分。你忘没忘，你忘了的及时再加强再巩固，你再练成习惯就不再痛苦了，过几天呢可以再检测一次，就像之前网上很火的那个。艾宾浩斯记忆。","其实他就是学而实习之嘛，你不需要完全按照那个，记忆的周期啊曲线去背诵，这个方法就听起来。可能会要花一些时间，但这个效果就是，无脑背诵，重复背诵，提取能力训练多了。其实你的记忆力，还会潜移默化的慢慢的变强，就是背书你一定是越背越轻松，复习也是越复习越轻松的，这样的话就会形成一个良性的循环。","最后要提醒大家的是，这个记忆啊，它除了方法，它还跟身体有关，对你要适当的补充维生素。保持这个充足的睡眠，它们才是高效记忆的前提，你千万不要为了说，多背点东西啊。去熬夜啊，我们说掌握正确的记忆方法，高效背书，完全没有熬夜的必要，同学们，自己的勤奋啊。并不能掩盖你思想上的懒惰，我以上教的方法，不能帮你实现无痛背书，只要背它就是痛苦的。但可以实实在在的，帮你把记忆的效果拉满，就愿不愿意踏出舒适区，逼自己把要看你自己。"],"id":"c2-4","course":"自学方法","n":4,"chars":2715},{"chapter":"自学方法","title":"05 背单词的方法","paras":["大家好，今天这节课我们讲的是高效背单词的方法。其实大家都会背单词，并且你背单词的方法一定是有效的，因为背单词的方法本身就没有正确时分，它只有效率高低之分，而我今天想讲给大家的是一种更高效的背单词办法。不敢说它是最高效的，但很可能就比你现在背的方法更高效。","首先，很多人都关心一个问题，一天背多少个单词合适。其实很简单，能背多少就背多少，背到你的极限为止，这个时候可能会有人反驳，那学长，我背一整天单词行吗？当然可以，只要你能做到，能做到这是你的本事，咱们有一节课讲的是制定学习规划的课。那节课里我举例子，制定了一个背单词的计划，当时我以50个单词计为一次，大概算出来高中3500个单词大概需要90次背完。我说每天尽可能的多背一点，也就是说一天能背几次就背几次，在实践之后发现有些学生反而佛系了。","他在计划表上写着，能背几次就背几次，能背多少是多少，结果呢，这个进度甚至超过了90天。你看我们大概就要90次，也就是说他一天背的单词甚至都不到50个，这是大错特错的。所以说我现在给大家重新规定一下，每天背的单词至少要三次，也就是说至少要150个单词，最少。因为背单词它是一个很痛苦的事情，我们长痛不如短痛，就是我让你坚持三个月，每天背50个单词，这太难了。这件事就把背单词这个事给忘掉了。","所以说我们就加大任务量，缩短任务完成的时间，好，第一个问题我们解决了，每天至少150个单词，能背更多就背更多。那有人说一天背这么多，忘了怎么办，忘肯定是会忘的，你一天就算只背50个你也会忘。我就只要求你，你在晚上睡觉之前，你可记得，明天忘了就忘了，反正我们还会有复习。那我先提醒一下各位啊，每天这么大量的单词，你一定会很痛苦，要有一段时间去记得。在适应期，前期一定要咬牙给它坚持下来，背习惯了就好了，背的就会越来越上手。","我估计第一个礼拜啊，就是你突然冷不丁的这么大量会相当的痛苦。但是你坚持下来就好了，绝大多数人都止步了在这个第一段的痛苦期，你想要让你的英语突破，就先突破这个痛苦期。然后我们讲具体该如何背。首先，你背的单词的信息一定是简化的单词。","比如说我现在屏幕上的两种单词，一种是你在书上的或者词典上看到的，这种是我们简化过的。书上的单词有音标，有词性，还有各种各样的汉语意思，但其实我们压根儿不需要记这么多。我们只需要记住这个单词最简单的意思即可，因为我们无论是中考还是高考。","其实考察的都是你对这个单词认不认识，看到这个单词之后能不能反映出它的汉语意思。你知道它的汉语就OK，至于这个单词的简化，不需要你去做，我会把简化后的单词的PDF发给你们，这个PDF打印了之后。打印完了之后，你会先用第一遍的筛选，很简单，你把所有单词的汉语意思挡住，看看自己知不知道这个单词是什么意思。你注意啊，你先不要背，你第一步就直接筛选，你知道的话你就用黑色的记号笔把这个单词给删掉。","注意啊，不是中心笔画个线，那样的话你还能看到这个单词，我们是用黑色的记号笔让它消失。大概就是我屏幕上的这个样子，那目的很简单，先把你已经很熟悉的单词删掉，进而能把我们的效率最大化。那也不错，也就是说让我们每天背诵的那150，150里面它都是你不熟悉的单词，或者是说压根就没见过的单词。我咨询了一些英语专业的人，人家就是这么背单词的，另外还有一个要说的就是，很多学生喜欢用电子设备背单词。","用一些背单词的手机软件。比如百词展，不背单词，默默背单词。但是我还是更提倡，用
